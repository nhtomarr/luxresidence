<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LUX Residence · Sakin</title>
<meta name="description" content="LUX Residence sakinləri üçün tətbiq: servis haqqı, müraciət, qonaq keçidi, rezervasiya, sayğac və elanlar.">
<meta name="theme-color" content="#f6f1eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16100d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LUX Sakin">
<meta name="robots" content="noindex">
<link rel="manifest" href="/sakin.webmanifest">
<link rel="icon" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/favicon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
/* LUX Sakin — tətbiq qabığı. Rənglər: terrakota #ba4d2c, espresso #251712, krem */
:root{--bg:#f6f1eb;--card:#fffdfa;--ink:#251712;--mut:#7d6c62;--line:#ebe2d8;--acc:#ba4d2c;--acc-ink:#fff;--soft:#f3e7de;--ok:#2f7d4f;--okbg:#e5f2ea;--warn:#a5650f;--warnbg:#fbf0dc;--bad:#b23a2a;--badbg:#fbe6e2;--sh:0 1px 2px rgba(37,23,18,.05),0 8px 24px -16px rgba(37,23,18,.25);--r:20px}
@media(prefers-color-scheme:dark){:root{--bg:#16100d;--card:#211915;--ink:#f3ebe4;--mut:#a8988d;--line:#33271f;--acc:#d9693f;--soft:#2c201a;--ok:#6cc08f;--okbg:#1d2b22;--warn:#e0a45a;--warnbg:#2e2416;--bad:#ef7d6b;--badbg:#341d19;--sh:0 1px 2px rgba(0,0,0,.3)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
.serif{font-family:"Playfair Display",Georgia,serif;font-weight:600;letter-spacing:-.01em}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px calc(104px + env(safe-area-inset-bottom))}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* giriş */
#login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;max-width:400px;margin:0 auto;padding:32px 24px}
#login .logo{height:56px;margin-bottom:34px;align-self:flex-start}
#login h1{font-size:30px;margin:0 0 6px}
#login p.lead{color:var(--mut);margin:0 0 28px}
.fld{display:block;margin-bottom:14px}
.fld span{display:block;font-size:13px;color:var(--mut);margin-bottom:6px;font-weight:500}
.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--acc)}
.ph{display:flex;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:14px;overflow:hidden}
.ph:focus-within{border-color:var(--acc)}
.ph b{padding:0 4px 0 14px;font-weight:500;color:var(--mut)}
.ph input{border:none;background:none;outline:none;padding:13px 14px 13px 4px;flex:1;min-width:0;letter-spacing:.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;padding:13px 18px;background:var(--acc);color:var(--acc-ink);font-weight:600;text-decoration:none;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.full{width:100%}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{padding:8px 12px;border-radius:11px;font-size:13.5px}
.btn[disabled]{opacity:.5;pointer-events:none}
.note{font-size:13px;color:var(--mut);margin-top:18px;line-height:1.5}
.err{color:var(--bad);font-size:13.5px;min-height:20px;margin:4px 0 8px}
/* başlıq */
.hd{display:flex;align-items:center;justify-content:space-between;margin:6px 0 18px}
.hd h1{font-size:26px;margin:0}
.hd small{display:block;color:var(--mut);font-size:13px;margin-bottom:2px}
.back{display:inline-flex;align-items:center;gap:4px;border:none;background:none;color:var(--acc);font-weight:600;padding:6px 0;margin-bottom:6px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:-6px 0 16px;scrollbar-width:none}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;white-space:nowrap;font-size:13.5px;font-weight:500}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* kartlar */
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:14px;border:1px solid var(--line)}
.card h3{margin:0 0 10px;font-size:16px;font-weight:600}
.sec{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:600;margin:22px 4px 10px}
.bal{background:var(--ink);color:var(--bg);border:none;padding:22px}
.bal .lbl{opacity:.7;font-size:13px}
.bal .amt{font-size:38px;font-weight:600;letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.bal .st{font-size:14px;opacity:.85}
.bal .meta{display:flex;justify-content:space-between;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:13px;opacity:.85}
@media(prefers-color-scheme:dark){.bal{background:#2d211b;color:var(--ink)}}
.bal .btn{margin-top:16px;background:var(--acc);color:#fff}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px}
.qa button{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:500;box-shadow:var(--sh)}
.qa button svg{color:var(--acc)}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none;padding-bottom:2px}
.li:first-child{padding-top:2px}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:600;font-size:14.5px}
.li .tx small{color:var(--mut);font-size:12.5px}
.li .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.li.tap{cursor:pointer}
.ico{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--acc);flex:none}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:99px;padding:3px 9px;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-bad{background:var(--badbg);color:var(--bad)}.p-mut{background:var(--soft);color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:22px 8px;font-size:14px}
.banner{display:flex;gap:12px;align-items:center;background:var(--warnbg);color:var(--warn);border-radius:16px;padding:13px 14px;margin-bottom:14px;font-size:14px}
.banner b{color:var(--ink)}
.chev{color:var(--mut);width:18px;height:18px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:700;letter-spacing:.06em}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.stars button{border:none;background:none;font-size:22px;color:var(--line);padding:0 2px}
.stars button.on{color:#e0a43a}
.bar{height:7px;border-radius:7px;background:var(--soft);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:7px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 13px;margin-bottom:8px;font-weight:500}
/* alt menyu */
nav.tb{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(528px,calc(100% - 24px));display:flex;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);border-radius:24px;padding:6px;box-shadow:0 12px 30px -14px rgba(37,23,18,.45);z-index:20}
nav.tb button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;font-size:11px;font-weight:500;color:var(--mut);border-radius:18px;position:relative}
nav.tb button.on{color:var(--acc);background:var(--soft)}
nav.tb .dot{position:absolute;top:5px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--card)}
/* alt panel (sheet) */
.sh{position:fixed;inset:0;background:rgba(20,12,9,.42);z-index:40;display:none;align-items:flex-end;justify-content:center}
.sh.on{display:flex;animation:fd .2s}
.sh .box{background:var(--card);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sh .grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.sh h2{font-size:21px;margin:0 0 16px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes fd{from{opacity:0}}
@media(min-width:700px){.sh{align-items:center}.sh .box{border-radius:26px;max-width:460px}}
.qr{display:grid;place-items:center;padding:14px;background:#fff;border-radius:18px;width:max-content;margin:4px auto 10px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.view{display:none}.view.on{display:block;animation:fd .25s}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.skel{height:120px;border-radius:var(--r);background:linear-gradient(90deg,var(--soft),var(--card),var(--soft));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:14px}
@keyframes sk{to{background-position:-200% 0}}
footer.ft{text-align:center;color:var(--mut);font-size:12px;margin-top:26px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ============ GİRİŞ ============ -->
<section id="login" style="display:none">

</section>

 </div>
 <nav class="tb" id="tb">
  <button data-v="home"><svg class="i" viewBox="0 0 24 24"><path d="M3.5 10.5 12 4l8.5 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-4v-6h-6v6H5A1.5 1.5 0 0 1 3.5 19z"/></svg>Evim</button>

  <button data-v="comm"><svg class="i" viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4h0A1.5 1.5 0 0 1 4 14.5z"/></svg>İcma</button>
  <button data-v="me"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-3.6 4-5.3 7.5-5.3s6.3 1.7 7.5 5.3"/></svg>Profil</button>
 </nav>
</div>

<div class="sh" id="sh"><div class="box" id="shBox"></div></div>
<div class="toast" id="toast"></div>

function ic(n,c){return '<svg class="i'+(c?' '+c:'')+'" viewBox="0 0 24 24">'+I[n]+'</svg>';}
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on');},3000);}
function err(e){console.warn(e);toast((e&&e.message)||'Xəta baş verdi, yenidən cəhd edin');}
function run(q){return q.then(function(r){if(r.error)throw r.error;return r.data;});}
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date());}
function curM(){return today().slice(0,7);}
/* 1 250,50 ₼ formatı */
function az(n){n=Math.round((Number(n)||0)*100)/100;var neg=n<0;n=Math.abs(n);var p=n.toFixed(2).split('.');return (neg?'−':'')+p[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ')+','+p[1]+' ₼';}
function dmy(d){d=String(d||'');return d?d.slice(8,10)+'.'+d.slice(5,7)+'.'+d.slice(0,4):'';}
function dt(d){var x=new Date(d);return new Intl.DateTimeFormat('en-GB',{timeZone:TZ,day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(x).replace(',','').replace(/\//g,'.');}
function hm(d){return new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit'}).format(new Date(d));}
var MN=['Yanvar','Fevral','Mart','Aprel','May','İyun','İyul','Avqust','Sentyabr','Oktyabr','Noyabr','Dekabr'];
function mname(m){return MN[+m.slice(5,7)-1]+' '+m.slice(0,4);}
function tsBaku(d,t){return d+'T'+t+':00+04:00';}
function ulabel(u){return 'Bina '+u.bina+', mənzil '+u.number;}
function cu(){return UNITS.find(function(u){return u.id===CUR;});}
function ids(){return UNITS.map(function(u){return u.id;});}
function bal(id){return Number((BAL[id]||{}).balance||0);}
function monthly(u){var s=0;TAR.forEach(function(t){if(!t.active||(t.kinds||[]).indexOf(u.kind)<0||(t.statuses||[]).indexOf(u.status)<0||(t.binas&&t.binas.length&&t.binas.indexOf(u.bina)<0))return;s+=(t.calc==='per_m2'?Number(u.area||0)*t.amount:Number(t.amount));});return s*(1-(Number(u.discount_pct)||0)/100);}
function sheet(h){$('shBox').innerHTML='<div class="grab"></div>'+h;$('sh').classList.add('on');}
function closeSheet(){$('sh').classList.remove('on');}
$('sh').addEventListener('click',function(e){if(e.target===$('sh'))closeSheet();});

/* ---------- giriş ---------- */
function showLogin(){$('app').style.display='none';$('login').style.display='flex';
 if(matchMedia('(prefers-color-scheme:dark)').matches)$('lgLogo').src='/assets/logo-white.png';
 var p=new URLSearchParams(location.search).get('p');if(p)$('lgPhone').value=fmtPhone(p);setTimeout(function(){(p?$('lgPass'):$('lgPhone')).focus();},100);}
function fmtPhone(v){var d=String(v).replace(/\D/g,'').replace(/^994/,'').replace(/^0/,'').slice(0,9);return d.replace(/^(\d{2})(\d{0,3})(\d{0,2})(\d{0,2}).*/,function(m,a,b,c,e){return [a,b,c,e].filter(Boolean).join(' ');});}
$('lgPhone').addEventListener('input',function(){if(/[a-z@]/i.test(this.value))return;this.value=fmtPhone(this.value);});
function doLogin(){var raw=$('lgPhone').value.trim(),pw=$('lgPass').value,em;$('lgErr').textContent='';
 if(raw.indexOf('@')>0)em=raw.toLowerCase();else{var d=raw.replace(/\D/g,'');if(d.length<9){$('lgErr').textContent='Telefon nömrəsini tam yazın';return;}em=d.slice(-9)+'@sakin.luxresidence.az';}
 if(!pw){$('lgErr').textContent='Parolu yazın';return;}
 $('lgBtn').disabled=true;$('lgBtn').textContent='Yoxlanılır…';
 sb.auth.signInWithPassword({email:em,password:pw}).then(function(r){if(r.error)throw r.error;return boot();}).catch(function(e){
  $('lgErr').textContent=/invalid/i.test((e&&e.message)||'')?'Telefon və ya parol yanlışdır':((e&&e.message)||'Giriş alınmadı');}).then(function(){$('lgBtn').disabled=false;$('lgBtn').textContent='Daxil ol';});}
$('lgBtn').onclick=doLogin;$('lgPass').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
$('lgPhone').addEventListener('keydown',function(e){if(e.key==='Enter')$('lgPass').focus();});

/* ---------- açılış ---------- */
function boot(){return sb.auth.getUser().then(function(r){var u=r&&r.data&&r.data.user;if(!u){showLogin();return;}ME=u;
 return run(sb.from('lux_profiles').select('*').eq('user_id',u.id).maybeSingle()).then(function(p){PROF=p||{};
  if(p&&p.active===false){return sb.auth.signOut().then(function(){showLogin();$('lgErr').textContent='Hesabınız aktiv deyil. Komendantlığa müraciət edin.';});}
  $('login').style.display='none';$('app').style.display='';
  return Promise.all([run(sb.from('km_residents').select('unit_id,role').eq('user_id',u.id)),run(sb.from('km_config').select('*').eq('id',1).maybeSingle()).catch(function(){return {};}),run(sb.from('km_tariffs').select('*')).catch(function(){return [];})]).then(function(x){CFG=x[1]||{};TAR=x[2]||[];var uids=x[0].map(function(r){return r.unit_id;});
   if(!uids.length){UNITS=[];return;}
   return Promise.all([run(sb.from('km_units').select('*').in('id',uids)),run(sb.from('km_unit_balance').select('*').in('unit_id',uids))]).then(function(y){UNITS=y[0].sort(function(a,b){return a.bina-b.bina||String(a.number).localeCompare(String(b.number),'az',{numeric:true});});BAL={};y[1].forEach(function(b){BAL[b.unit_id]=b;});
    var sv=+localStorage.getItem('sakin_unit');CUR=(UNITS.find(function(u){return u.id===sv;})||UNITS[0]).id;});});
 }).then(function(){var h=(location.hash||'').slice(1);go(VIEWS[h]?h:'home',true);});}).catch(err);}

/* ---------- naviqasiya ---------- */
var VIEWS={home:rHome,pay:rPay,svc:rSvc,req:rReq,guest:rGuest,book:rBook,meter:rMeter,parcel:rParcel,comm:rComm,me:rMe};
var TABOF={home:'home',pay:'pay',svc:'svc',req:'svc',guest:'svc',book:'svc',meter:'svc',parcel:'svc',comm:'comm',me:'me'};
function go(v,noPush){document.querySelectorAll('.view').forEach(function(x){x.classList.toggle('on',x.id==='v-'+v);});
 document.querySelectorAll('#tb button').forEach(function(b){b.classList.toggle('on',b.dataset.v===TABOF[v]);});
 if(!noPush)history.pushState({v:v},'','#'+v);else history.replaceState({v:v},'','#'+v);
 window.scrollTo(0,0);try{VIEWS[v]();}catch(e){err(e);}}
window.addEventListener('popstate',function(e){var v=(e.state&&e.state.v)||'home';document.querySelectorAll('.view').forEach(function(x){x.classList.toggle('on',x.id==='v-'+v);});document.querySelectorAll('#tb button').forEach(function(b){b.classList.toggle('on',b.dataset.v===TABOF[v]);});VIEWS[v]&&VIEWS[v]();});
$('tb').onclick=function(e){var b=e.target.closest('button');if(b)go(b.dataset.v);};
function backBtn(){return '<button class="back" onclick="history.length>1?history.back():go(\'svc\')">'+ic('back')+'Xidmətlər</button>';}
function unitChips(){return UNITS.length>1?'<div class="chips">'+UNITS.map(function(u){return '<button class="'+(u.id===CUR?'on':'')+'" onclick="pickUnit('+u.id+')">B'+u.bina+' · '+esc(u.number)+'</button>';}).join('')+'</div>':'';}
function pickUnit(id){CUR=id;try{localStorage.setItem('sakin_unit',id);}catch(e){}var a=document.querySelector('.view.on');VIEWS[a.id.slice(2)]();}
function noUnit(el){$(el).innerHTML='<div class="hd"><h1 class="serif">LUX Residence</h1></div><div class="card empty">Hesabınız hələ mənzilə bağlanmayıb.<br>Komendantlığa müraciət edin'+(CFG.phone?': <a href="tel:'+esc(CFG.phone)+'">'+esc(CFG.phone)+'</a>':'')+'.</div>';}
function hello(){var h=+new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'numeric',hourCycle:'h23'}).format(new Date());return h<5?'Gecəniz xeyrə':h<12?'Sabahınız xeyir':h<18?'Günortanız xeyir':'Axşamınız xeyir';}
function firstName(){var n=String(PROF.full_name||'').trim().split(/\s+/);return n[0]||'';}

  '<div class="meta"><span>Aylıq: '+az(m)+'</span><span>Son gün: ayın '+due+'-i</span></div>'+(b>0.009?'<button class="btn full" onclick="go(\'pay\')">Necə ödəyim?</button>':'')+'</div>'+

  '<div class="qa"><button onclick="go(\'req\');setTimeout(newReq,50)">'+ic('req')+'Müraciət</button><button onclick="go(\'guest\');setTimeout(newGuest,50)">'+ic('guest')+'Qonaq</button><button onclick="go(\'book\')">'+ic('book')+'Rezerv</button><button onclick="go(\'meter\')">'+ic('meter')+'Sayğac</button></div>'+
  '<div class="sec">Açıq müraciətlər</div><div class="card" id="hReq"><div class="empty">…</div></div>'+
  '<div class="sec">Son elan</div><div class="card" id="hAnn"><div class="empty">…</div></div>';
 Promise.all([run(sb.from('km_parcels').select('*').in('unit_id',ids()).is('picked_at',null)),run(sb.from('km_requests').select('*').in('unit_id',ids()).in('status',['new','accepted','in_progress']).order('created_at',{ascending:false}).limit(3)),run(sb.from('km_announcements').select('*').order('created_at',{ascending:false}).limit(1))]).then(function(r){
  var p=r[0];$('hParcel').innerHTML=p.length?'<div class="banner tap" onclick="go(\'parcel\')" style="cursor:pointer">'+ic('parcel')+'<div style="flex:1"><b>'+p.length+' bağlamanız mühafizədə gözləyir</b><br>Götürmək üçün girişdə adınızı deyin.</div>'+ic('chev','chev')+'</div>':'';
  $('hReq').innerHTML=r[1].map(reqLi).join('')||'<div class="empty">Açıq müraciət yoxdur. Problem olsa, «Müraciət» düyməsini basın.</div>';
  var a=r[2][0];$('hAnn').innerHTML=a?'<div class="li tap" onclick="go(\'comm\')"><div class="tx"><b>'+esc(a.title)+'</b><small>'+dmy(String(a.created_at).slice(0,10))+' · '+esc(String(a.body||'').slice(0,90))+(String(a.body||'').length>90?'…':'')+'</small></div>'+ic('chev','chev')+'</div>':'<div class="empty">Elan yoxdur</div>';
  dotTabs(p.length);}).catch(err);}
function dotTabs(n){var b=document.querySelector('#tb button[data-v="svc"]');var d=b.querySelector('.dot');if(n&&!d)b.insertAdjacentHTML('beforeend','<span class="dot"></span>');if(!n&&d)d.remove();}

/* ---------- ÖDƏNİŞ ---------- */
function rPay(){var u=cu();if(!u)return noUnit('v-pay');var b=bal(u.id),purpose='B'+u.bina+' '+u.number;
 $('v-pay').innerHTML='<div class="hd"><div><small>'+esc(ulabel(u))+'</small><h1 class="serif">Ödəniş</h1></div></div>'+unitChips()+
  '<div class="card"><div class="row sp"><span style="color:var(--mut)">Cari borc</span><b style="font-size:22px">'+(b>0.009?az(b):'0,00 ₼')+'</b></div></div>'+
  '<div class="card"><h3>Bank köçürməsi ilə</h3>'+(CFG.bank_info?'<p style="white-space:pre-line;margin:0 0 12px">'+esc(CFG.bank_info)+'</p>':'<p style="margin:0 0 12px;color:var(--mut)">Bank rekvizitləri tezliklə burada olacaq. Hələlik ödənişi komendantlıqda edin.</p>')+
  '<div style="background:var(--soft);border-radius:14px;padding:12px 14px"><div style="font-size:12.5px;color:var(--mut)">Təyinata mütləq bunu yazın</div><div class="row sp"><span class="code">'+esc(purpose)+'</span><button class="btn ghost sm" onclick="copyTxt(\''+esc(purpose)+'\')">'+ic('copy')+'Kopyala</button></div></div>'+
  '<p class="note" style="margin-top:12px">Bu təyinatla gələn ödəniş 15 dəqiqə ərzində avtomatik sizin mənzilə yazılır.</p></div>'+
  '<div class="card" style="opacity:.75"><h3>Kartla onlayn</h3><p style="margin:0;color:var(--mut)">Bank kartı ilə birbaşa ödəniş qoşulma mərhələsindədir.</p></div>'+
  '<div class="sec">Hesab çıxarışı</div><div class="card" id="pStmt"><div class="empty">…</div></div>';
 Promise.all([run(sb.from('km_charges').select('*').eq('unit_id',u.id)),run(sb.from('km_payments').select('*').eq('unit_id',u.id))]).then(function(r){var rows=[];
  r[0].forEach(function(c){rows.push({d:c.period+'-01',t:mname(c.period),s:c.title||'Servis haqqı',v:Number(c.amount),k:'c'});});
  r[1].forEach(function(p){rows.push({d:p.paid_at,t:'Ödəniş',s:dmy(p.paid_at)+' · qəbz №'+p.receipt_no+(PM[p.method]?' · '+PM[p.method]:''),v:Number(p.amount),k:'p'});});
  rows.sort(function(a,b){return a.d>b.d?-1:1;});
  $('pStmt').innerHTML=rows.map(function(x){return '<div class="li"><div class="tx"><b>'+esc(x.t)+'</b><small>'+esc(x.s)+'</small></div><div class="v" style="color:'+(x.k==='p'?'var(--ok)':'inherit')+'">'+(x.k==='p'?'+':'')+az(x.v)+'</div></div>';}).join('')||'<div class="empty">Hələ hesablama yoxdur</div>';}).catch(err);}
function copyTxt(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('Kopyalandı');}).catch(function(){prompt('Kopyalayın:',t);});}

function rSvc(){var L=[['req','req','Müraciətlər','Santexnika, elektrik, lift, təmizlik'],['guest','guest','Qonaq keçidi','Birdəfəlik QR kod, WhatsApp-da göndər'],['book','book','Rezervasiya','Ümumi zonalar: zal, meydança və s.'],['meter','meter','Sayğaclar','Aylıq göstəricini daxil et'],['parcel','parcel','Bağlamalar','Mühafizədə gözləyən bağlamalar']];
 $('v-svc').innerHTML='<div class="hd"><h1 class="serif">Xidmətlər</h1></div><div class="card">'+L.map(function(x){return '<div class="li tap" onclick="go(\''+x[0]+'\')"><div class="ico">'+ic(x[1])+'</div><div class="tx"><b>'+x[2]+'</b><small>'+x[3]+'</small></div>'+ic('chev','chev')+'</div>';}).join('')+'</div>'+
 '<div class="card"><div class="li"><div class="ico" style="color:var(--bad)">'+ic('alert')+'</div><div class="tx"><b>Təcili hal?</b><small>Su basması, yanğın təhlükəsi, lift qalması</small></div>'+(CFG.phone?'<a class="btn sm" href="tel:'+esc(CFG.phone)+'">Zəng et</a>':'')+'</div></div>';}

/* müraciətlər */
function reqLi(q){var s=RST[q.status]||['',''];return '<div class="li"><div class="tx"><b>'+esc(q.title)+'</b><small>'+(RCAT[q.category]||'')+' · '+dt(q.created_at)+(q.priority==='urgent'?' · <span style="color:var(--bad)">təcili</span>':'')+'</small>'+(q.staff_note?'<div style="font-size:13.5px;margin-top:5px">Komendantlıq: '+esc(q.staff_note)+'</div>':'')+(q.status==='done'?'<div class="stars">'+[1,2,3,4,5].map(function(n){return '<button class="'+(q.rating>=n?'on':'')+'" aria-label="'+n+' ulduz" onclick="rate('+q.id+','+n+')">★</button>';}).join('')+'</div>':'')+'</div><span class="pill '+s[1]+'">'+s[0]+'</span></div>';}
function rReq(){if(!cu())return noUnit('v-req');$('v-req').innerHTML=backBtn()+'<div class="hd"><h1 class="serif">Müraciətlər</h1><button class="btn sm" onclick="newReq()">+ Yeni</button></div>'+unitChips()+'<div class="card" id="rqL"><div class="empty">…</div></div>';
 run(sb.from('km_requests').select('*').in('unit_id',ids()).order('created_at',{ascending:false}).limit(50)).then(function(l){$('rqL').innerHTML=l.map(reqLi).join('')||'<div class="empty">Hələ müraciətiniz yoxdur</div>';}).catch(err);}
function newReq(){sheet('<h2 class="serif">Yeni müraciət</h2><label class="fld"><span>Mövzu</span><select class="inp" id="qC">'+Object.keys(RCAT).map(function(k){return '<option value="'+k+'">'+RCAT[k]+'</option>';}).join('')+'</select></label><label class="fld"><span>Nə baş verib?</span><input class="inp" id="qT" placeholder="məs: mətbəxdə kran damcılayır" maxlength="120"></label><label class="fld"><span>Ətraflı (istəyə bağlı)</span><textarea class="inp" id="qD" rows="3"></textarea></label><label class="fld"><span>Şəkil (3-ə qədər)</span><input class="inp" id="qF" type="file" accept="image/*" multiple></label><label class="row" style="margin:4px 0 16px;font-size:14px"><input type="checkbox" id="qU" style="width:20px;height:20px;accent-color:var(--bad)"> Təcilidir (su basması, elektrik, lift)</label><button class="btn full" id="qBtn" onclick="saveReq()">Göndər</button>');setTimeout(function(){$('qT').focus();},250);}
function saveReq(){var u=cu(),t=$('qT').value.trim();if(!t)return toast('Nə baş verdiyini yazın');var files=[].slice.call($('qF').files||[]).slice(0,3);$('qBtn').disabled=true;$('qBtn').textContent='Göndərilir…';
 Promise.all(files.map(function(f){return shrink(f).then(function(bl){var p=u.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.webp';return sb.storage.from('komendant').upload(p,bl,{contentType:bl.type}).then(function(r){if(r.error)throw r.error;return p;});});})).then(function(paths){
  return run(sb.from('km_requests').insert({unit_id:u.id,category:$('qC').value,title:t,description:$('qD').value.trim(),photos:paths,priority:$('qU').checked?'urgent':'normal',created_by:ME.id,status:'new'}).select().single());})
 .then(function(q){closeSheet();toast('Müraciət göndərildi — komendantlıq bildiriş aldı');notify('request_new',{id:q.id});go('req',true);}).catch(function(e){$('qBtn').disabled=false;$('qBtn').textContent='Göndər';err(e);});}
/* şəkli WebP-yə kiçilt (1600px) */
function shrink(f){return new Promise(function(res){var img=new Image(),url=URL.createObjectURL(f);img.onload=function(){var s=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(function(b){URL.revokeObjectURL(url);res(b||f);},'image/webp',.82);};img.onerror=function(){res(f);};img.src=url;});}
function rate(id,n){run(sb.from('km_requests').update({rating:n}).eq('id',id)).then(function(){toast('Təşəkkür edirik!');var v=document.querySelector('.view.on').id.slice(2);VIEWS[v]();}).catch(err);}
function notify(a,p){try{sb.functions.invoke('km-notify',{body:Object.assign({action:a},p||{})}).catch(function(){});}catch(e){}}

/* qonaq */

 run(sb.from('km_guest_passes').select('*').in('unit_id',ids()).gte('valid_date',today()).order('valid_date')).then(function(g){CACHE.g=g;$('gL').innerHTML=g.map(function(x){return '<div class="li tap" onclick="showPass('+x.id+')"><div class="ico">'+ic('guest')+'</div><div class="tx"><b>'+esc(x.guest_name)+'</b><small>'+dmy(x.valid_date)+(x.car_plate?' · '+esc(x.car_plate):'')+' · kod '+esc(x.code)+'</small></div>'+(x.used_at?'<span class="pill p-ok">keçib</span>':ic('chev','chev'))+'</div>';}).join('')||'<div class="empty">Aktiv keçid yoxdur</div>';}).catch(err);}
function newGuest(){sheet('<h2 class="serif">Qonaq keçidi</h2><label class="fld"><span>Qonağın adı</span><input class="inp" id="gN" maxlength="60"></label><div class="grid2"><label class="fld"><span>Tarix</span><input class="inp" id="gD" type="date" min="'+today()+'" value="'+today()+'"></label><label class="fld"><span>Maşın nömrəsi</span><input class="inp" id="gC" placeholder="10-AB-123" maxlength="12"></label></div><button class="btn full" id="gBtn" onclick="saveGuest()">Keçid yarat</button>');setTimeout(function(){$('gN').focus();},250);}
function saveGuest(){var n=$('gN').value.trim();if(!n)return toast('Qonağın adını yazın');$('gBtn').disabled=true;
 run(sb.from('km_guest_passes').insert({unit_id:CUR,guest_name:n,car_plate:$('gC').value.trim().toUpperCase(),valid_date:$('gD').value||today()}).select().single()).then(function(p){(CACHE.g=CACHE.g||[]).push(p);rGuest();showPass(p.id,p);}).catch(function(e){$('gBtn').disabled=false;err(e);});}
function showPass(id,p){p=p||(CACHE.g||[]).find(function(x){return x.id===id;});if(!p)return;var u=cu(),link=location.origin+'/komendant?g='+p.code;
 var txt='Salam! LUX Residence-ə qonaq keçidiniz: '+dmy(p.valid_date)+', kod '+p.code+'. Girişdə mühafizəyə göstərin: '+link;

 var t=setInterval(function(){if(window.QRCode){clearInterval(t);try{new QRCode($('gQr'),{text:link,width:200,height:200,colorDark:'#251712'});}catch(e){}}},80);setTimeout(function(){clearInterval(t);},5000);}

  var mine=bk.filter(function(b){return ids().indexOf(b.unit_id)>=0;});
  $('bkBody').innerHTML=(mine.length?'<div class="sec">Mənim rezervasiyalarım</div><div class="card">'+mine.map(function(b){var a=AM[b.amenity_id]||{};return '<div class="li"><div class="tx"><b>'+esc(a.name||'')+'</b><small>'+dt(b.starts_at)+' – '+hm(b.ends_at)+'</small></div><span class="pill '+(b.status==='approved'?'p-ok':b.status==='pending'?'p-warn':'p-mut')+'">'+({approved:'təsdiqli',pending:'gözləyir',rejected:'rədd'}[b.status]||b.status)+'</span>'+(b.status!=='rejected'?'<button class="btn ghost sm" onclick="cancelBook('+b.id+')">Ləğv</button>':'')+'</div>';}).join('')+'</div>':'')+
   '<div class="sec">Zonalar</div>'+(am.map(function(a){var busy=bk.filter(function(b){return b.amenity_id===a.id&&String(b.starts_at).slice(0,10)===today();});return '<div class="card"><div class="row sp"><div><b style="font-size:16px">'+esc(a.name)+'</b><div style="color:var(--mut);font-size:13px">'+String(a.open_from).slice(0,5)+'–'+String(a.open_to).slice(0,5)+' · '+a.max_hours+' saata qədər · '+(Number(a.price)?az(a.price)+'/saat':'pulsuz')+'</div></div><button class="btn sm" onclick="newBook('+a.id+')">Seç</button></div>'+(a.rules?'<p style="color:var(--mut);font-size:13px;margin:8px 0 0">'+esc(String(a.rules).replace('[demo] ',''))+'</p>':'')+(busy.length?'<p style="font-size:13px;margin:8px 0 0">Bu gün tutulub: '+busy.map(function(b){return hm(b.starts_at)+'–'+hm(b.ends_at);}).join(', ')+'</p>':'')+'</div>';}).join('')||'<div class="card empty">Rezerv edilə bilən zona yoxdur</div>');}).catch(err);}
function newBook(aid){var a=(CACHE.am||[]).find(function(x){return x.id===aid;});sheet('<h2 class="serif">'+esc(a.name)+'</h2><label class="fld"><span>Tarix</span><input class="inp" id="bkD" type="date" min="'+today()+'" value="'+today()+'"></label><div class="grid2"><label class="fld"><span>Başlayır</span><input class="inp" id="bkS" type="time" value="18:00"></label><label class="fld"><span>Bitir</span><input class="inp" id="bkE" type="time" value="19:00"></label></div><label class="fld"><span>Qeyd</span><input class="inp" id="bkN" maxlength="120"></label><button class="btn full" id="bkBtn" onclick="saveBook('+aid+')">'+(a.needs_approval?'Sorğu göndər':'Rezerv et')+'</button><p class="note">İş saatı '+String(a.open_from).slice(0,5)+'–'+String(a.open_to).slice(0,5)+', maksimum '+a.max_hours+' saat.'+(a.needs_approval?' Komendantlıq təsdiq edəndən sonra aktiv olur.':'')+'</p>');}
function saveBook(aid){var a=(CACHE.am||[]).find(function(x){return x.id===aid;}),d=$('bkD').value,s=$('bkS').value,e=$('bkE').value,f=String(a.open_from).slice(0,5),t=String(a.open_to).slice(0,5);
 if(!d||!s||!e||e<=s)return toast('Vaxtı düzgün seçin');if(s<f||e>t)return toast('İş saatı: '+f+'–'+t);var h=(+e.slice(0,2)-+s.slice(0,2))+(+e.slice(3)-+s.slice(3))/60;if(h>a.max_hours)return toast('Maksimum '+a.max_hours+' saat');
 $('bkBtn').disabled=true;run(sb.from('km_bookings').insert({amenity_id:aid,unit_id:CUR,starts_at:tsBaku(d,s),ends_at:tsBaku(d,e),status:a.needs_approval?'pending':'approved',note:$('bkN').value.trim(),created_by:ME.id})).then(function(){closeSheet();toast(a.needs_approval?'Sorğu göndərildi, təsdiq gözləyir':'Rezerv edildi');rBook();}).catch(function(x){$('bkBtn').disabled=false;toast(/exclu|overlap|conflict/i.test((x&&x.message)||'')?'Bu vaxt artıq tutulub':((x&&x.message)||'Xəta'));});}
function cancelBook(id){sheet('<h2 class="serif">Rezervasiya ləğv edilsin?</h2><div class="grid2"><button class="btn ghost" onclick="closeSheet()">Xeyr</button><button class="btn" onclick="run(sb.from(\'km_bookings\').update({status:\'cancelled\'}).eq(\'id\','+id+')).then(function(){closeSheet();toast(\'Ləğv edildi\');rBook();}).catch(err)">Bəli, ləğv et</button></div>');}

/* sayğaclar */
function rMeter(){var u=cu();if(!u)return noUnit('v-meter');$('v-meter').innerHTML=backBtn()+'<div class="hd"><h1 class="serif">Sayğaclar</h1></div>'+unitChips()+'<div id="mBody"><div class="skel"></div></div>';
 run(sb.from('km_meters').select('*').eq('unit_id',u.id)).then(function(ms){CACHE.ms=ms;return (ms.length?run(sb.from('km_readings').select('*').in('meter_id',ms.map(function(m){return m.id;})).order('period',{ascending:false})):Promise.resolve([])).then(function(rd){var m=curM();
  $('mBody').innerHTML=ms.map(function(x){var t=MT[x.type]||[x.type,''],rr=rd.filter(function(y){return y.meter_id===x.id;}),c=rr.find(function(y){return y.period===m;});
   return '<div class="card"><div class="row sp"><b style="font-size:16px">'+t[0]+'</b><small style="color:var(--mut)">№ '+esc(x.serial||'—')+'</small></div>'+
   (c?'<p style="margin:10px 0">'+mname(m)+': <b>'+c.value+' '+t[1]+'</b> <span class="pill p-ok">qəbul edildi</span></p>':'<p style="margin:10px 0"><span class="pill p-warn">'+mname(m)+' göstəricisi gözlənilir</span></p>')+
   '<button class="btn '+(c?'ghost ':'')+'sm" onclick="enterRd('+x.id+')">'+(c?'Düzəlt':'Göstərici daxil et')+'</button>'+
   (rr.length?'<div style="margin-top:12px">'+rr.slice(0,6).map(function(y,i){var pr=rr[i+1];return '<div class="li"><div class="tx"><b style="font-weight:500">'+mname(y.period)+'</b></div><span style="color:var(--mut);font-size:13px">'+(pr?'+'+(y.value-pr.value).toFixed(2)+' '+t[1]:'')+'</span><span class="v">'+y.value+'</span></div>';}).join('')+'</div>':'')+'</div>';}).join('')||'<div class="card empty">Mənzilinizə sayğac qeyd olunmayıb</div>';});}).catch(err);}
function enterRd(mid){var x=(CACHE.ms||[]).find(function(m){return m.id===mid;}),t=MT[x.type]||[x.type,''];sheet('<h2 class="serif">'+t[0]+'</h2><label class="fld"><span>'+mname(curM())+' göstəricisi, '+t[1]+'</span><input class="inp" id="rdV" inputmode="decimal" placeholder="məs: 128,4" style="font-size:22px"></label><button class="btn full" onclick="saveRd('+mid+')">Yadda saxla</button><p class="note">Sayğacın üzərindəki rəqəmləri vergülə qədər yazın.</p>');setTimeout(function(){$('rdV').focus();},250);}
function saveRd(mid){var n=parseFloat(String($('rdV').value).replace(/\s/g,'').replace(',','.'));if(!(n>=0))return toast('Rəqəm yazın');run(sb.from('km_readings').upsert({meter_id:mid,period:curM(),value:n},{onConflict:'meter_id,period'})).then(function(){closeSheet();toast('Göstərici qəbul edildi');rMeter();}).catch(err);}

/* bağlamalar */
function rParcel(){if(!cu())return noUnit('v-parcel');$('v-parcel').innerHTML=backBtn()+'<div class="hd"><h1 class="serif">Bağlamalar</h1></div><div class="card" id="pcL"><div class="empty">…</div></div>';
 run(sb.from('km_parcels').select('*').in('unit_id',ids()).order('received_at',{ascending:false}).limit(30)).then(function(p){dotTabs(p.filter(function(x){return !x.picked_at;}).length);$('pcL').innerHTML=p.map(function(x){return '<div class="li"><div class="ico">'+ic('parcel')+'</div><div class="tx"><b>'+esc(x.courier||'Bağlama')+'</b><small>'+dt(x.received_at)+(x.description?' · '+esc(x.description):'')+'</small></div>'+(x.picked_at?'<span class="pill p-mut">götürülüb</span>':'<span class="pill p-warn">gözləyir</span>')+'</div>';}).join('')||'<div class="empty">Bağlama yoxdur. Kuryer gətirəndə mühafizə qeyd edəcək və burada görünəcək.</div>';}).catch(err);}

/* ---------- İCMA ---------- */
function rComm(){var u=cu();$('v-comm').innerHTML='<div class="hd"><h1 class="serif">İcma</h1></div><div class="chips" id="cmT"><button class="on" data-k="ann">Elanlar</button><button data-k="poll">Səsvermə</button><button data-k="doc">Sənədlər</button></div><div id="cmB"><div class="skel"></div></div>';
 $('cmT').onclick=function(e){var b=e.target.closest('button');if(!b)return;[].forEach.call(this.children,function(x){x.classList.toggle('on',x===b);});cmShow(b.dataset.k);};cmShow('ann');}
function cmShow(k){var B=$('cmB'),u=cu();[].forEach.call($('cmT').children,function(x){x.classList.toggle('on',x.dataset.k===k);});B.innerHTML='<div class="skel"></div>';
 if(k==='ann')return run(sb.from('km_announcements').select('*').order('created_at',{ascending:false}).limit(30)).then(function(a){B.innerHTML=a.map(function(x){return '<div class="card"><small style="color:var(--mut)">'+dmy(String(x.created_at).slice(0,10))+'</small><h3 style="margin:4px 0 6px">'+esc(x.title)+'</h3><p style="margin:0;white-space:pre-line">'+esc(x.body)+'</p></div>';}).join('')||'<div class="card empty">Elan yoxdur</div>';}).catch(err);
 if(k==='doc')return run(sb.from('km_docs').select('*').order('created_at',{ascending:false})).then(function(d){B.innerHTML='<div class="card">'+(d.map(function(x){return '<div class="li'+(x.path?' tap':'')+'"'+(x.path?' onclick="openDoc(\''+encodeURIComponent(x.path)+'\')"':'')+'><div class="ico">'+ic('doc')+'</div><div class="tx"><b>'+esc(x.title)+'</b><small>'+esc(x.category||'')+' · '+dmy(String(x.created_at).slice(0,10))+'</small></div>'+(x.path?ic('chev','chev'):'')+'</div>';}).join('')||'<div class="empty">Sənəd yoxdur</div>')+'</div>';}).catch(err);
 Promise.all([run(sb.from('km_polls').select('*').order('created_at',{ascending:false})),run(sb.from('km_votes').select('*').in('unit_id',ids()))]).then(function(r){var ps=r[0];return Promise.all(ps.map(function(p){return sb.rpc('km_poll_results',{p_poll:p.id}).then(function(x){return x.data;});})).then(function(res){
  B.innerHTML=ps.map(function(p,i){var my=r[1].find(function(v){return v.poll_id===p.id&&u&&v.unit_id===u.id;}),R=res[i]||{},tot=R.total||0,open=p.ends_at>=today(),can=open&&!my&&u;
   return '<div class="card"><div class="row sp" style="align-items:flex-start"><h3 style="margin:0">'+esc(p.title)+'</h3><span class="pill '+(open?'p-ok':'p-mut')+'">'+(open?dmy(p.ends_at)+'-dək':'bitib')+'</span></div>'+(p.body?'<p style="margin:6px 0 12px;color:var(--mut);font-size:14px">'+esc(p.body)+'</p>':'<div style="height:10px"></div>')+
   (p.options||[]).map(function(o,j){var c=((R.votes)||{})[j]||0,pc=tot?Math.round(c/tot*100):0;return can?'<button class="opt" onclick="vote('+p.id+','+j+',this)">'+esc(o)+'</button>':'<div style="margin-bottom:10px"><div class="row sp" style="font-size:14px"><span>'+(my&&my.option===j?'<b>✓ </b>':'')+esc(o)+'</span><b>'+pc+'%</b></div><div class="bar"><i style="width:'+pc+'%"></i></div></div>';}).join('')+
   '<small style="color:var(--mut)">'+tot+' səs'+(can?' · seçim qəti olur':'')+'</small></div>';}).join('')||'<div class="card empty">Aktiv səsvermə yoxdur</div>';});}).catch(err);}
function vote(pid,opt,btn){sheet('<h2 class="serif">Səsiniz qəti olacaq</h2><p style="margin:-6px 0 18px">Seçim: <b>'+esc(btn.textContent)+'</b></p><div class="grid2"><button class="btn ghost" onclick="closeSheet()">Geri</button><button class="btn" onclick="run(sb.from(\'km_votes\').insert({poll_id:'+pid+',unit_id:CUR,option:'+opt+'})).then(function(){closeSheet();toast(\'Səsiniz qəbul edildi\');cmShow(\'poll\');}).catch(err)">Təsdiq et</button></div>');}
function openDoc(p){sb.storage.from('komendant').createSignedUrl(decodeURIComponent(p),300).then(function(r){if(r.data)window.open(r.data.signedUrl,'_blank');else toast('Fayl açılmadı');});}

/* ---------- PROFİL ---------- */
function rMe(){var nm=PROF.full_name||'',ph=String(ME.email||'').indexOf('@sakin.')>0?'+994 '+fmtPhone(ME.email.split('@')[0]):ME.email;
 $('v-me').innerHTML='<div class="hd"><div><small>'+esc(ph)+'</small><h1 class="serif">'+esc(nm||'Profil')+'</h1></div></div>'+
 '<div class="sec">Mənzillərim</div><div class="card">'+(UNITS.map(function(u){return '<div class="li"><div class="ico">'+ic('home')+'</div><div class="tx"><b>'+esc(ulabel(u))+'</b><small>'+(u.rooms?u.rooms+' otaq · ':'')+(u.area?u.area+' m²':'')+'</small></div></div>';}).join('')||'<div class="empty">Bağlı mənzil yoxdur</div>')+'</div>'+
 '<div class="sec">Tətbiq</div><div class="card">'+
  '<div class="li tap" id="pushRow" onclick="enablePush()"><div class="ico">'+ic('bell')+'</div><div class="tx"><b>Bildirişlər</b><small id="pushSt">Yoxlanılır…</small></div>'+ic('chev','chev')+'</div>'+
  '<div class="li tap" onclick="installHelp()"><div class="ico">'+ic('install')+'</div><div class="tx"><b>Ana ekrana əlavə et</b><small>Tətbiq kimi bir toxunuşla açılsın</small></div>'+ic('chev','chev')+'</div>'+
  '<div class="li tap" onclick="chPass()"><div class="ico">'+ic('key')+'</div><div class="tx"><b>Parolu dəyiş</b><small>Komendantlığın verdiyi parolu öz parolunuzla əvəz edin</small></div>'+ic('chev','chev')+'</div></div>'+
 '<div class="sec">Əlaqə</div><div class="card">'+(CFG.phone?'<div class="li"><div class="ico">'+ic('phone')+'</div><div class="tx"><b>Komendantlıq</b><small>'+esc(CFG.phone)+'</small></div><a class="btn sm" href="tel:'+esc(CFG.phone)+'">Zəng</a></div>':'')+
  '<div class="li"><div class="tx"><b>Təcili xidmətlər</b><small>Yanğın 101 · Polis 102 · Təcili yardım 103 · Qaz 104</small></div></div></div>'+
 '<button class="btn ghost full" style="margin-top:6px" onclick="logout()">'+ic('out')+'Çıxış</button>';
 pushState();}
function logout(){sb.auth.signOut().then(function(){location.href='/sakin';});}
function chPass(){sheet('<h2 class="serif">Yeni parol</h2><label class="fld"><span>Yeni parol (ən az 6 simvol)</span><input class="inp" id="np1" type="password" autocomplete="new-password"></label><label class="fld"><span>Təkrar</span><input class="inp" id="np2" type="password" autocomplete="new-password"></label><button class="btn full" onclick="savePass()">Yadda saxla</button>');}
function savePass(){var a=$('np1').value,b=$('np2').value;if(a.length<6)return toast('Ən az 6 simvol');if(a!==b)return toast('Parollar eyni deyil');sb.auth.updateUser({password:a}).then(function(r){if(r.error)throw r.error;closeSheet();toast('Parol dəyişdi');}).catch(err);}
function installHelp(){if(window._bip){window._bip.prompt();window._bip=null;return;}var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
 sheet('<h2 class="serif">Ana ekrana əlavə et</h2>'+(ios?'<p>1. Safari-də aşağıdakı <b>Paylaş</b> düyməsini basın (kvadrat və ox).</p><p>2. <b>«Ana ekrana»</b> (Add to Home Screen) seçin.</p><p>3. <b>«Əlavə et»</b> basın — «LUX Sakin» ikonu yaranacaq.</p>':'<p>Brauzer menyusunu (⋮) açın və <b>«Tətbiqi quraşdır»</b> və ya <b>«Ana ekrana əlavə et»</b> seçin.</p>')+'<button class="btn full" onclick="closeSheet()">Aydındır</button>');}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window._bip=e;});
/* push bildirişləri — Baş Ofis VAPID açarı və office_push_subs */
function b64u(s){var p='='.repeat((4-s.length%4)%4),b=(s+p).replace(/-/g,'+').replace(/_/g,'/'),r=atob(b),o=new Uint8Array(r.length);for(var i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o;}
function pushState(){var el=$('pushSt');if(!el)return;if(!('serviceWorker' in navigator)||!('PushManager' in window)){el.textContent=/iphone|ipad/i.test(navigator.userAgent)?'iPhone-da əvvəl ana ekrana əlavə edin':'Bu brauzer dəstəkləmir';return;}
 if(Notification.permission==='denied'){el.textContent='Brauzer ayarlarında bloklanıb';return;}
 navigator.serviceWorker.ready.then(function(r){return r.pushManager.getSubscription();}).then(function(s){el.textContent=s&&Notification.permission==='granted'?'Aktivdir — elan, müraciət cavabı, bağlama':'Aktiv et: elan, müraciət cavabı, bağlama';}).catch(function(){el.textContent='Aktiv et';});}
function enablePush(){if(!('Notification' in window)||!('serviceWorker' in navigator))return installHelp();Notification.requestPermission().then(function(p){if(p!=='granted')throw new Error('İcazə verilmədi');
 return Promise.all([navigator.serviceWorker.ready,sb.rpc('office_push_key')]).then(function(r){return r[0].pushManager.getSubscription().then(function(o){return o||r[0].pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(r[1].data)});});});})
 .then(function(s){var j=s.toJSON();return run(sb.from('office_push_subs').upsert({user_id:ME.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,ua:'sakin'},{onConflict:'endpoint'}));}).then(function(){toast('Bildirişlər aktivdir');pushState();}).catch(err);}

if('serviceWorker' in navigator)navigator.serviceWorker.register('/ofis-sw.js',{scope:'/'}).catch(function(){});
sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT'){ME=null;showLogin();}});
boot();
</script>
