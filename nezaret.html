<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8"><link rel="preconnect" href="https://avqchschbbltnnasabdm.supabase.co" crossorigin>

<meta name="theme-color" content="#0f172a">
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--acc:#2563eb}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.top{background:#0f172a;color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5}
.top b{font-size:17px}.top small{display:block;color:#94a3b8;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
h2{font-size:20px;margin:22px 0 10px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:4px 0 6px;scrollbar-width:none}.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 15px;font-weight:600;white-space:nowrap;cursor:pointer}.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.st{border-radius:16px;padding:14px;border:1px solid var(--line);background:#fff}.st .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}.st b{font-size:15px}.st .m{color:var(--mut);font-size:12px;margin-top:4px}
.bars{display:flex;gap:2px;margin-top:10px;height:22px;align-items:flex-end}.bars i{flex:1;border-radius:2px;background:var(--ok);height:100%}.bars i.x{background:var(--bad)}.bars i.n{background:var(--line)}
.btn{border:none;background:var(--acc);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:14px}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:7px 11px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.mut{color:var(--mut)}.small{font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:13.5px}th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--line)}td{padding:9px 6px;border-bottom:1px solid #f1f5f9;vertical-align:top}
.tbl{overflow-x:auto}.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;background:#f1f5f9;color:#475569}.p-ok{background:#dcfce7;color:#166534}.p-bad{background:#fee2e2;color:#991b1b}.p-warn{background:#fef3c7;color:#92400e}.p-acc{background:#dbeafe;color:#1e40af}
.diff{font-size:12px;line-height:1.5}.diff s{color:#b91c1c}.diff ins{color:#15803d;text-decoration:none}
pre{white-space:pre-wrap;font-size:11.5px;background:#f8fafc;border-radius:10px;padding:8px;margin-top:6px;max-height:180px;overflow:auto}
.empty{color:var(--mut);text-align:center;padding:24px}select,input{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;background:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:99px;font-weight:600;z-index:99;display:none}
</style>
</head>
<body>
<div class="top"><div><b>Sistem nəzarəti</b><small>LUX · Baş Ofis · Komendantlıq</small></div><div class="row"><button class="btn sm ghost" onclick="load()">↻ Yenilə</button></div></div>
<main>
 <div class="tabs" id="tabs"><button class="on" data-t="health">🟢 Canlılıq</button><button data-t="errors">🐞 Xətalar</button><button data-t="audit">🧾 Əməliyyat jurnalı</button><button data-t="alerts">🚨 Xəbərdarlıqlar</button><button data-t="incidents">🧯 Hadisələr</button><button data-t="security">🔐 Təhlükəsizlik</button><button data-t="speed">⚡ Sürət</button><button data-t="reports">📊 Hesabatlar</button><button data-t="settings">⚙️ Ayarlar</button></div>
 <div id="body"><div class="empty">Yüklənir…</div></div>
</main>
<div class="toast" id="toast"></div>
<script src="/assets/lux-auth.js?v=1790690641"></script>
<script>
var sb,ME,TAB='health';function $(i){return document.getElementById(i);}function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(function(){e.style.display='none';},3200);}
function tm(s){return new Date(s).toLocaleString('az-AZ',{timeZone:'Asia/Baku',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
var NAMES={sayt:'Sayt',ofis:'Baş Ofis',komendant:'Komendantlıq',satis:'Satış lövhəsi',baza:'Verilənlər bazası'};
var TBL={office_attendance:'Gəliş-gediş',office_leaves:'Sorğular (məzuniyyət)',office_employees:'İşçi kartı',office_outings:'Qısa çıxış',office_plans:'Aylıq plan',km_payments:'Komendantlıq · ödəniş',km_charges:'Komendantlıq · hesablama',km_units:'Komendantlıq · mənzil',km_tariffs:'Komendantlıq · tarif',km_config:'Komendantlıq · ayarlar',lux_profiles:'İstifadəçi hüquqları',lux_kv:'Sayt məlumatı / satış lövhəsi',lux_leads:'Saytdan müraciət',office_config:'Ofis ayarları'};
var OP={INSERT:['yaradıldı','p-ok'],UPDATE:['dəyişdirildi','p-acc'],DELETE:['silindi','p-bad']};
document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){TAB=b.dataset.t;document.querySelectorAll('#tabs button').forEach(function(x){x.classList.toggle('on',x===b);});load();};});
luxAuth({perm:'sys',title:'Sistem nəzarəti',noAdminLink:true,onReady:function(s,me){sb=s;ME=me;load();setInterval(function(){if(TAB==='health')load();},60000);}});
function run(q){return q.then(function(r){if(r.error)throw r.error;return r.data;});}
function load(){({health:loadHealth,errors:loadErrors,audit:loadAudit,reports:loadReports,alerts:loadAlerts,incidents:loadIncidents,security:loadSecurity,speed:loadSpeed,settings:loadSettings})[TAB]();}
function loadHealth(){var since=new Date(Date.now()-24*3600e3).toISOString();
 Promise.all([run(sb.from('sys_health_state').select('*')),run(sb.from('sys_health').select('target,ok,ms,at').gte('at',since).order('at')),run(sb.from('office_backup_log').select('*').order('id',{ascending:false}).limit(1))]).then(function(r){
  var st=r[0],h=r[1],bk=r[2][0];var html='<div class="grid">';
  Object.keys(NAMES).concat(Object.keys(FN)).forEach(function(k){if(k==='__')return;var s=st.find(function(x){return x.target===k;})||{ok:true},rows=h.filter(function(x){return x.target===k;}),up=rows.length?(rows.filter(function(x){return x.ok;}).length/rows.length*100):null,last=rows[rows.length-1];
   var bars='';var slots=48;for(var i=0;i<slots;i++){var a=Date.now()-(slots-i)*30*60e3,b=a+30*60e3,seg=rows.filter(function(x){var t=+new Date(x.at);return t>=a&&t<b;});bars+='<i class="'+(!seg.length?'n':seg.every(function(x){return x.ok;})?'':'x')+'" title="'+new Date(a).toLocaleTimeString('az-AZ',{timeZone:'Asia/Baku',hour:'2-digit',minute:'2-digit'})+'"></i>';}
   html+='<div class="st"><div><span class="dot" style="background:'+(s.ok?'var(--ok)':'var(--bad)')+'"></span><b>'+(NAMES[k]||('⚙ '+FN[k]))+'</b></div><div class="m">'+(s.ok?'İşləyir':'<b style="color:var(--bad)">İşləmir</b>')+(last&&last.ms?' · '+last.ms+' ms':'')+(up!=null?' · 24 saat: '+up.toFixed(1)+'%':'')+'</div><div class="bars">'+bars+'</div><div class="row sp mut" style="font-size:11px;margin-top:4px"><span>24 saat əvvəl</span><span>indi</span></div></div>';});
  html+='</div><div class="mut small" style="margin:8px 2px 0">Hər zolaq 30 dəqiqədir: <b style="color:var(--ok)">yaşıl</b> — hər şey işləyib, <b style="color:var(--bad)">qırmızı</b> — fasilə olub, <b style="color:#94a3b8">boz</b> — hələ yoxlama aparılmayıb (monitorinq yeni başlayıb). <b>ms</b> — cavab müddəti (1000 ms = 1 saniyə).</div><div class="card" style="margin-top:12px"><div class="row sp"><div><b>🔔 Xəbərdarlıqlar</b><div class="mut small">Sistem hər 5 dəqiqədə yoxlanılır. Bir hissə 2 dəfə ardıcıl açılmasa, telefonunuza bildiriş gəlir, düzələndə də xəbər verilir.</div></div><button class="btn sm" onclick="testAlert(this)">Test bildirişi</button></div></div>'+
   '<div class="card"><b>🛡 Ehtiyat nüsxə</b><div class="mut small" style="margin-top:4px">'+(bk?(bk.ok?'✅ Son nüsxə: '+tm(bk.created_at)+' · '+Math.round((bk.bytes||0)/1024)+' KB':'⚠️ Son cəhd alınmadı: '+esc(bk.note)):'Hələ nüsxə yoxdur')+' · hər gecə 03:00</div></div>';
  $('body').innerHTML=html;}).catch(fail);}
function testAlert(b){b.disabled=true;sb.functions.invoke('sys-monitor',{body:{action:'test'}}).then(function(r){b.disabled=false;if(r.error)throw r.error;toast(r.data&&r.data.sent?'Göndərildi: '+r.data.sent+' cihaz':'Bildiriş aktiv cihaz tapılmadı');}).catch(function(e){b.disabled=false;fail(e);});}
function loadErrors(){run(sb.from('sys_errors').select('*').order('at',{ascending:false}).limit(300)).then(function(rows){var g={};rows.forEach(function(e){var k=e.app+'|'+e.msg;(g[k]=g[k]||[]).push(e);});var keys=Object.keys(g).sort(function(a,b){return g[b][0].at>g[a][0].at?1:-1;});
 $('body').innerHTML='<div class="card"><div class="row sp"><div><b>Proqram xətaları</b><div class="mut small">İstifadəçilərin brauzerində baş verən xətalar avtomatik qeyd olunur (son 180 gün).</div></div>'+(rows.length?'<button class="btn sm ghost" onclick="clearErr()">Hamısını təmizlə</button>':'')+'</div></div>'+
 (keys.length?keys.map(function(k){var l=g[k],e=l[0];return '<div class="card"><div class="row sp"><div><span class="pill p-bad">'+esc(e.app)+'</span> <b>'+esc(e.msg)+'</b></div><span class="pill">'+l.length+' dəfə</span></div><div class="mut small" style="margin-top:6px">Son: '+tm(e.at)+' · '+esc(e.url)+'</div><details><summary class="small mut" style="cursor:pointer;margin-top:6px">Ətraflı</summary><pre>'+esc(e.stack)+'\n\n'+esc(e.ua)+'</pre></details></div>';}).join(''):'<div class="card empty">🎉 Xəta qeydə alınmayıb</div>');}).catch(fail);}
function clearErr(){if(!confirm('Bütün xəta qeydləri silinsin?'))return;run(sb.from('sys_errors').delete().gt('id',0)).then(function(){toast('Təmizləndi');load();}).catch(fail);}
var AF='';
function loadAudit(){var q=sb.from('sys_audit').select('*').order('at',{ascending:false}).limit(300);if(AF)q=q.eq('tbl',AF);run(q).then(function(rows){
 $('body').innerHTML='<div class="card"><div class="row sp"><div><b>Əməliyyat jurnalı</b><div class="mut small">Kim, nə vaxt, nəyi dəyişib — sübut kimi saxlanılır (3 il).</div></div><select onchange="AF=this.value;loadAudit()"><option value="">Bütün bölmələr</option>'+Object.keys(TBL).map(function(k){return '<option value="'+k+'"'+(AF===k?' selected':'')+'>'+TBL[k]+'</option>';}).join('')+'</select></div></div>'+
 '<div class="card tbl">'+(rows.length?'<table><tr><th>Vaxt</th><th>Kim</th><th>Bölmə</th><th>Nə</th><th>Dəyişiklik</th></tr>'+rows.map(function(a){var op=OP[a.op]||[a.op,''];return '<tr><td class="small">'+tm(a.at)+'</td><td class="small">'+esc(a.actor_email||'sistem')+'</td><td class="small">'+esc(TBL[a.tbl]||a.tbl)+(a.row_id?' <span class="mut">#'+esc(a.row_id)+'</span>':'')+'</td><td><span class="pill '+op[1]+'">'+op[0]+'</span></td><td class="diff">'+diff(a)+'</td></tr>';}).join('')+'</table>':'<div class="empty">Hələ qeyd yoxdur</div>')+'</div>';}).catch(fail);}
function val(v){if(v==null)return '—';if(typeof v==='object')return JSON.stringify(v).slice(0,80);var s=String(v);if(/^\d{4}-\d\d-\d\dT/.test(s))return tm(s);return s.slice(0,80);}
function diff(a){var o=a.old||{},n=a.new||{};if(a.op==='UPDATE')return Object.keys(n).slice(0,6).map(function(k){return '<div><b>'+esc(k)+'</b>: <s>'+esc(val(o[k]))+'</s> → <ins>'+esc(val(n[k]))+'</ins></div>';}).join('');var r=a.op==='DELETE'?o:n;return ['full_name','title','amount','number','email','status','day','check_in','check_out','key','perms','phone','name'].filter(function(k){return r[k]!=null;}).slice(0,4).map(function(k){return '<div><b>'+k+'</b>: '+esc(val(r[k]))+'</div>';}).join('')||'<span class="mut">—</span>';}
function loadReports(){run(sb.from('sys_reports').select('*').order('id',{ascending:false}).limit(20)).then(function(rows){
 $('body').innerHTML='<div class="card"><div class="row sp"><div><b>Həftəlik hesabatlar</b><div class="mut small">Hər bazar ertəsi 09:00-da avtomatik hazırlanır və telefonunuza göndərilir.</div></div><button class="btn sm" onclick="mkReport(this)">İndi hazırla</button></div></div>'+
 (rows.length?rows.map(function(r){var d=r.data||{},u=d.uptime||{};return '<div class="card"><div class="row sp"><b>'+esc(r.period)+'</b><span class="mut small">'+tm(r.at)+'</span></div><div class="grid" style="margin-top:10px">'+
  Object.keys(NAMES).map(function(k){return '<div class="st"><b>'+NAMES[k]+'</b><div class="m">Canlılıq: '+(u[k]||'—')+'%</div></div>';}).join('')+'</div>'+
  '<div class="row" style="margin-top:10px;gap:14px"><span>🐞 Xəta: <b>'+(d.errors||0)+'</b></span><span>🛡 Nüsxə: <b>'+(d.backups_ok||0)+'</b>'+(d.backups_fail?' <span class="pill p-bad">'+d.backups_fail+' alınmayıb</span>':'')+'</span><span>👤 Aktiv istifadəçi: <b>'+(d.active_users||0)+'</b></span><span>🕘 Gəliş qeydi: <b>'+(d.attendance||0)+'</b></span><span>📩 Müraciət: <b>'+(d.leads||0)+'</b></span><span>💳 Komendantlıq ödənişi: <b>'+Number(d.payments||0).toFixed(2)+' ₼</b></span><span>🧾 Əməliyyat: <b>'+(d.audits||0)+'</b></span></div>'+
  ((d.top||[]).length?'<details style="margin-top:8px"><summary class="small mut" style="cursor:pointer">Ən çox təkrarlanan xətalar</summary>'+d.top.map(function(t){return '<div class="small">• '+esc(t[0])+' — '+t[1]+' dəfə</div>';}).join('')+'</details>':'')+'</div>';}).join(''):'<div class="card empty">Hələ hesabat yoxdur</div>');}).catch(fail);}
function mkReport(b){b.disabled=true;b.textContent='Hazırlanır…';sb.functions.invoke('sys-monitor',{body:{action:'weekly'}}).then(function(r){if(r.error)throw r.error;toast('Hesabat hazırdır');loadReports();}).catch(function(e){b.disabled=false;b.textContent='İndi hazırla';fail(e);});}
var FN={f_giris:'Giriş sistemi',f_forma:'Müraciət forması',f_bildiris:'Bildiriş serveri',f_cron:'Avtomatik işlər'};
var LVL={bad:'p-bad',warn:'p-warn',info:'p-acc'};
function loadAlerts(){run(sb.from('sys_alerts').select('*').order('id',{ascending:false}).limit(200)).then(function(r){
 $('body').innerHTML='<div class="card"><b>Xəbərdarlıqlar</b><div class="mut small">Telefonunuza göndərilmiş bütün xəbərdarlıqlar: təhlükəsizlik, biznes, infrastruktur, yeni xətalar.</div></div>'+(r.length?'<div class="card tbl"><table><tr><th>Vaxt</th><th>Növ</th><th>Xəbərdarlıq</th></tr>'+r.map(function(a){return '<tr><td class="small">'+tm(a.at)+'</td><td><span class="pill '+(LVL[a.level]||'')+'">'+esc(a.kind)+'</span></td><td><b>'+esc(a.title)+'</b><div class="small mut">'+esc(a.body)+'</div></td></tr>';}).join('')+'</table></div>':'<div class="card empty">🎉 Xəbərdarlıq yoxdur</div>');}).catch(fail);}
function loadIncidents(){run(sb.from('sys_incidents').select('*').order('id',{ascending:false}).limit(100)).then(function(r){var tot=r.reduce(function(s,i){return s+dur(i);},0);
 $('body').innerHTML='<div class="card"><b>Hadisələr (fasilələr)</b><div class="mut small">Hər fasilə avtomatik qeyd olunur. Səbəbi və görülən işi yaza bilərsiniz. Cəmi: '+r.length+' hadisə · '+tot+' dəq</div></div>'+(r.length?r.map(function(i){return '<div class="card"><div class="row sp"><div><span class="pill '+(i.ended_at?'p-ok':'p-bad')+'">'+(i.ended_at?'bağlanıb':'davam edir')+'</span> <b>'+esc(NAMES[i.target]||FN[i.target]||i.target)+'</b></div><span class="mut small">'+tm(i.started_at)+(i.ended_at?' → '+tm(i.ended_at):'')+' · '+dur(i)+' dəq</span></div><div class="small" style="margin-top:6px">Səbəb: '+esc(i.cause)+'</div><div class="row" style="margin-top:8px"><input id="in'+i.id+'" value="'+esc(i.note)+'" placeholder="Qeyd: nə baş verdi, nə edildi" style="flex:1"><button class="btn sm ghost" onclick="saveInc('+i.id+')">Saxla</button></div></div>';}).join(''):'<div class="card empty">🎉 Fasilə olmayıb</div>');}).catch(fail);}
function dur(i){return Math.max(0,Math.round(((i.ended_at?new Date(i.ended_at):new Date())-new Date(i.started_at))/60000));}
function saveInc(id){run(sb.from('sys_incidents').update({note:$('in'+id).value}).eq('id',id)).then(function(){toast('Saxlanıldı');}).catch(fail);}
function loadSecurity(){var since=new Date(Date.now()-7*864e5).toISOString();Promise.all([run(sb.from('sys_login_fails').select('*').gte('at',since).order('at',{ascending:false}).limit(500)),run(sb.from('sys_alerts').select('*').eq('kind','security').order('id',{ascending:false}).limit(50))]).then(function(r){var g={};r[0].forEach(function(x){(g[x.email]=g[x.email]||[]).push(x);});var ks=Object.keys(g).sort(function(a,b){return g[b].length-g[a].length;});
 $('body').innerHTML='<div class="card"><b>🔐 Uğursuz giriş cəhdləri (7 gün)</b><div class="mut small">Eyni hesaba 10 dəqiqədə 10+ cəhd olarsa dərhal xəbərdarlıq gəlir.</div>'+(ks.length?'<table style="margin-top:8px"><tr><th>Email</th><th>Cəhd</th><th>Son</th></tr>'+ks.map(function(k){return '<tr><td>'+esc(k)+'</td><td><b>'+g[k].length+'</b></td><td class="small">'+tm(g[k][0].at)+' · '+esc(g[k][0].app)+'</td></tr>';}).join('')+'</table>':'<div class="empty">Yoxdur</div>')+'</div>'+
  '<div class="card"><b>🛡 Təhlükəsizlik hadisələri</b><div class="mut small">Yeni hüquq verilməsi, kütləvi silmə, selfisiz qeydlər.</div>'+(r[1].length?r[1].map(function(a){return '<div style="padding:8px 0;border-bottom:1px solid #f1f5f9"><b>'+esc(a.title)+'</b> <span class="mut small">'+tm(a.at)+'</span><div class="small">'+esc(a.body)+'</div></div>';}).join(''):'<div class="empty">Yoxdur</div>')+'</div>';}).catch(fail);}
function loadSpeed(){sb.rpc('sys_rum_stats',{p_days:7}).then(function(r){var d=r.data||[];
 $('body').innerHTML='<div class="card"><b>⚡ Real istifadəçi sürəti (7 gün)</b><div class="mut small">İstifadəçilərin cihazında səhifənin tam açılma müddəti. Median — tipik istifadəçi, P75 — 4 nəfərdən 3-ü bundan tez.</div></div>'+(d.length?'<div class="card tbl"><table><tr><th>Sistem</th><th>Cihaz</th><th>Ölçmə</th><th>Median</th><th>P75</th></tr>'+d.map(function(x){var c=x.med<2500?'p-ok':x.med<5000?'p-warn':'p-bad';return '<tr><td>'+esc(x.app)+'</td><td>'+esc(x.device)+'</td><td>'+x.n+'</td><td><span class="pill '+c+'">'+(x.med/1000).toFixed(1)+' san</span></td><td>'+(x.p75/1000).toFixed(1)+' san</td></tr>';}).join('')+'</table></div>':'<div class="card empty">Hələ ölçmə yoxdur — istifadəçilər sistemi açdıqca toplanacaq.</div>');}).catch(fail);}
function loadSettings(){Promise.all([run(sb.from('sys_config').select('*').eq('id',1).single()),sb.rpc('sys_quota_view').then(function(r){return r.data;})]).then(function(r){var c=r[0],q=r[1]||{};
 var bar=function(v,l){var p=Math.min(100,v/l*100);return '<div style="height:8px;background:#f1f5f9;border-radius:99px;margin-top:4px"><i style="display:block;height:100%;width:'+p+'%;border-radius:99px;background:'+(p<70?'var(--ok)':p<90?'var(--warn)':'var(--bad)')+'"></i></div>';};
 $('body').innerHTML='<div class="card"><b>💾 Kvotalar (pulsuz plan)</b><div style="margin-top:8px">Verilənlər bazası: <b>'+q.db_mb+' MB</b> / '+q.db_limit_mb+' MB'+bar(q.db_mb,q.db_limit_mb)+'</div><div style="margin-top:10px">Fayl anbarı: <b>'+q.storage_mb+' MB</b> / '+q.storage_limit_mb+' MB'+bar(q.storage_mb,q.storage_limit_mb)+'</div><div style="margin-top:10px">İstifadəçilər: <b>'+q.users+'</b> / '+q.users_limit+'</div><div class="mut small" style="margin-top:8px">70%-ə çatanda xəbərdarlıq gəlir.</div></div>'+
 '<div class="card"><b>🌐 Domenlərin bitmə tarixi</b><div class="mut small">Qeydiyyatçının saytındakı tarixi yazın — 30, 7 və 1 gün qalmış xəbərdarlıq gələcək.</div>'+(c.domains||[]).map(function(d,i){return '<div class="row" style="margin-top:8px"><span style="min-width:150px"><b>'+esc(d.name)+'</b></span><input type="date" id="dom'+i+'" value="'+(d.expires||'')+'"></div>';}).join('')+'</div>'+
 '<div class="card"><b>🫀 Xarici nəzarətçi (heartbeat)</b><div class="mut small">Monitorinqin özü dayansa belə xəbər tutmaq üçün. healthchecks.io-da pulsuz "check" yaradın (period 5 dəq, grace 10 dəq) və verdiyi ping linkini buraya yapışdırın.</div><input id="hb" value="'+esc(c.heartbeat_url||'')+'" placeholder="https://hc-ping.com/..." style="width:100%;margin-top:8px"></div>'+
 '<div class="card"><b>🐢 Yavaşlama həddi</b><div class="row" style="margin-top:8px"><input id="slow" type="number" min="500" step="500" value="'+(c.slow_ms||3000)+'" style="width:120px"> <span class="mut small">ms — son 3 yoxlama bundan yavaş olsa xəbərdarlıq</span></div></div>'+
 '<button class="btn" onclick="saveSettings()">Yadda saxla</button>';loadSettings._c=c;}).catch(fail);}
function saveSettings(){var c=loadSettings._c;var doms=(c.domains||[]).map(function(d,i){return {name:d.name,expires:$('dom'+i).value||null};});
 run(sb.from('sys_config').update({domains:doms,heartbeat_url:$('hb').value.trim(),slow_ms:+$('slow').value||3000,updated_at:new Date().toISOString()}).eq('id',1)).then(function(){toast('Yadda saxlanıldı');}).catch(fail);}
function fail(e){$('body').innerHTML='<div class="card empty">Xəta: '+esc(e&&e.message||e)+'</div>';}
</script>
</body>
</html>
