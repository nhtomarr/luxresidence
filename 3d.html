<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#efe2d3;font-family:var(--sans);color:var(--ink);}

#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
button{font-family:inherit;cursor:pointer;}

.top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 10px;pointer-events:none;}
.top>*{pointer-events:auto;}
.back{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.7);border-radius:12px;padding:9px 14px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;box-shadow:0 6px 20px -10px rgba(74,42,24,.35);white-space:nowrap;}
.brand{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--ink);white-space:nowrap;}
.brand small{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--rust);margin-left:6px;letter-spacing:.04em;}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-left:auto;}
.tabs::-webkit-scrollbar{display:none;}
.tabs button{flex:none;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:10px;padding:8px 13px;font-family:var(--serif);font-weight:700;font-size:14px;color:var(--ink);}

/* floor list */
.side{position:fixed;left:18px;top:calc(72px + env(safe-area-inset-top,0px));bottom:18px;width:250px;z-index:9;display:flex;flex-direction:column;background:rgba(255,252,248,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.75);border-radius:18px;box-shadow:0 20px 50px -24px rgba(74,42,24,.45);overflow:hidden;}
.side h2{font-family:var(--serif);font-size:19px;padding:16px 16px 10px;}
.filt{display:flex;gap:6px;padding:0 16px 12px;border-bottom:1px solid var(--line);}
.filt button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--ink);}
.filt button.on{background:var(--rust);border-color:var(--rust);color:#fff;}
.fl{flex:1;overflow-y:auto;padding:6px 8px;overscroll-behavior:contain;}
.fr{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;text-align:left;padding:8px;border-radius:11px;color:var(--ink);}
.fr:hover{background:#f4ebe1;}
.fr.on{background:#f1e2d4;}
.fr.dim{opacity:.4;}
.fr .num{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:15px;flex:none;}
.fr.on .num{background:var(--rust);border-color:var(--rust);color:#fff;}
.fr .inf{flex:1;min-width:0;}
.fr .inf b{display:block;font-size:13.5px;font-weight:600;}
.fr .inf span{font-size:11.5px;color:var(--muted);}
.dots{display:flex;gap:3px;flex-wrap:wrap;max-width:54px;justify-content:flex-end;}
.dots i{width:6px;height:6px;border-radius:50%;}
.legend{display:flex;gap:14px;padding:10px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0;}
/* hint & crumbs */
.hint{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:8;background:rgba(36,48,58,.86);color:#fff;font-size:13px;padding:9px 16px;border-radius:99px;white-space:nowrap;pointer-events:none;transition:opacity .4s;}
.crumb{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9;display:none;align-items:center;gap:10px;background:rgba(255,252,248,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:99px;padding:6px 6px 6px 16px;box-shadow:0 10px 30px -14px rgba(74,42,24,.5);font-weight:600;font-size:14px;}
.crumb.on{display:flex;}
.crumb button{border:none;background:#24303a;color:#fff;border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;}
.tip{position:fixed;z-index:12;pointer-events:none;background:rgba(36,48,58,.94);color:#fff;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:8px;white-space:nowrap;display:none;box-shadow:0 6px 18px rgba(0,0,0,.3);}
.tip span{font-weight:500;opacity:.8;margin-left:6px;}
.lbl{position:fixed;z-index:7;pointer-events:none;transform:translate(-50%,-50%);background:rgba(255,255,255,.94);border-radius:8px;padding:4px 8px;font-size:11.5px;font-weight:700;color:var(--ink);white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.18);text-align:center;line-height:1.25;}
.lbl.dir{background:#24303a;color:#fff;font-weight:600;}
.lbl span{display:block;font-weight:500;color:var(--muted);font-size:10.5px;}
/* apartment panel */
.panel{position:fixed;right:18px;top:calc(72px + env(safe-area-inset-top,0px));width:320px;max-height:calc(100% - 90px);z-index:11;background:#fffcf8;border-radius:18px;box-shadow:0 24px 60px -24px rgba(74,42,24,.55);overflow-y:auto;transform:translateX(120%);transition:transform .35s cubic-bezier(.3,.8,.3,1);overscroll-behavior:contain;}
.panel.on{transform:none;}
.panel .x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:none;background:#f0e6da;font-size:18px;color:var(--ink);z-index:2;}
.pbody{padding:20px;}

.pbody h3{font-family:var(--serif);font-size:26px;margin:10px 0 2px;}
.psub{font-size:13px;color:var(--muted);}

.pplan img{width:100%;height:100%;object-fit:contain;padding:8px;}
.pplan em{font-style:normal;font-size:12px;color:var(--muted);}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px;}
.pgrid div{background:#fff;padding:10px 12px;}
.pgrid small{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
.pgrid b{font-size:15px;}
.pbtn{display:flex;align-items:center;justify-content:center;width:100%;border:none;border-radius:12px;padding:13px;font-size:14.5px;font-weight:600;text-decoration:none;margin-top:8px;}
.pbtn.pri{background:var(--rust);color:#fff;}
.pbtn.sec{background:#f0e6da;color:var(--ink);}
.note{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.5;}
body.hide .filt,body.hide .legend,body.hide .fr .dots{display:none!important;}
.load{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#f3e6d8;font-family:var(--serif);font-size:18px;color:var(--ink);transition:opacity .5s;}
.load.off{opacity:0;pointer-events:none;}
.err{max-width:320px;text-align:center;font-family:var(--sans);font-size:14px;line-height:1.6;}

 .side h2,.legend,.fr .inf,.fr .dots{display:none;}

}
