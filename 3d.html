<style>
:root{--rust:#ba4d2c;--ink:#2a1d14;--muted:#8b7a6b;--line:#eadfd3;--cream:#f7f2ec;--av:#3f9a62;--sd:#b5483b;
--serif:'Playfair Display',Georgia,serif;--sans:'Inter',-apple-system,system-ui,'Segoe UI',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#efe2d3;font-family:var(--sans);color:var(--ink);}
#stage{position:fixed;inset:0;background:linear-gradient(180deg,#e9c9a8 0%,#f1dcc6 38%,#f5ebe0 62%,#e9dccb 100%);}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
button{font-family:inherit;cursor:pointer;}
/* top bar */
.top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 10px;pointer-events:none;}
.top>*{pointer-events:auto;}
.back{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.7);border-radius:12px;padding:9px 14px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;box-shadow:0 6px 20px -10px rgba(74,42,24,.35);white-space:nowrap;}
.brand{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--ink);white-space:nowrap;}
.brand small{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--rust);margin-left:6px;letter-spacing:.04em;}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-left:auto;}
.tabs::-webkit-scrollbar{display:none;}
.tabs button{flex:none;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:10px;padding:8px 13px;font-family:var(--serif);font-weight:700;font-size:14px;color:var(--ink);}
.tabs button.on{background:#24303a;color:#fff;border-color:#24303a;}
/* floor list */
.side{position:fixed;left:18px;top:calc(72px + env(safe-area-inset-top,0px));bottom:18px;width:250px;z-index:9;display:flex;flex-direction:column;background:rgba(255,252,248,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.75);border-radius:18px;box-shadow:0 20px 50px -24px rgba(74,42,24,.45);overflow:hidden;}
.side h2{font-family:var(--serif);font-size:19px;padding:16px 16px 10px;}
.filt{display:flex;gap:6px;padding:0 16px 12px;border-bottom:1px solid var(--line);}
.filt button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--ink);}
.filt button.on{background:var(--rust);border-color:var(--rust);color:#fff;}
.fl{flex:1;overflow-y:auto;padding:6px 8px;overscroll-behavior:contain;}
.fr{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;text-align:left;padding:8px;border-radius:11px;color:var(--ink);}
.fr:hover{background:#f4ebe1;}
.fr.on{background:#f1e2d4;}
.fr.dim{opacity:.4;}
.fr .num{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:15px;flex:none;}
.fr.on .num{background:var(--rust);border-color:var(--rust);color:#fff;}
.fr .inf{flex:1;min-width:0;}
.fr .inf b{display:block;font-size:13.5px;font-weight:600;}
.fr .inf span{font-size:11.5px;color:var(--muted);}
.dots{display:flex;gap:3px;flex-wrap:wrap;max-width:54px;justify-content:flex-end;}
.dots i{width:6px;height:6px;border-radius:50%;}
.legend{display:flex;gap:14px;padding:10px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0;}
/* hint & crumbs */
.hint{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:8;background:rgba(36,48,58,.86);color:#fff;font-size:13px;padding:9px 16px;border-radius:99px;white-space:nowrap;pointer-events:none;transition:opacity .4s;}
.crumb{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9;display:none;align-items:center;gap:10px;background:rgba(255,252,248,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:99px;padding:6px 6px 6px 16px;box-shadow:0 10px 30px -14px rgba(74,42,24,.5);font-weight:600;font-size:14px;}
.crumb.on{display:flex;}
.crumb button{border:none;background:#24303a;color:#fff;border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;}
.tip{position:fixed;z-index:12;pointer-events:none;background:rgba(36,48,58,.94);color:#fff;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:8px;white-space:nowrap;display:none;box-shadow:0 6px 18px rgba(0,0,0,.3);}
.tip span{font-weight:500;opacity:.8;margin-left:6px;}
.lbl{position:fixed;z-index:7;pointer-events:none;transform:translate(-50%,-50%);background:rgba(255,255,255,.94);border-radius:8px;padding:4px 8px;font-size:11.5px;font-weight:700;color:var(--ink);white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.18);text-align:center;line-height:1.25;}
.lbl.dir{background:#24303a;color:#fff;font-weight:600;}
.lbl span{display:block;font-weight:500;color:var(--muted);font-size:10.5px;}
/* apartment panel */
.panel{position:fixed;right:18px;top:calc(72px + env(safe-area-inset-top,0px));width:320px;max-height:calc(100% - 90px);z-index:11;background:#fffcf8;border-radius:18px;box-shadow:0 24px 60px -24px rgba(74,42,24,.55);overflow-y:auto;transform:translateX(120%);transition:transform .35s cubic-bezier(.3,.8,.3,1);overscroll-behavior:contain;}
.panel.on{transform:none;}
.panel .x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:none;background:#f0e6da;font-size:18px;color:var(--ink);z-index:2;}
.pbody{padding:20px;}
.pst{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:99px;padding:5px 10px;}
.pbody h3{font-family:var(--serif);font-size:26px;margin:10px 0 2px;}
.psub{font-size:13px;color:var(--muted);}
.pplan{margin:14px 0;background:#f5efe7;border-radius:12px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.pplan img{width:100%;height:100%;object-fit:contain;padding:8px;}
.pplan em{font-style:normal;font-size:12px;color:var(--muted);}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px;}
.pgrid div{background:#fff;padding:10px 12px;}
.pgrid small{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
.pgrid b{font-size:15px;}
.pbtn{display:flex;align-items:center;justify-content:center;width:100%;border:none;border-radius:12px;padding:13px;font-size:14.5px;font-weight:600;text-decoration:none;margin-top:8px;}
.pbtn.pri{background:var(--rust);color:#fff;}
.pbtn.sec{background:#f0e6da;color:var(--ink);}
.vbar{display:none;position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:13;align-items:center;gap:10px;background:rgba(255,252,248,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.75);border-radius:16px;padding:7px 14px 7px 7px;box-shadow:0 14px 36px -16px rgba(74,42,24,.5);max-width:calc(100% - 16px);}
.vbar.on{display:flex}.vbar button{border:none;background:#2a2420;color:#fff;border-radius:11px;padding:9px 13px;font-weight:600;cursor:pointer}.vt{display:flex;flex-direction:column;line-height:1.25}.vt b{font-size:14px}.vt span{font-size:12px;opacity:.65}
body.view #side,body.view .top,body.view #hint,body.view #crumb,body.view #sunbtn{opacity:0;pointer-events:none;transition:opacity .4s}
body.maket #side,body.maket .top,body.maket #hint,body.maket #crumb,body.maket #sunbtn,body.maket #panel,body.maket #lbls{opacity:0;pointer-events:none;transition:opacity .4s}
.mkbar{display:none;position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:13;align-items:center;gap:10px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(0,0,0,.06);border-radius:16px;padding:7px;box-shadow:0 14px 36px -18px rgba(0,0,0,.35);max-width:calc(100% - 16px)}
body.maket .mkbar{display:flex}.mkbar button{border:none;background:#2a2420;color:#fff;border-radius:11px;padding:9px 13px;font-weight:600;cursor:pointer;white-space:nowrap}.mkbar #mkn{background:#f0e6da;color:#241109}
@media(max-width:760px){.mkbar .vt span{display:none}}
.note{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.5;}
body.hide .filt,body.hide .legend,body.hide .fr .dots{display:none!important;}
.load{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#f3e6d8;font-family:var(--serif);font-size:18px;color:var(--ink);transition:opacity .5s;}
.load.off{opacity:0;pointer-events:none;}
.err{max-width:320px;text-align:center;font-family:var(--sans);font-size:14px;line-height:1.6;}
@media(max-width:760px){
 .top{padding:calc(10px + env(safe-area-inset-top,0px)) 10px 8px;gap:8px;flex-wrap:wrap;}
 .brand{display:none;}
 .back{padding:8px 11px;font-size:13px;}
 .tabs{margin-left:0;flex:1;min-width:0;}
 .tabs button{padding:7px 11px;font-size:13px;}
 .side{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,252,248,.92);left:auto;right:8px;top:calc(62px + env(safe-area-inset-top,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));width:52px;border-radius:14px;}
 .side h2,.legend,.fr .inf,.fr .dots{display:none;}
 .filt{position:fixed;left:10px;top:calc(62px + env(safe-area-inset-top,0px));border:none;padding:0;z-index:9;}
 .filt button{box-shadow:0 4px 14px -8px rgba(0,0,0,.4);}
 .fl{padding:4px;display:flex;flex-direction:column;gap:3px;}
 .fr{padding:0;flex:1;min-height:0;justify-content:center;}
 .fr .num{width:42px;height:100%;min-height:22px;max-height:38px;font-size:13px;border-radius:8px;position:relative;}
 .fr.av .num::after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:var(--av);}
 .fr.on .num::after{background:#fff;}
 .hint{font-size:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 20px);white-space:normal;text-align:center;}
 .crumb{top:auto;bottom:calc(58px + env(safe-area-inset-bottom,0px));font-size:12.5px;white-space:nowrap;padding:5px 5px 5px 13px;gap:8px;}
 .crumb button{padding:6px 11px;font-size:12px;white-space:nowrap;}
 .lbl{font-size:10.5px;padding:3px 6px;}
 .lbl .rm{display:none;}
 .lbl span{font-size:9.5px;}
 .panel{left:0;right:0;top:auto;bottom:0;width:100%;max-height:62%;border-radius:22px 22px 0 0;transform:translateY(105%);}
 .panel.on{transform:none;}
 .pbody{padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));}
 .pplan{aspect-ratio:16/10;}
}

/* ---------- günəş və kölgə ---------- */
.sunbtn{position:fixed;left:286px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.75);background:rgba(255,252,248,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:99px;padding:10px 16px;font-family:var(--sans);font-size:14px;font-weight:700;color:var(--ink);box-shadow:0 10px 28px -12px rgba(74,42,24,.5);cursor:pointer;}
.sunbtn:hover{background:#fff;}
.sunbox{position:fixed;left:286px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:10;width:350px;display:none;background:rgba(255,252,248,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.75);border-radius:18px;padding:12px 14px 14px;box-shadow:0 20px 50px -24px rgba(74,42,24,.55);}
body.sun .sunbox{display:block;}body.sun .dock{display:none;}
.sunhd{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.sunhd b{font-family:var(--serif);font-size:16px;flex:1;}
.cmp{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;position:relative;flex:none;}
.cmp .cn{position:absolute;inset:0;transition:transform .1s linear;}
.cmp .cn i{position:absolute;left:50%;top:9px;margin-left:-4px;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:9px solid var(--rust);}
.cmp .cn span{position:absolute;left:50%;top:1px;transform:translateX(-50%);font-size:8px;font-weight:800;color:var(--rust);line-height:1;}
.cmp::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--ink);}
.sx{width:30px;height:30px;border-radius:50%;border:none;background:#f0e6da;font-size:17px;color:var(--ink);flex:none;cursor:pointer;}
.sdays{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px;}
.sdays::-webkit-scrollbar{display:none;}
.sdays button{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 10px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;}
.sdays button.on{background:var(--rust);border-color:var(--rust);color:#fff;}
.srow{display:flex;align-items:center;gap:10px;}
.splay{width:34px;height:34px;border-radius:50%;border:none;background:#24303a;color:#fff;font-size:13px;flex:none;cursor:pointer;}
.srow input{flex:1;accent-color:var(--rust);min-width:0;}
.sval{font-family:var(--serif);font-weight:700;font-size:16px;width:46px;text-align:right;flex:none;}
.sinfo{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4;}
.psun{background:#fbf2e4;border-radius:12px;padding:11px 13px;margin-bottom:14px;font-size:13px;line-height:1.45;}
.psun b{display:block;font-size:13.5px;margin-bottom:4px;}
.psun .sh{display:flex;gap:8px;margin-top:6px;}
.psun .sh div{flex:1;background:#fff;border-radius:9px;padding:7px 9px;}
.psun .sh small{display:block;color:var(--muted);font-size:11px;}
.psun .sh strong{font-size:15px;}
.psun a{display:inline-block;margin-top:8px;color:var(--rust);font-weight:700;text-decoration:none;cursor:pointer;}
body.night #stage{background:linear-gradient(180deg,#1f2738 0%,#3a3f55 55%,#4f4a55 100%);}
@media (max-width:760px){
 .sunbtn{left:10px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:9px 13px;font-size:13px;}
 .sunbtn span{display:none;}
 .sunbox{left:8px;right:68px;width:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:10px 12px 12px;}
 body.sun .hint{display:none;}
}

.dock{position:fixed;left:286px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;align-items:center;gap:4px;padding:5px;background:rgba(255,252,248,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.75);border-radius:16px;box-shadow:0 10px 28px -12px rgba(74,42,24,.5);transition:opacity .4s;}
.dk{display:flex;align-items:center;gap:7px;border:none;background:none;border-radius:11px;padding:9px 12px;font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;}
.dk:hover{background:#f1e6da;}
.dock svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.dock .seg{display:flex;background:#efe5d9;border-radius:11px;padding:3px;margin:0 3px;}
.dock .seg button{display:flex;align-items:center;border:none;background:none;border-radius:9px;padding:7px 11px;font-size:13px;font-weight:600;color:#6b5a4c;}
.dock .seg svg{display:none;}

   gün vaxtı (Gündüz/Qürub/Gecə), tanıtım turu, şəkil çəkmək, qülləyə kliklə bina seçimi, bina etiketləri, paylaşıla bilən link */
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600);}
function syncURL(){const q=new URLSearchParams();q.set('bina',CUR);if(SEL)q.set('f',SEL);if(ASEL)q.set('u',ASEL.n);try{history.replaceState(null,'','?'+q.toString());}catch(e){}}
function switchBina(b){if(b===CUR||!BINALAR.includes(b))return;CUR=b;placeSite();buildTabs();if(!SEL&&!VIEW){controls.autoRotate=false;flyTo(HOME.pos.clone(),HOME.tgt.clone(),1200);}closePanel();if(SEL)selectFloor(SEL,true);buildList();buildTL();syncURL();
 const on=document.querySelector('#tabs button.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest',inline:'center'});}
function goTower(b){if(!BINALAR.includes(b)){toast(b+' üzrə mənzil məlumatı tezliklə əlavə olunacaq');return;}if(MK.on)maketOff();switchBina(b);}
function towerAt(){const h=ray.intersectObjects(CTXB.filter(b=>b.parent.visible),false);return h.length?h[0].object.userData.b:null;}
/* --- gün vaxtı --- */
let TODTW=null;
function todNow(){if(!SUN.on)return 'day';const a=sunPos(SUN.doy,SUN.min).alt;return a<-4?'night':(a<9?'dusk':'day');}
function todSync(){const m=todNow(),el=document.getElementById('tod');if(el)[...el.children].forEach(b=>b.classList.toggle('on',b.dataset.t===m));}
function setTOD(m,ms=2400){const n=bakuNow();if(!SUN.doy)SUN.doy=doyOf(n.m,n.d);const rs=riseSet(SUN.doy),target=m==='night'?Math.min(1290,rs.s+75):m==='dusk'?rs.s-46:780;
 if(!SUN.on){if(m==='day')return;SUN.on=true;enableShadowsMobile();SUN.min=780;}
 SUN.play=false;$('splay').textContent='▶';controls.autoRotate=false;TODTW={a:SUN.min,b:target,s:performance.now(),ms,off:m==='day'};}
function todTick(now){if(!TODTW)return;const k=Math.min(1,(now-TODTW.s)/TODTW.ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;SUN.min=TODTW.a+(TODTW.b-TODTW.a)*e;if(k>=1){const off=TODTW.off;TODTW=null;if(off)SUN.on=false;}applySun();}
document.getElementById('tod').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTOD(b.dataset.t);});
/* --- şəkil çəkmək --- */
function snap(){if(INT.on)renderer.render(INT.scene,INT.cam);else renderer.render(scene,camera);const src=renderer.domElement,c=document.createElement('canvas');c.width=src.width;c.height=src.height;const x=c.getContext('2d');x.fillStyle='#efe2d3';x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0);
 const s=Math.max(1,c.width/1440);x.shadowColor='rgba(0,0,0,.5)';x.shadowBlur=10*s;x.fillStyle='rgba(255,255,255,.95)';x.font='700 '+Math.round(26*s)+'px "Playfair Display",Georgia,serif';x.fillText('LUX Residence',26*s,c.height-46*s);x.font='500 '+Math.round(14*s)+'px Inter,Arial,sans-serif';x.fillText('luxresidence.az/3d',27*s,c.height-24*s);
 c.toBlob(b=>{if(!b)return;const f=new File([b],'lux-residence-3d.jpg',{type:'image/jpeg'});if(MOB&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'LUX Residence 3D'}).catch(()=>{});return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='lux-residence-3d.jpg';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Şəkil yükləndi');},'image/jpeg',.92);}
document.getElementById('snapbtn').addEventListener('click',snap);
/* --- mənzil linkini paylaş --- */
function shareSel(){const url=location.origin+location.pathname+location.search,title='LUX Residence · '+CUR+(SEL?' · '+ord(SEL)+' mərtəbə':'')+(ASEL?' · mənzil № '+ASEL.n:'');
 if(navigator.share&&MOB){navigator.share({title,text:title,url}).catch(()=>{});return;}
 (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast('Link kopyalandı')).catch(()=>{prompt('Linki kopyalayın:',url);});}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('#shareGo');if(a){e.preventDefault();shareSel();}});
/* --- bina etiketləri (qüllələrin üstündə, kliklə keçid) --- */
const TL=[];
function availOf(bn){const b=salesFor(bn);if(!b||!b.rows)return null;let n=0;Object.values(b.rows).forEach(r=>(r||[]).forEach(u=>{if(u.st==='available')n++;}));return n;}
function buildTL(){const bx=document.getElementById('tl');bx.innerHTML='';TL.length=0;Object.entries(CTX).forEach(([nm,g])=>{const el=document.createElement('button'),has=BINALAR.includes(nm),av=has&&!OFF()?availOf(nm):null;
 el.className='tlb'+(has?'':' off');el.innerHTML=nm+(has?(av!==null?'<small>'+(av?av+' mənzil satışda':'hamısı satılıb')+'</small>':''):'<small>tezliklə</small>');el.addEventListener('click',()=>goTower(nm));bx.appendChild(el);
 TL.push({nm,el,g,h:POD+g.userData.fl*FH+7,vis:true});});}
const _tv=new THREE.Vector3(),_td=new THREE.Vector3();
function updTL(now){const bx=document.getElementById('tl'),show=!SEL&&!VIEW&&!INT.on&&!TOUR.on;bx.style.display=show?'':'none';if(!show||!TL.length)return;const chk=now-(updTL.t||0)>260;let occ=null;if(chk){updTL.t=now;occ=CTXB.filter(b=>b.parent.visible).concat(hitboxes);}
 const put=[];TL.forEach(o=>{o.on=false;if(o.nm===CUR&&!MK.on)return;_tv.set(o.g.position.x+SITE.position.x,o.h,o.g.position.z+SITE.position.z);o.d=_tv.distanceTo(camera.position);
  if(chk){ray.set(camera.position,_td.copy(_tv).sub(camera.position).normalize());const hit=ray.intersectObjects(occ,false)[0];o.vis=!(hit&&hit.distance<o.d-8);}
  _tv.project(camera);o.on=o.vis&&_tv.z<1&&Math.abs(_tv.x)<1.02&&_tv.y<.9&&_tv.y>-1;o.sx=(_tv.x+1)/2*innerWidth;o.sy=(1-_tv.y)/2*innerHeight;});
 TL.slice().sort((a,b)=>a.d-b.d).forEach(o=>{if(o.on&&put.some(q=>Math.abs(q.sx-o.sx)<(MOB?62:78)&&Math.abs(q.sy-o.sy)<34))o.on=false;if(o.on)put.push(o);});
 TL.forEach(o=>{o.el.style.display=o.on?'':'none';if(o.on){o.el.style.left=o.sx+'px';o.el.style.top=o.sy+'px';}});}
/* --- tanıtım turu: kamera kompleksi özü gəzir --- */
const TOUR={on:false,i:0,loop:false,steps:[],c:null};
function clearSpot(r,y){const L=LAYOUT[CUR]||[0,0],base=Math.atan2(HOME.pos.x,HOME.pos.z);
 const hit=(x,z)=>Object.entries(LAYOUT).some(([n,V])=>n!==CUR&&Math.abs(x+L[0]-V[0])<(V[2]||W)/2+10&&Math.abs(z+L[1]-V[1])<(V[3]||D)/2+9);
 for(const d of [0,20,-20,40,-40,60,-60,90,-90,120,-120,150,-150,180]){const a=base+d*Math.PI/180,x=Math.sin(a)*r,z=Math.cos(a)*r;let ok=true;for(let t=0;t<=1.001;t+=.1){if(hit(x*(1-t*.7),z*(1-t*.7))){ok=false;break;}}if(ok)return new THREE.Vector3(x,y,z);}
 return new THREE.Vector3(Math.sin(base)*r,y,Math.cos(base)*r);}
function tourSteps(){const c=SITE.position.clone().add(LAND.center),H=POD+(F1-F0+1)*FH,f=NEIGH.f,V=(x,y,z)=>new THREE.Vector3(x,y,z);
 const pl=LAND.PL[0]?V(LAND.PL[0][0],0,LAND.PL[0][1]).add(SITE.position):c.clone();
 return [{p:c.clone().add(V(260,175,270)),t:c.clone().setY(20),ms:0},
  {p:c.clone().add(V(-235,120,235)),t:c.clone().setY(22),ms:9000,cap:['LUX Residence','11 binadan ibarət yaşayış kompleksi']},
  {p:pl.clone().add(V(34,17,30)),t:pl.clone().setY(2),ms:6500,cap:['Həyət','Uşaq və idman meydançaları, yaşıllıq, fəvvarə']},
  {p:clearSpot(58,8),t:V(0,POD*.55,0),ms:6000,cap:['Podium','İlk mərtəbələrdə mağaza və xidmət obyektləri']},
  {p:clearSpot(72,H*.8),t:V(0,H*.6,0),ms:6500,cap:['Fasad','Panoram pəncərələr, şüşə məhəccərli eyvanlar']},
  {p:f.clone().multiplyScalar(-95).setY(104),t:f.clone().multiplyScalar(300).setY(8),ms:7000,cap:['Mənzərə','Yuxarı mərtəbələrdən dəniz və Alov qüllələri']},
  {p:c.clone().add(V(215,96,-205)),t:c.clone().setY(24),ms:9000,cap:['Axşam','Gün batır, kompleks işıqlanır'],tod:'night'},
  {p:c.clone().add(V(-150,70,-210)),t:c.clone().setY(26),ms:7000,cap:['LUX Residence','Mənzil seçmək üçün binaya toxunun']}];}
function tourStep(){if(!TOUR.on)return;const st=TOUR.steps[TOUR.i];if(!st){if(TOUR.loop){setTOD('day',1500);TOUR.i=1;return tourStep();}return stopTour();}
 if(st.cap){$('tcT').textContent=st.cap[0];$('tcS').textContent=st.cap[1];$('tourbar').classList.remove('sw');void $('tourbar').offsetWidth;$('tourbar').classList.add('sw');}
 if(st.tod)setTOD(st.tod,Math.min(st.ms,5600));flyTo(st.p,st.t,st.ms,()=>{TOUR.i++;tourStep();});}
function startTour(loop){if(TOUR.on||MK.on||INT.on)return;if(VIEW)exitView();if(SEL)exitFloor();if(document.body.classList.contains('sun'))closeSun();closePanel(true);
 TOUR.on=true;TOUR.loop=!!loop;TOUR.steps=tourSteps();TOUR.c={min:controls.minDistance,max:controls.maxDistance,pol:controls.maxPolarAngle};Object.assign(controls,{minDistance:2,maxDistance:1200,maxPolarAngle:Math.PI*.52,autoRotate:false});
 document.body.classList.add('tour');$('hint').style.opacity=0;camera.position.copy(TOUR.steps[0].p);controls.target.copy(TOUR.steps[0].t);TOUR.i=1;tourStep();}
function stopTour(){if(!TOUR.on)return;TOUR.on=false;anim=null;document.body.classList.remove('tour');if(SUN.on)setTOD('day',1300);
 flyTo(HOME.pos.clone(),HOME.tgt.clone(),1500,()=>{Object.assign(controls,{minDistance:TOUR.c.min,maxDistance:TOUR.c.max,maxPolarAngle:TOUR.c.pol});});}
document.getElementById('tourbtn').addEventListener('click',()=>startTour(false));document.getElementById('tourx').addEventListener('click',stopTour);
addEventListener('keydown',e=>{if(e.key==='Escape'&&TOUR.on)stopTour();});

/* ---------- loop ---------- */
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function loop(now){requestAnimationFrame(loop);
 if(anim){const t=Math.min(1,(now-anim.s)/anim.ms),k=ease(t);camera.position.lerpVectors(anim.p0,anim.p1,k);controls.target.lerpVectors(anim.t0,anim.t1,k);if(t>=1){const dn=anim.done;anim=null;if(dn)dn();}}
 sunTick(now);todTick(now);lifeTick(now);updTL(now);if(INT.on){INT.ctl.update();renderer.render(INT.scene,INT.cam);}else{controls.update();renderer.render(scene,camera);}if(lblItems.length)updLabels();}
requestAnimationFrame(loop);

(async function(){await loadData();buildTabs();buildList();buildTL();$('load').classList.add('off');
 {const f0=+qs.get('f'),u0=qs.get('u'),ar=parseFloat(qs.get('area'));let done=false;
  if(f0>=F0&&f0<=F1){selectFloor(f0);done=true;if(u0){const t=(floors[f0].tiles||[]).find(x=>String(x.userData.u.n)===String(u0));if(t)setTimeout(()=>openApt(t.userData.u),700);}}
  else if(ar){for(const pass of ['available','any']){for(let f=F1;f>=F0&&!done;f--){const u=units(f).find(x=>Math.abs((parseFloat(x.area)||0)-ar)<.06&&(pass==='any'||x.st==='available'));if(u){selectFloor(f);const t=(floors[f].tiles||[]).find(x=>String(x.userData.u.n)===String(u.n));if(t)setTimeout(()=>openApt(t.userData.u),700);done=true;}}if(done)break;}}
  if(!done&&qs.get('maket')!=='1'){if(qs.get('tur'))setTimeout(()=>startTour(qs.get('tur')==='loop'),500);else{const hp=HOME.pos.clone();camera.position.set(hp.x*2.1,hp.y*2.3,hp.z*2.1);flyTo(hp,HOME.tgt.clone(),2800);}}}
 if(!SALES)$('hint').textContent='Satış məlumatı yüklənmədi · Binanı fırlada bilərsiniz';
 if(MOB)$('hint').textContent='Mərtəbəyə toxunun · Fırlatmaq üçün sürüşdürün';})();
