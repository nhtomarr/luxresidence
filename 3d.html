let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
function tree(x,z,s=1){const t=new THREE.Group();const tr=new THREE.Mesh(new THREE.CylinderGeometry(.18*s,.25*s,2.2*s,6),MAT.trunk);tr.position.y=1.1*s;tr.castShadow=true;t.add(tr);
 const c=new THREE.Mesh(new THREE.IcosahedronGeometry(1.5*s,0),MAT.leaf);c.position.y=3*s;c.castShadow=true;t.add(c);t.position.set(x,0,z);scene.add(t);}
for(let i=0;i<46;i++){const a=rnd()*Math.PI*2,r=34+rnd()*40;tree(Math.cos(a)*r,Math.sin(a)*r,.8+rnd()*.7);}
[[-26,20],[-6,23],[6,23],[26,20],[-28,-18],[28,-18]].forEach(p=>tree(p[0],p[1],1));


const FT={h:66,x:-70,z:300,y:-8,ry:0};
/* dəniz, şəhər və Alov qüllələri (kompleksin arxa tərəfində, render istiqamətində) */
{const bay=new THREE.Group();const f=new THREE.Vector3(-0.65,0,-0.76).normalize();bay.rotation.y=Math.atan2(f.x,f.z);scene.add(bay);
 const seaMat=new THREE.MeshStandardMaterial({color:0x4f8fa6,roughness:.18,metalness:.35});
 const sea=new THREE.Mesh(new THREE.PlaneGeometry(3200,1800),seaMat);sea.rotation.x=-Math.PI/2;sea.position.set(0,0.12,290+900);sea.receiveShadow=false;bay.add(sea);
 const shore=new THREE.Mesh(new THREE.PlaneGeometry(3200,14),MAT.paving);shore.rotation.x=-Math.PI/2;shore.position.set(0,0.1,283);bay.add(shore);
 const cMats=[M(0xe6d6c1),M(0xd9c4a8),M(0xcdb89c),M(0xefe4d4),M(0xbfae98)];let sd=11;const r2=()=>{sd=(sd*16807)%2147483647;return sd/2147483647;};
 const cg=new THREE.BoxGeometry(1,1,1);
 for(let i=0;i<190;i++){const x=(r2()-.5)*520,z=70+r2()*205;if(x<-20&&x>-120&&z>215)continue;
  const h=5+Math.pow(r2(),2.4)*20,w=7+r2()*11,d=7+r2()*11;const m=new THREE.Mesh(cg,cMats[i%5]);m.scale.set(w,h,d);m.position.set(x,h/2,z);m.rotation.y=(r2()-.5)*.3;bay.add(m);}
 for(let i=0;i<50;i++){const x=(r2()-.5)*460,z=60+r2()*210;const t=new THREE.Mesh(new THREE.IcosahedronGeometry(2.2,0),MAT.leaf);t.position.set(x,2.6,z);bay.add(t);}
 /* Alov qüllələri — sxematik */
 const prof=[[0,0],[15,0],[15.6,14],[15.2,48],[13.4,90],[10.2,128],[6.2,160],[2.4,182],[0,192]].map(p=>new THREE.Vector2(p[0],p[1]));
 const glass=new THREE.MeshStandardMaterial({color:0xa9bfd0,metalness:.45,roughness:.22,emissive:0x5a3418,emissiveIntensity:.3});
 function flame(sc,lean,x,z,ry){const geo=new THREE.LatheGeometry(prof,40);const pa=geo.attributes.position;
  for(let i=0;i<pa.count;i++){const y=pa.getY(i),t=y/192;pa.setX(i,pa.getX(i)*.72+Math.pow(t,1.8)*lean);}
  geo.computeVertexNormals();const m=new THREE.Mesh(geo,glass);m.scale.setScalar(sc);m.position.set(x,0,z);m.rotation.y=ry;bay.add(m);
  const ring=new THREE.Mesh(new THREE.CylinderGeometry(15.4*sc,16.2*sc,6*sc,40),MAT.dark);ring.scale.x=.72;ring.position.set(x,3*sc,z);ring.rotation.y=ry;bay.add(ring);}

 const proc=new THREE.Group();bay.add(proc);const _add=bay.add.bind(bay);
 const hill=new THREE.Mesh(new THREE.CylinderGeometry(70,95,10,32),M(0xcdb99d,{roughness:1}));hill.position.set(-70,5,258);bay.add(hill);
 flame(.40,10,-55,252,0.3);flame(.48,12,-74,248,-0.2);flame(.36,8,-88,266,0.9);
 /* real model (SketchUp → GLB); yüklənəndə sxematik qüllələr götürülür */
 const procKids=bay.children.slice(-7);
 new GLTFLoader().load('/assets/models/flame-towers.glb',gl=>{const m=gl.scene;const bb=new THREE.Box3().setFromObject(m),sz=new THREE.Vector3(),c=new THREE.Vector3();bb.getSize(sz);bb.getCenter(c);
  const sc=FT.h/sz.y;m.scale.setScalar(sc);m.position.set(FT.x-c.x*sc,-bb.min.y*sc+FT.y,FT.z-c.z*sc);
  const w=new THREE.Group();w.add(m);w.rotation.y=FT.ry;w.position.set(0,0,0);
  const piv=new THREE.Group();piv.position.set(FT.x,0,FT.z);m.position.set(-c.x*sc,-bb.min.y*sc+FT.y,-c.z*sc);piv.add(m);piv.rotation.y=FT.ry;
  m.traverse(o=>{if(o.isMesh){o.castShadow=false;o.receiveShadow=false;const mt=o.material;if(mt){mt.side=THREE.DoubleSide;if(mt.metalness!==undefined){mt.metalness=.2;mt.roughness=.45;}if(mt.emissive){mt.emissive.setHex(0x2a3440);mt.emissiveIntensity=.5;}}}});
  procKids.forEach(k=>bay.remove(k));bay.add(piv);},undefined,()=>{});
}

/* podium (2 commercial floors) */
const podium=new THREE.Group();scene.add(podium);
box(W+8,POD-0.4,D+6,MAT.pod,0,(POD-0.4)/2+0.3,0,podium);
box(W+8.6,0.5,D+6.6,MAT.cream,0,POD/2,0,podium);box(W+8.8,0.6,D+6.8,MAT.cream,0,POD-0.1,0,podium);
for(let i=-4;i<=4;i++){box(0.5,POD-0.4,0.5,MAT.cream,i*(W+8)/8.6,POD/2,(D+6)/2+0.05,podium);}

/* residential floors */
const floors={};const hitboxes=[];
const hlMat=new THREE.MeshBasicMaterial({color:0xe07a45,transparent:true,opacity:.42,depthWrite:false});
const hitMat=new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false,colorWrite:false});
function facade(grp,len,axis,sign,y0){
 const off=(axis==='z'?D:W)/2,bays=Math.round(len/3),bw=len/bays,h=FH-0.36;
 for(let i=0;i<bays;i++){const c=-len/2+bw*(i+.5);const isPanel=(i%3===1);
  if(isPanel){const w=bw-0.5,d=0.34;if(axis==='z')box(w,h,d,MAT.terra,c,y0+0.18+h/2,sign*(off+0.05),grp);else box(d,h,w,MAT.terra,sign*(off+0.05),y0+0.18+h/2,c,grp);}
  if(i%2===0){const p=-len/2+bw*i;if(axis==='z')box(0.5,h,0.5,MAT.cream,p,y0+0.18+h/2,sign*(off+0.1),grp);else box(0.5,h,0.5,MAT.cream,sign*(off+0.1),y0+0.18+h/2,p,grp);}
 }
}
for(let f=F0;f<=F1;f++){
 const y0=POD+(f-F0)*FH,grp=new THREE.Group();grp.userData.f=f;scene.add(grp);
 const shell=new THREE.Group();grp.add(shell);
 box(W+0.7,0.36,D+0.7,MAT.cream,0,y0+0.18,0,shell);
 box(W-0.3,FH-0.36,D-0.3,MAT.glass,0,y0+0.18+(FH-0.36)/2,0,shell);
 facade(shell,W,'z',1,y0);facade(shell,W,'z',-1,y0);facade(shell,D,'x',1,y0);facade(shell,D,'x',-1,y0);
 [[1,1],[1,-1],[-1,1],[-1,-1]].forEach(s=>box(1.1,FH-0.36,1.1,MAT.cream,s[0]*(W/2),y0+0.18+(FH-0.36)/2,s[1]*(D/2),shell));
 const hl=box(W+1.6,FH*0.94,D+1.6,hlMat,0,y0+FH/2,0,grp,false);hl.visible=false;hl.receiveShadow=false;
 const hb=new THREE.Mesh(new THREE.BoxGeometry(W+1.4,FH,D+1.4),hitMat);hb.position.set(0,y0+FH/2,0);hb.userData.f=f;grp.add(hb);hitboxes.push(hb);
 floors[f]={grp,shell,hl,y0,inner:null};
}
/* roof */
const roof=new THREE.Group();scene.add(roof);const ry=POD+(F1-F0+1)*FH;
box(W+0.8,0.5,D+0.8,MAT.cream,0,ry+0.25,0,roof);
box(W+0.8,1.1,0.25,MAT.cream,0,ry+1,(D+0.8)/2,roof);box(W+0.8,1.1,0.25,MAT.cream,0,ry+1,-(D+0.8)/2,roof);box(0.25,1.1,D+0.8,MAT.cream,(W+0.8)/2,ry+1,0,roof);box(0.25,1.1,D+0.8,MAT.cream,-(W+0.8)/2,ry+1,0,roof);
box(9,3.2,6,MAT.dark,2,ry+2.1,-1,roof);
for(let i=0;i<7;i++)box(0.35,3.2,0.35,MAT.terra,-W/2+2+i*2.2,ry+2.1,D/2-3,roof);box(15,0.3,4.2,MAT.terra,-W/2+8.6,ry+3.8,D/2-3,roof);

/* ---------- camera helpers ---------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
const HOME={pos:new THREE.Vector3(MOB?58:92,MOB?74:50,MOB?178:96),tgt:new THREE.Vector3(MOB?0:-6,MOB?28:25,0)};
camera.position.copy(HOME.pos);controls.target.copy(HOME.tgt);
let anim=null;
function flyTo(pos,tgt,ms=900){anim={p0:camera.position.clone(),t0:controls.target.clone(),p1:pos,t1:tgt,s:performance.now(),ms};}

/* ---------- floor interior (sxematik) ---------- */
const COL={available:0x3f9a62,sold:0xb5483b,dim:0xb9b0a6};
function buildInner(f){
 const F=floors[f];if(F.inner){F.grp.remove(F.inner);}
 const inner=new THREE.Group();F.inner=inner;F.grp.add(inner);const y=F.y0+0.36;
 box(W-0.3,0.12,D-0.3,MAT.slab,0,y+0.06,0,inner,false);
 box(W+0.3,1.0,0.25,MAT.cream,0,y+0.5,D/2,inner);box(W+0.3,1.0,0.25,MAT.cream,0,y+0.5,-D/2,inner);box(0.25,1.0,D,MAT.cream,W/2,y+0.5,0,inner);box(0.25,1.0,D,MAT.cream,-W/2,y+0.5,0,inner);
 box(7,2.6,3.6,MAT.core,0,y+1.3,0,inner);
 /* №1 dəniz və Alov qüllələri tərəfdə (-z, -x küncü); nömrələr mərtəbə ətrafında ardıcıl: dəniz tərəfi soldan sağa 1,2,3, arxa tərəf sağdan sola 4,5,6 */
 const us=units(f),n=us.length,south=us.slice(0,Math.ceil(n/2)),north=us.slice(Math.ceil(n/2)).reverse();
 const tiles=[];
 [[north,1],[south,-1]].forEach(([row,side])=>{
  if(!row.length)return;const tot=row.reduce((s,u)=>s+(parseFloat(u.area)||80),0);let x=-W/2+0.3;const z0=side*1.9,z1=side*(D/2-0.3),zc=(z0+z1)/2,dz=Math.abs(z1-z0);
  row.forEach(u=>{const w=(W-0.6)*((parseFloat(u.area)||80)/tot),xc=x+w/2;
   const ok=match(u),mat=new THREE.MeshStandardMaterial({color:OFF()?0xd8c3a6:(ok?COL[u.st]:COL.dim),roughness:.7,emissive:0x000000});
   const t=box(w-0.35,0.16,dz-0.35,mat,xc,y+0.2,zc,inner,false);t.userData={u,ok,base:OFF()?0xd8c3a6:(ok?COL[u.st]:COL.dim)};tiles.push(t);
   box(0.18,1.0,dz,MAT.wall,x,y+0.55,zc,inner);
   x+=w;});
  box(0.18,1.0,dz,MAT.wall,W/2-0.3,y+0.55,zc,inner);
  box(W-0.6,1.0,0.18,MAT.wall,0,y+0.55,z0,inner);
 });
 F.dirP=new THREE.Vector3(-4,y+1.2,-D/2-5);F.tiles=tiles;return tiles;
}

/* ---------- labels ---------- */
const lblBox=document.getElementById('lbls');let lblItems=[];
function setLabels(tiles){lblBox.innerHTML='';if(tiles&&SEL&&floors[SEL].dirP){const el=document.createElement('div');el.className='lbl dir';el.textContent='🌊 Dəniz · Alov qüllələri tərəfi';lblBox.appendChild(el);lblItems=[{el,p:floors[SEL].dirP}];}else lblItems=[];lblItems=lblItems.concat((tiles||[]).map(t=>{const u=t.userData.u,el=document.createElement('div');el.className='lbl';el.innerHTML='№ '+u.n+'<i class="rm" style="font-style:normal"> · '+(u.room||'—')+' otaq</i><span>'+(u.area||'—')+' m²</span>';lblBox.appendChild(el);return {el,p:t.position.clone().add(new THREE.Vector3(0,1.4,0))};}));}
const v3=new THREE.Vector3();
function updLabels(){lblItems.forEach(o=>{v3.copy(o.p).project(camera);const on=v3.z<1;o.el.style.display=on?'':'none';o.el.style.left=((v3.x+1)/2*innerWidth)+'px';o.el.style.top=((1-v3.y)/2*innerHeight)+'px';});}

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
function buildTabs(){$('tabs').innerHTML=BINALAR.map(b=>'<button class="'+(b===CUR?'on':'')+'" data-b="'+b+'">'+b+'</button>').join('');}
function buildList(){document.body.classList.toggle('hide',OFF());let h='';for(let f=F1;f>=F0;f--){const us=units(f),av=OFF()?0:us.filter(u=>u.st==='available').length,ok=OFF()||us.some(match);
 h+='<button class="fr'+(SEL===f?' on':'')+(ok||!us.length?'':' dim')+(av?' av':'')+'" data-f="'+f+'"><span class="num">'+f+'</span><span class="inf"><b>'+ord(f)+' mərtəbə</b><span>'+(HIDE?'Mənzillərə baxın':HST?(us.length?us.length+' mənzil':'Məlumat yoxdur'):(us.length?(av?av+' mənzil satışda':'Hamısı satılıb'):'Məlumat yoxdur'))+'</span></span><span class="dots">'+(OFF()?[]:us).map(u=>'<i style="background:'+(u.st==='available'?'var(--av)':'var(--sd)')+';opacity:'+(match(u)?1:.25)+'"></i>').join('')+'</span></button>';}
 $('fl').innerHTML=h;}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;CUR=b.dataset.b;buildTabs();closePanel();if(SEL)selectFloor(SEL,true);buildList();history.replaceState(null,'','?bina='+encodeURIComponent(CUR));});
$('filt').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;FILTER=b.dataset.f;[...$('filt').children].forEach(x=>x.classList.toggle('on',x===b));buildList();if(SEL)selectFloor(SEL,true);});
$('fl').addEventListener('click',e=>{const b=e.target.closest('.fr');if(!b)return;selectFloor(+b.dataset.f);});
$('crumbB').addEventListener('click',()=>exitFloor());
$('px').addEventListener('click',closePanel);

function selectFloor(f,keepCam){
 SEL=f;closePanel(true);
 for(let k=F0;k<=F1;k++){const F=floors[k];F.grp.visible=k<=f;F.shell.visible=k!==f;F.hl.visible=false;if(F.inner&&k!==f){F.grp.remove(F.inner);F.inner=null;F.tiles=null;}}
 roof.visible=false;const tiles=buildInner(f);setLabels(tiles);
 $('crumb').classList.add('on');$('crumbT').textContent=MOB?(CUR.replace('Bina ','B')+' · '+f+'-'+ord(f).split('-')[1]+' mərt.'):(CUR+' · '+ord(f)+' mərtəbə');buildList();
 const act=$('fl').querySelector('.fr.on');if(act)act.scrollIntoView({block:'nearest'});
 if(!keepCam){const y=floors[f].y0;controls.autoRotate=false;flyTo(new THREE.Vector3(MOB?16:30,y+(MOB?68:24),MOB?72:48),new THREE.Vector3(MOB?1.5:-5,y+(MOB?1:3),MOB?-3:-8));}
 $('hint').style.opacity=0;
}
function exitFloor(){SEL=null;closePanel(true);for(let k=F0;k<=F1;k++){const F=floors[k];F.grp.visible=true;F.shell.visible=true;if(F.inner){F.grp.remove(F.inner);F.inner=null;F.tiles=null;}}roof.visible=true;setLabels(null);$('crumb').classList.remove('on');buildList();flyTo(HOME.pos.clone(),HOME.tgt.clone());}

function stBadge(st){return st==='available'?'<span class="pst" style="background:#e5f3ea;color:#2f7a44">● Satışda</span>':'<span class="pst" style="background:#f7e4e0;color:#a13a2e">● Satılıb</span>';}
function openApt(u){
 const a=findApt(u);ASEL=u;
 $('pbody').innerHTML=(OFF()?'':stBadge(u.st))+'<h3>Mənzil № '+u.n+'</h3><div class="psub">'+CUR+' · '+ord(SEL)+' mərtəbə · '+(u.room||'—')+' otaqlı</div>'
 +'<div class="pplan">'+(a&&a.plan?'<img src="'+(String(a.plan).charAt(0)==='/'||/^https?:|^data:/.test(a.plan)?a.plan:'/'+a.plan)+'" alt="Mənzil planı">':'<em>Plan tezliklə əlavə olunacaq</em>')+'</div>'
 +'<div class="pgrid"><div><small>Sahə</small><b>'+(u.area||'—')+' m²</b></div><div><small>Otaq</small><b>'+(u.room||'—')+'</b></div><div><small>Mərtəbə</small><b>'+SEL+' / '+F1+'</b></div><div><small>Qiymət</small><b>Sorğu ilə</b></div></div>'
 +(a?'<a class="pbtn pri" href="/apt/'+a.id+'">Mənzilə ətraflı bax</a>':'<a class="pbtn pri" href="/planlar">Planlara bax</a>')
 +'<a class="pbtn sec" href="tel:+994508090088">Zəng edin</a><div class="note">3D model sxematikdir; mənzillərin yerləşməsi təxminidir. Dəqiq plan üçün satış ofisi ilə əlaqə saxlayın.</div>';
 $('panel').classList.add('on');
 if(MOB&&!SHIFT){SHIFT=true;const d=new THREE.Vector3(0,-14,0);flyTo(camera.position.clone().add(d),controls.target.clone().add(d),500);}
 (floors[SEL].tiles||[]).forEach(t=>t.material.emissive.setHex(t.userData.u===u?0x3a2a10:0x000000));
}
let SHIFT=false;
function closePanel(silent){if(SHIFT){SHIFT=false;if(!silent){const d=new THREE.Vector3(0,14,0);flyTo(camera.position.clone().add(d),controls.target.clone().add(d),500);}}$('panel').classList.remove('on');ASEL=null;if(SEL&&floors[SEL].tiles)floors[SEL].tiles.forEach(t=>t.material.emissive.setHex(0));}

/* ---------- picking ---------- */
const ray=new THREE.Raycaster(),mp=new THREE.Vector2();let down=null;
function pick(e){const r=canvas.getBoundingClientRect();mp.x=((e.clientX-r.left)/r.width)*2-1;mp.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mp,camera);
 if(SEL){const hits=ray.intersectObjects(floors[SEL].tiles||[],false);return hits.length?{tile:hits[0].object}:null;}
 const hits=ray.intersectObjects(hitboxes,false);return hits.length?{f:hits[0].object.userData.f}:null;}
function setHover(f){if(HOV===f)return;if(HOV&&floors[HOV])floors[HOV].hl.visible=false;HOV=f;if(f&&floors[f])floors[f].hl.visible=true;}
canvas.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const p=pick(e),tip=$('tip');
 if(!SEL&&p&&p.f){setHover(p.f);const us=units(p.f),av=us.filter(u=>u.st==='available').length;tip.innerHTML=ord(p.f)+' mərtəbə<span>'+(OFF()?'':(us.length?(av?av+' satışda':'satılıb'):''))+'</span>';tip.style.display='block';tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-10)+'px';canvas.style.cursor='pointer';}
 else if(SEL&&p&&p.tile&&p.tile.userData.ok){tip.innerHTML='Mənzil № '+p.tile.userData.u.n+'<span>'+p.tile.userData.u.area+' m²</span>';tip.style.display='block';tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-10)+'px';canvas.style.cursor='pointer';}
 else{setHover(null);tip.style.display='none';canvas.style.cursor='';}});
canvas.addEventListener('pointerleave',()=>{setHover(null);$('tip').style.display='none';});
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});
canvas.addEventListener('pointerup',e=>{if(!down)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y)>6;down=null;if(moved)return;const p=pick(e);
 if(!SEL){if(p&&p.f){setHover(null);$('tip').style.display='none';selectFloor(p.f);}return;}
 if(p&&p.tile){if(p.tile.userData.ok)openApt(p.tile.userData.u);}else closePanel();});

/* ---------- loop ---------- */
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function loop(now){requestAnimationFrame(loop);
 if(anim){const t=Math.min(1,(now-anim.s)/anim.ms),k=ease(t);camera.position.lerpVectors(anim.p0,anim.p1,k);controls.target.lerpVectors(anim.t0,anim.t1,k);if(t>=1)anim=null;}
 controls.update();renderer.render(scene,camera);if(lblItems.length)updLabels();}
requestAnimationFrame(loop);

(async function(){await loadData();buildTabs();buildList();$('load').classList.add('off');
 if(!SALES)$('hint').textContent='Satış məlumatı yüklənmədi · Binanı fırlada bilərsiniz';
 if(MOB)$('hint').textContent='Mərtəbəyə toxunun · Fırlatmaq üçün sürüşdürün';})();
