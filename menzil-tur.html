<!doctype html><html lang="az"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>LUX Residence — Mənzil turu</title>
<meta name="theme-color" content="#1a1510">
<style>
:root{--ink:#241109;--cream:#f7f2ec;--rust:#ba4d2c;--line:rgba(255,255,255,.14)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0d0b08;font-family:'Inter',-apple-system,system-ui,sans-serif;color:#fff;overscroll-behavior:none}
#c{position:fixed;inset:0;display:block;touch-action:none}
/* yüklənmə */
#load{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(130% 120% at 50% 0%,#2a2018,#120f0b 70%);transition:opacity .7s}
#load.gone{opacity:0;pointer-events:none}
#load .lg{font-family:'Playfair Display',Georgia,serif;font-size:26px;font-weight:800;letter-spacing:.3em;color:#e0c3a8}
#load .ls{font-size:12px;letter-spacing:.3em;color:#8a7566;margin-top:6px;text-transform:uppercase}
#load .bar{width:180px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:26px;overflow:hidden}
#load .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ba4d2c,#e08a5a);transition:width .3s}
/* üst zolaq */
.hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0)) 16px 12px;background:linear-gradient(180deg,rgba(10,8,5,.75),transparent);pointer-events:none}
.hud>*{pointer-events:auto}
.htit{font-family:'Playfair Display',Georgia,serif;font-size:17px;font-weight:700}
.htit small{display:block;font-family:'Inter',sans-serif;font-size:11px;font-weight:400;color:#c9b4a2;letter-spacing:.04em;margin-top:1px}
.hback{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border:1px solid var(--line);color:#fff;padding:9px 15px;border-radius:99px;font-size:13px;font-weight:600;text-decoration:none}
.hback:active{background:rgba(255,255,255,.2)}
/* otaq adı (keçərkən) */
.room{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:15;font-family:'Playfair Display',serif;font-size:40px;font-weight:800;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.6);opacity:0;transition:opacity .5s;pointer-events:none;letter-spacing:.02em}
.room.show{opacity:1}
/* alt panel — otaq keçidləri */
.rooms{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0));left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:7px;padding:7px;background:rgba(15,12,9,.6);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:99px;max-width:94vw;overflow-x:auto;scrollbar-width:none}
.rooms::-webkit-scrollbar{display:none}
.rooms button{white-space:nowrap;border:none;background:transparent;color:#c9b4a2;padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;flex-shrink:0}
.rooms button.on{background:var(--rust);color:#fff}
/* hərəkət — joystick (mobil) */
#joy{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0));left:22px;width:118px;height:118px;z-index:18;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid var(--line);touch-action:none;display:none}
#joy .nub{position:absolute;top:50%;left:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(0,0,0,.4)}
/* ipucu */
.hint{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0));left:50%;transform:translateX(-50%);z-index:16;font-size:12.5px;color:#c9b4a2;background:rgba(15,12,9,.6);backdrop-filter:blur(10px);padding:8px 16px;border-radius:99px;border:1px solid var(--line);transition:opacity .5s;text-align:center}
.hint.gone{opacity:0;pointer-events:none}
/* crosshair (desktop) */
#cross{position:fixed;top:50%;left:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.5);z-index:14;pointer-events:none;display:none}
@media(hover:none){#cross{display:none!important}}
</style>
</head><body>
<canvas id="c"></canvas>
<div id="cross"></div>
<div class="hud">
 <a class="hback" href="/3d" id="backBtn">‹ Binaya qayıt</a>
 <div class="htit" style="text-align:right">LUX Residence<small id="unitLabel">Nümunə mənzil · 3 otaqlı</small></div>
</div>
<div class="room" id="roomName"></div>
<div class="rooms" id="rooms"></div>
<div id="joy"><div class="nub" id="joynub"></div></div>
<div class="hint" id="hint">Hərəkət üçün sürüşdürün · baxmaq üçün toxunub çəkin</div>
<div id="load"><div class="lg">LUX</div><div class="ls">Mənzil hazırlanır</div><div class="bar"><i id="loadbar"></i></div></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const MOB = matchMedia('(hover:none)').matches || innerWidth<820;
const cv = document.getElementById('c');
(function(){try{var t=document.createElement('canvas');if(!(window.WebGLRenderingContext&&(t.getContext('webgl2')||t.getContext('webgl')||t.getContext('experimental-webgl')))){document.getElementById('load').innerHTML='<div style=\"text-align:center;padding:20px;color:#e0c3a8\">Bu cihaz 3D turu dəstəkləmir.<br><a href=\"/3d\" style=\"color:#e08a5a\">‹ Binaya qayıt</a></div>';throw new Error('no webgl');}}catch(e){throw e;}})();
const renderer = new THREE.WebGLRenderer({canvas:cv, antialias:!MOB, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, MOB?2:2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfd6dd);

const cam = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.05, 100);
const EYE = 1.62; // göz hündürlüyü
cam.position.set(0, EYE, 4.2);

/* ---------- materiallar (PBR) ---------- */
function mat(c, o={}){return new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:.85, metalness:0},o));}
const M = {
 floor:   mat(0xb89066,{roughness:.55}),       // parket
 rug:     mat(0xe8e2d8,{roughness:.95}),
 wall:    mat(0xece7e0,{roughness:.96}),
 wallAcc: mat(0x6b6b63,{roughness:.9}),         // vurğu divar
 ceil:    mat(0xf4f1ec,{roughness:1}),
 sofa:    mat(0x3f4247,{roughness:.8}),         // antrasit divan
 sofaSoft:mat(0xd8d2c7,{roughness:.95}),
 wood:    mat(0x6a4e37,{roughness:.6}),         // tünd ağac
 woodL:   mat(0xc9a876,{roughness:.6}),         // açıq ağac
 white:   mat(0xf2f0ec,{roughness:.7}),
 marble:  mat(0xe9e6e0,{roughness:.25,metalness:.05}),
 metal:   mat(0x2e2e2e,{roughness:.35,metalness:.85}),
 steel:   mat(0xb8bcc0,{roughness:.25,metalness:.9}),
 glass:   new THREE.MeshPhysicalMaterial({color:0xaaccdd,roughness:.05,metalness:0,transmission:.9,transparent:true,opacity:.35,thickness:.3}),
 rust:    mat(0xba4d2c,{roughness:.7}),         // vurğu — yastıq
 green:   mat(0x4a6b4a,{roughness:.9}),         // bitki
 lamp:    new THREE.MeshStandardMaterial({color:0xfff2d8,emissive:0xffedcf,emissiveIntensity:1.2,roughness:.4}),
 tv:      mat(0x0a0a0a,{roughness:.3,metalness:.4}),
 black:   mat(0x1a1a1a,{roughness:.5}),
};

/* otaq ölçüləri */
const RW=10.5, RD=8.5, RH=2.95;   // ümumi en, dərinlik, hündürlük (açıq plan)
const HALF={x:RW/2, z:RD/2};

/* ---------- köməkçi: qutu ---------- */
function box(w,h,d,m,x,y,z,ry=0,parent=scene,shadow=true){
 const g=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
 g.position.set(x,y,z); if(ry)g.rotation.y=ry;
 g.castShadow=shadow; g.receiveShadow=true; parent.add(g); return g;
}
function cyl(r,h,m,x,y,z,parent=scene,seg=24){
 const g=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),m);
 g.position.set(x,y,z);g.castShadow=true;g.receiveShadow=true;parent.add(g);return g;
}

/* ---------- qabıq: döşəmə, tavan, divarlar ---------- */
const colliders=[]; // gəzinti üçün maneələr (AABB)
function collider(mesh,pad=0){mesh.updateMatrixWorld();const b=new THREE.Box3().setFromObject(mesh);b.expandByScalar(pad);colliders.push(b);}

// döşəmə
const floor=new THREE.Mesh(new THREE.PlaneGeometry(RW,RD),M.floor);
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
// parket zolaqları (incə)
for(let i=-RW/2+0.4;i<RW/2;i+=0.8){const ln=box(0.02,0.002,RD,M.wood,i,0.002,0,0,scene,false);ln.receiveShadow=true;}

// tavan
const ceil=new THREE.Mesh(new THREE.PlaneGeometry(RW,RD),M.ceil);
ceil.rotation.x=Math.PI/2; ceil.position.y=RH; scene.add(ceil);

// divarlar (4): ön tərəf şüşə (panoram), qalanı divar
// arxa divar (vurğu, -z)
box(RW,RH,0.12,M.wallAcc,0,RH/2,-HALF.z,0,scene);
// sol divar (-x)
const wL=box(0.12,RH,RD,M.wall,-HALF.x,RH/2,0,0,scene); collider(wL);
// sağ divar (+x)
const wR=box(0.12,RH,RD,M.wall,HALF.x,RH/2,0,0,scene); collider(wR);
// ön tərəf (+z): panoram pəncərə — şüşə + nazik çərçivələr
box(RW,0.12,0.12,M.metal,0,RH-0.06,HALF.z,0,scene,false); // yuxarı rels
box(RW,0.12,0.12,M.metal,0,0.06,HALF.z,0,scene,false);     // aşağı rels
for(let i=-RW/2;i<=RW/2+0.01;i+=RW/4){box(0.08,RH,0.08,M.metal,i,RH/2,HALF.z,0,scene,false);}
const glassWall=box(RW-0.1,RH-0.2,0.04,M.glass,0,RH/2,HALF.z-0.02,0,scene,false);
// arxa divarda collider
collider(box(RW,RH,0.12,M.wallAcc,0,RH/2,-HALF.z,0,scene,false));
collider(glassWall,0.1);

/* ---------- xarici mənzərə (pəncərədən) ---------- */
// uzaq göy + dəniz + şəhər silueti (sadə, pəncərə arxasında)
const sky=new THREE.Mesh(new THREE.PlaneGeometry(60,30),new THREE.MeshBasicMaterial({color:0xaecbe0}));
sky.position.set(0,8,HALF.z+18); scene.add(sky);
const sea=new THREE.Mesh(new THREE.PlaneGeometry(60,14),new THREE.MeshBasicMaterial({color:0x4a7a95}));
sea.position.set(0,-2,HALF.z+17.9); scene.add(sea);
// şəhər binaları silueti
for(let i=0;i<14;i++){const h=3+Math.random()*9, w=1.6+Math.random()*1.8;
 const bld=new THREE.Mesh(new THREE.BoxGeometry(w,h,1),new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(.6,.08,.55+Math.random()*.15)}));
 bld.position.set(-26+i*3.8+Math.random()*2, h/2-1, HALF.z+14+Math.random()*2); scene.add(bld);}

/* ---------- işıqlandırma ---------- */
scene.add(new THREE.HemisphereLight(0xffffff,0x9a8870,0.55));
const ambient=new THREE.AmbientLight(0xfff4e6,0.35); scene.add(ambient);
// gün işığı pəncərədən (əsas, kölgəli)
const sun=new THREE.DirectionalLight(0xfff2de,1.5);
sun.position.set(6,9,16); sun.castShadow=true;
sun.shadow.mapSize.set(MOB?1024:2048,MOB?1024:2048);
sun.shadow.camera.near=1; sun.shadow.camera.far=50;
sun.shadow.camera.left=-9;sun.shadow.camera.right=9;sun.shadow.camera.top=9;sun.shadow.camera.bottom=-9;
sun.shadow.bias=-0.0004; scene.add(sun);
// tavan spot işıqları (isti)
[[-3,-2],[3,-2],[-3,2],[3,2],[0,0]].forEach(([x,z])=>{
 const p=new THREE.PointLight(0xffe8c4,8,7,2); p.position.set(x,RH-0.15,z); scene.add(p);
 box(0.14,0.04,0.14,M.lamp,x,RH-0.04,z,0,scene,false);
});

/* ================= MEBEL ================= */
const furniture=new THREE.Group(); scene.add(furniture);

/* --- QONAQ ZONASI (mərkəz-sol) --- */
// xalça
const rug=new THREE.Mesh(new THREE.PlaneGeometry(4.2,3),M.rug); rug.rotation.x=-Math.PI/2; rug.position.set(-2.2,0.01,1.2); rug.receiveShadow=true; scene.add(rug);
// L divan (antrasit)
const sofa=new THREE.Group(); furniture.add(sofa);
box(3.2,0.45,1.05,M.sofa,0,0.33,0,0,sofa);       // oturacaq uzun
box(3.2,0.5,0.28,M.sofa,0,0.62,-0.4,0,sofa);      // arxa
box(1.0,0.45,2.2,M.sofa,-1.6,0.33,0.6,0,sofa);    // L qol
box(0.28,0.5,2.2,M.sofa,-2.05,0.62,0.6,0,sofa);
// yastıqlar (vurğu terrakota)
box(0.5,0.4,0.15,M.rust,-0.9,0.7,-0.25,0.2,sofa);
box(0.5,0.4,0.15,M.sofaSoft,0.9,0.68,-0.25,-0.15,sofa);
box(0.45,0.38,0.14,M.rust,-1.5,0.68,0.3,0.5,sofa);
sofa.position.set(-2.2,0,1.4); sofa.rotation.y=0; collider(sofa,0);
// jurnal masası (ağac + metal)
const ct=new THREE.Group();furniture.add(ct);
box(1.3,0.06,0.7,M.woodL,0,0.42,0,0,ct);
[[-.55,-.28],[.55,-.28],[-.55,.28],[.55,.28]].forEach(([x,z])=>cyl(0.02,0.42,M.metal,x,0.21,z,ct,10));
box(0.3,0.015,0.2,M.rust,0.2,0.46,0.05,0.3,ct,false); // kitab
ct.position.set(-2.2,0,0.3); collider(ct);
// TV divar (arxa divar, -z)
box(1.9,1.1,0.06,M.tv,-2.2,1.5,-HALF.z+0.1,0,scene);
box(2.6,0.35,0.4,M.wood,-2.2,0.35,-HALF.z+0.25,0,scene); // TV altlıq
box(0.5,0.3,0.12,M.green,-3.2,0.65,-HALF.z+0.3,0,scene); // bitki qab
cyl(0.03,0.9,M.green,-3.2,1.1,-HALF.z+0.3,scene,6); // bitki gövdə

/* --- YEMƏK ZONASI (sağ) --- */
const din=new THREE.Group();furniture.add(din);
box(1.7,0.05,0.9,M.woodL,0,0.75,0,0,din);        // masa üstü
box(1.5,0.68,0.1,M.wood,0,0.38,0.35,0,din,false);
box(1.5,0.68,0.1,M.wood,0,0.38,-0.35,0,din,false);
// stullar
[[-.55,.65],[0,.65],[.55,.65],[-.55,-.65],[0,-.65],[.55,-.65]].forEach(([x,z])=>{
 box(0.42,0.04,0.42,M.white,x,0.47,z,0,din,false);
 box(0.42,0.5,0.04,M.white,x,0.72,z+(z>0?0.19:-0.19),0,din,false);
 [[-.17,-.17],[.17,-.17],[-.17,.17],[.17,.17]].forEach(([dx,dz])=>cyl(0.012,0.47,M.metal,x+dx,0.23,z+dz,din,6));
});
box(0.26,0.3,0.1,M.rust,0,0.95,0,0,din,false); // masa dekoru
din.position.set(3,0,1.8); collider(din,0.1);
// asma lampa yemək üstündə
cyl(0.03,0.8,M.metal,3,RH-0.4,1.8,scene,6);
const pend=new THREE.Mesh(new THREE.ConeGeometry(0.3,0.35,16,1,true),M.lamp);pend.position.set(3,RH-0.9,1.8);scene.add(pend);
const pl=new THREE.PointLight(0xffe4b8,6,5,2);pl.position.set(3,RH-1,1.8);scene.add(pl);

/* --- MƏTBƏX (sağ-arxa) --- */
const kit=new THREE.Group();furniture.add(kit);
// alt kabinetlər (L formasında)
box(3.4,0.9,0.65,M.white,0,0.45,0,0,kit);
box(0.65,0.9,2.2,M.white,1.4,0.45,-1.2,0,kit);
// mərmər tezgah
box(3.5,0.06,0.68,M.marble,0,0.93,0,0,kit,false);
box(0.68,0.06,2.3,M.marble,1.4,0.93,-1.2,0,kit,false);
// üst kabinetlər
box(3.4,0.7,0.35,M.wood,0,2.1,-0.15,0,kit);
// mətbəx ləvazimatı
box(0.5,0.05,0.4,M.steel,-1,0.96,0,0,kit,false); // plita
cyl(0.05,0.3,M.steel,0.9,1.1,0.1,kit,10); // kran
box(0.5,0.3,0.4,M.steel,1.4,1.1,-1.8,0,kit,false); // soyuducu üst
box(0.65,1.8,0.65,M.steel,1.4,0.9,-2,0,kit); // soyuducu
kit.position.set(3.6,0,-2.6); collider(kit,0);
// mətbəx bar stulları
[[-.8,0],[0,0],[.8,0]].forEach(([x])=>{cyl(0.22,0.05,M.wood,x,0.68,0,kit,16);cyl(0.03,0.68,M.metal,x,0.34,0,kit,10);});

/* --- İŞ/KİTAB KÜNCÜ (sol-arxa) --- */
box(1.3,1.8,0.3,M.wood,-HALF.x+0.35,0.9,-1.5,0,scene); // kitab rəfi
for(let i=0;i<4;i++)box(1.2,0.04,0.28,M.woodL,-HALF.x+0.35,0.4+i*0.42,-1.5,0,scene,false);
// kitablar (rəngli)
for(let s=0;s<4;s++)for(let i=0;i<8;i++){const h=0.22+Math.random()*0.08;box(0.05,h,0.2,mat(new THREE.Color().setHSL(Math.random(),.3,.5)),-HALF.x+0.35-0.5+i*0.13,0.42+s*0.42+h/2,-1.5,0,scene,false);}

/* --- dekorativ bitki (künc) --- */
box(0.4,0.4,0.4,M.white,HALF.x-0.5,0.2,HALF.z-0.6,0,scene);
for(let i=0;i<5;i++){const lf=box(0.05,0.6+Math.random()*0.4,0.15,M.green,HALF.x-0.5+(Math.random()-.5)*0.3,0.7,HALF.z-0.6+(Math.random()-.5)*0.3,Math.random(),scene,false);}

/* ---------- otaq keçid nöqtələri (kamera baxış) ---------- */
const VIEWS=[
 {n:'Qonaq otağı', pos:[0.5,EYE,3.2], look:[-2.2,1.2,-1]},
 {n:'Yemək zonası', pos:[1.5,EYE,3.4], look:[3,1,1.8]},
 {n:'Mətbəx', pos:[2.5,EYE,0.5], look:[3.6,1.2,-2.6]},
 {n:'Mənzərə', pos:[0,EYE,2], look:[0,2,HALF.z+10]},
 {n:'İş küncü', pos:[-2.5,EYE,0], look:[-HALF.x,1.2,-1.5]},
];
function buildRooms(){
 const el=document.getElementById('rooms');
 el.innerHTML=VIEWS.map((v,i)=>'<button data-i="'+i+'">'+v.n+'</button>').join('');
 el.onclick=e=>{const b=e.target.closest('button');if(!b)return;goView(+b.dataset.i);};
}
let flyT=0, flyFrom=null, flyTo=null, flyLook=null, flyLookFrom=null;
function goView(i){
 const v=VIEWS[i];
 flyFrom=cam.position.clone(); flyTo=new THREE.Vector3(...v.pos);
 flyLookFrom=lookTarget.clone(); flyLook=new THREE.Vector3(...v.look);
 flyT=0.0001;
 document.querySelectorAll('#rooms button').forEach((b,j)=>b.classList.toggle('on',j===i));
 showRoom(v.n);
}
function showRoom(n){const el=document.getElementById('roomName');el.textContent=n;el.classList.add('show');clearTimeout(showRoom._t);showRoom._t=setTimeout(()=>el.classList.remove('show'),1400);}

/* ---------- gəzinti: yaw/pitch + hərəkət ---------- */
let yaw=Math.PI, pitch=-0.05;
const lookTarget=new THREE.Vector3();
const vel=new THREE.Vector3();
const keys={};
const SPEED=2.6, RADIUS=0.34;

function updateLook(){
 const dir=new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch), Math.sin(pitch), Math.cos(yaw)*Math.cos(pitch));
 lookTarget.copy(cam.position).add(dir);
 cam.lookAt(lookTarget);
}

/* kolliziya: yeni mövqe maneə ilə kəsişirsə, geri */
function tryMove(nx,nz){
 const p=new THREE.Vector3(nx,EYE,nz);
 const bb=new THREE.Box3(new THREE.Vector3(nx-RADIUS,0.1,nz-RADIUS),new THREE.Vector3(nx+RADIUS,RH,nz+RADIUS));
 for(const c of colliders){if(c.intersectsBox(bb))return false;}
 // otaq sərhədi
 if(nx<-HALF.x+RADIUS||nx>HALF.x-RADIUS||nz<-HALF.z+RADIUS||nz>HALF.z-RADIUS)return false;
 return true;
}

/* ---------- siçan/toxunuş idarəetmə ---------- */
let dragLook=null, dragJoy=null;
const joyVec={x:0,y:0};

function onLookMove(dx,dy){
 yaw   -= dx*0.0028;
 pitch -= dy*0.0028;
 pitch = Math.max(-1.1, Math.min(1.1, pitch));
}

// desktop: pointer lock yoxdur, sadə drag ilə bax + WASD
cv.addEventListener('pointerdown',e=>{
 if(MOB) return; // mobil ayrı
 dragLook={x:e.clientX,y:e.clientY}; cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{
 if(MOB||!dragLook)return;
 onLookMove(e.clientX-dragLook.x, e.clientY-dragLook.y);
 dragLook={x:e.clientX,y:e.clientY};
});
cv.addEventListener('pointerup',()=>{dragLook=null;});
addEventListener('keydown',e=>{keys[e.code]=true;});
addEventListener('keyup',e=>{keys[e.code]=false;});

// mobil: sağ yarı = bax, sol joystick = hərəkət
const joyEl=document.getElementById('joy'), joyNub=document.getElementById('joynub');
if(MOB){
 joyEl.style.display='block';
 document.getElementById('cross').style.display='none';
 cv.addEventListener('touchstart',e=>{
  for(const t of e.changedTouches){
   if(t.clientX<innerWidth*0.45 && t.clientY>innerHeight*0.45){continue;} // joystick zonası ayrı idarə
   dragLook={x:t.clientX,y:t.clientY,id:t.identifier};
  }
 },{passive:true});
 cv.addEventListener('touchmove',e=>{
  for(const t of e.changedTouches){
   if(dragLook&&t.identifier===dragLook.id){onLookMove(t.clientX-dragLook.x,t.clientY-dragLook.y);dragLook.x=t.clientX;dragLook.y=t.clientY;}
  }
 },{passive:true});
 cv.addEventListener('touchend',e=>{for(const t of e.changedTouches){if(dragLook&&t.identifier===dragLook.id)dragLook=null;}},{passive:true});
 // joystick
 function joyStart(t){dragJoy={id:t.identifier,cx:t.clientX,cy:t.clientY};}
 function joyMove(t){if(!dragJoy)return;let dx=t.clientX-dragJoy.cx,dy=t.clientY-dragJoy.cy;const d=Math.hypot(dx,dy),max=40;if(d>max){dx*=max/d;dy*=max/d;}joyNub.style.transform='translate('+dx+'px,'+dy+'px)';joyVec.x=dx/max;joyVec.y=dy/max;}
 function joyEnd(){dragJoy=null;joyNub.style.transform='';joyVec.x=0;joyVec.y=0;}
 joyEl.addEventListener('touchstart',e=>{joyStart(e.changedTouches[0]);e.stopPropagation();},{passive:false});
 joyEl.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(dragJoy&&t.identifier===dragJoy.id)joyMove(t);e.stopPropagation();},{passive:false});
 joyEl.addEventListener('touchend',e=>{joyEnd();},{passive:true});
}else{
 document.getElementById('cross').style.display='block';
 document.getElementById('hint').textContent='Baxmaq üçün sürüşdürün · hərəkət üçün W A S D';
}

/* ---------- döngü ---------- */
let last=performance.now();
function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min(0.05,(now-last)/1000); last=now;

 // view keçid animasiyası (otaq düyməsi)
 if(flyT>0){
  flyT=Math.min(1,flyT+dt*1.3);
  const e=flyT<.5?2*flyT*flyT:1-Math.pow(-2*flyT+2,2)/2; // easeInOut
  cam.position.lerpVectors(flyFrom,flyTo,e);
  const lt=new THREE.Vector3().lerpVectors(flyLookFrom,flyLook,e);
  cam.lookAt(lt);
  // yaw/pitch-i son baxışa uyğunlaşdır
  if(flyT>=1){const d=flyLook.clone().sub(cam.position).normalize();yaw=Math.atan2(d.x,d.z);pitch=Math.asin(d.y);flyT=0;}
 }else{
  // hərəkət
  let mf=0,ms=0;
  if(!MOB){
   if(keys['KeyW']||keys['ArrowUp'])mf+=1;
   if(keys['KeyS']||keys['ArrowDown'])mf-=1;
   if(keys['KeyA']||keys['ArrowLeft'])ms-=1;
   if(keys['KeyD']||keys['ArrowRight'])ms+=1;
  }else{mf=-joyVec.y;ms=joyVec.x;}
  if(mf||ms){
   const len=Math.hypot(mf,ms);mf/=len;ms/=len;
   const fwd=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
   const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
   const step=SPEED*dt;
   let nx=cam.position.x+(fwd.x*mf+right.x*ms)*step;
   let nz=cam.position.z+(fwd.z*mf+right.z*ms)*step;
   if(tryMove(nx,cam.position.z))cam.position.x=nx;
   if(tryMove(cam.position.x,nz))cam.position.z=nz;
  }
  cam.position.y=EYE;
  updateLook();
 }
 renderer.render(scene,cam);
}

/* ---------- başlat ---------- */
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
buildRooms();
updateLook();
// yüklənmə animasiyası
let lp=0;const lb=document.getElementById('loadbar');
const li=setInterval(()=>{lp=Math.min(100,lp+8+Math.random()*12);lb.style.width=lp+'%';if(lp>=100){clearInterval(li);setTimeout(()=>{document.getElementById('load').classList.add('gone');},300);}},90);
// ipucu 5 saniyə sonra gizlə
setTimeout(()=>document.getElementById('hint').classList.add('gone'),5500);
requestAnimationFrame(loop);

// URL-dən mənzil məlumatı (varsa)
const q=new URLSearchParams(location.search);
if(q.get('u'))document.getElementById('unitLabel').textContent='Mənzil № '+q.get('u')+(q.get('r')?' · '+q.get('r')+' otaqlı':'');
if(q.get('back'))document.getElementById('backBtn').href=q.get('back');
</script>
</body></html>
