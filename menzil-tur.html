<style>
:root{--ink:#241109;--cream:#f7f2ec;--rust:#ba4d2c;--line:rgba(255,255,255,.14)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0d0b08;font-family:'Inter',-apple-system,system-ui,sans-serif;color:#fff;overscroll-behavior:none}
#c{position:fixed;inset:0;display:block;touch-action:none}
/* yüklənmə */
#load{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(130% 120% at 50% 0%,#2a2018,#120f0b 70%);transition:opacity .7s}

/* üst zolaq */
.hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0)) 16px 12px;background:linear-gradient(180deg,rgba(10,8,5,.75),transparent);pointer-events:none}
.hud>*{pointer-events:auto}
.htit{font-family:'Playfair Display',Georgia,serif;font-size:17px;font-weight:700}
.htit small{display:block;font-family:'Inter',sans-serif;font-size:11px;font-weight:400;color:#c9b4a2;letter-spacing:.04em;margin-top:1px}
.hback{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border:1px solid var(--line);color:#fff;padding:9px 15px;border-radius:99px;font-size:13px;font-weight:600;text-decoration:none}
.hback:active{background:rgba(255,255,255,.2)}
/* otaq adı (keçərkən) */
.room{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:15;font-family:'Playfair Display',serif;font-size:40px;font-weight:800;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.6);opacity:0;transition:opacity .5s;pointer-events:none;letter-spacing:.02em}
.room.show{opacity:1}
/* alt panel — otaq keçidləri */
.rooms{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0));left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:7px;padding:7px;background:rgba(15,12,9,.6);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:99px;max-width:94vw;overflow-x:auto;scrollbar-width:none}
.rooms::-webkit-scrollbar{display:none}
.rooms button{white-space:nowrap;border:none;background:transparent;color:#c9b4a2;padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;flex-shrink:0}
.rooms button.on{background:var(--rust);color:#fff}
/* hərəkət — joystick (mobil) */
#joy{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0));left:22px;width:118px;height:118px;z-index:18;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid var(--line);touch-action:none;display:none}
#joy .nub{position:absolute;top:50%;left:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(0,0,0,.4)}
/* ipucu */
.hint{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0));left:50%;transform:translateX(-50%);z-index:16;font-size:12.5px;color:#c9b4a2;background:rgba(15,12,9,.6);backdrop-filter:blur(10px);padding:8px 16px;border-radius:99px;border:1px solid var(--line);transition:opacity .5s;text-align:center}
.hint.gone{opacity:0;pointer-events:none}
/* crosshair (desktop) */
#cross{position:fixed;top:50%;left:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.5);z-index:14;pointer-events:none;display:none}
@media(hover:none){#cross{display:none!important}}
</style>

<canvas id="c"></canvas>
<div id="cross"></div>
<div class="hud">
 <a class="hback" href="/3d" id="backBtn">‹ Binaya qayıt</a>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
/* LUX Residence — mənzil daxili tur (15.11 fotoreal yeniləmə)
   İşıq: pəncərədən günəş + səma işığı (RectAreaLight) + otaq mühit əksi (RoomEnvironment).
   Masaüstündə GTAO (künc kölgələri) + yüngül bloom. Bütün fakturalar canvas ilə yaradılır — xarici fayl yoxdur. */
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RectAreaLightUniformsLib} from 'three/addons/lights/RectAreaLightUniformsLib.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {GTAOPass} from 'three/addons/postprocessing/GTAOPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const MOB = matchMedia('(hover:none)').matches || innerWidth<820;
const cv = document.getElementById('c');
(function(){var t=document.createElement('canvas');if(!(window.WebGLRenderingContext&&(t.getContext('webgl2')||t.getContext('webgl')))){document.getElementById('load').innerHTML='<div style="text-align:center;padding:20px;color:#e0c3a8">Bu cihaz 3D turu dəstəkləmir.<br><a href="/3d" style="color:#e08a5a">‹ Binaya qayıt</a></div>';throw new Error('no webgl');}})();
const renderer = new THREE.WebGLRenderer({canvas:cv, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, MOB?1.75:2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;
renderer.outputColorSpace = THREE.SRGBColorSpace;
RectAreaLightUniformsLib.init();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1510);
const cam = new THREE.PerspectiveCamera(MOB?72:62, innerWidth/innerHeight, 0.05, 200);
const EYE = 1.62;
cam.position.set(0.5, EYE, 3.2);

/* mühit əksi — otaq işığı kimi yumşaq "bounce" */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

/* ---------- canvas fakturaları ---------- */
const ANI = Math.min(8, renderer.capabilities.getMaxAnisotropy());
function ctex(w,h,draw,rx=1,ry=1,srgb=true){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=ANI;return t;}
const R=(a,b)=>a+Math.random()*(b-a);
function speck(x,w,h,n,cols,a0=.04,a1=.12,s0=.5,s1=2){for(let i=0;i<n;i++){x.globalAlpha=R(a0,a1);x.fillStyle=cols[i%cols.length];const r=R(s0,s1);x.fillRect(Math.random()*w,Math.random()*h,r,r);}x.globalAlpha=1;}
/* parket: 2×2 m sahə, palıd lövhələr (en 18 sm), lif xətləri */
const PQ={};
(function(){const W=1024,H=1024,rows=11,rh=H/rows;const tones=['#b9916a','#ab8360','#c29b73','#a47c58','#b58c64','#9f7853'];
 const rough=document.createElement('canvas');rough.width=W;rough.height=H;const rx=rough.getContext('2d');rx.fillStyle='#8c8c8c';rx.fillRect(0,0,W,H);
 PQ.map=ctex(W,H,(x)=>{for(let r=0;r<rows;r++){let px=-Math.random()*400;while(px<W){const L=R(380,700),c=tones[(Math.random()*tones.length)|0];x.fillStyle=c;x.fillRect(px,r*rh,L,rh);
    for(let g=0;g<26;g++){x.globalAlpha=R(.05,.16);x.strokeStyle=Math.random()<.5?'#6e4d33':'#e2c39c';x.lineWidth=R(.6,1.8);x.beginPath();const y=r*rh+R(2,rh-2);x.moveTo(px,y);for(let k=1;k<=6;k++)x.lineTo(px+L*k/6,y+R(-2.5,2.5));x.stroke();}
    if(Math.random()<.35){x.globalAlpha=.25;x.fillStyle='#6b4a30';x.beginPath();x.ellipse(px+R(40,L-40),r*rh+rh/2,R(4,9),R(2,4),0,0,7);x.fill();}
    x.globalAlpha=1;x.fillStyle='rgba(60,40,25,.55)';x.fillRect(px,r*rh,1.6,rh);
    rx.fillStyle='rgb('+((R(120,160))|0)+','+((R(120,160))|0)+','+((R(120,160))|0)+')';rx.fillRect(px,r*rh,L,rh);px+=L;}
   x.fillStyle='rgba(55,36,22,.6)';x.fillRect(0,r*rh,W,1.4);}
  speck(x,W,H,9000,['#5a3d27','#e8cba6']);},5.25,4.25);
 PQ.rough=new THREE.CanvasTexture(rough);PQ.rough.wrapS=PQ.rough.wrapT=THREE.RepeatWrapping;PQ.rough.repeat.set(5.25,4.25);})();
const plaster=ctex(512,512,(x,w,h)=>{x.fillStyle='#ece6dd';x.fillRect(0,0,w,h);speck(x,w,h,14000,['#d9d1c5','#f8f4ee'],.05,.12,.6,2.4);},3,2);
const micro=ctex(512,512,(x,w,h)=>{x.fillStyle='#8d857b';x.fillRect(0,0,w,h);for(let i=0;i<60;i++){const cx=R(0,w),cy=R(0,h),g=x.createRadialGradient(cx,cy,0,cx,cy,R(40,140));g.addColorStop(0,'rgba(170,160,148,.18)');g.addColorStop(1,'rgba(170,160,148,0)');x.fillStyle=g;x.fillRect(0,0,w,h);}speck(x,w,h,16000,['#6f675e','#a89e92'],.05,.14);},3,1.5);
const marble=ctex(1024,512,(x,w,h)=>{x.fillStyle='#efebe5';x.fillRect(0,0,w,h);for(let i=0;i<18;i++){x.globalAlpha=R(.08,.3);x.strokeStyle=Math.random()<.7?'#9a948c':'#c2a98a';x.lineWidth=R(.6,3.2);x.beginPath();let px=R(-100,w),py=R(0,h);x.moveTo(px,py);for(let k=0;k<9;k++){px+=R(40,160);py+=R(-60,60);x.quadraticCurveTo(px-R(20,60),py+R(-40,40),px,py);}x.stroke();}x.globalAlpha=1;speck(x,w,h,5000,['#d6d0c8'],.04,.1);},1,1);
const travert=ctex(512,512,(x,w,h)=>{x.fillStyle='#d8c8b0';x.fillRect(0,0,w,h);for(let i=0;i<120;i++){x.globalAlpha=R(.08,.22);x.fillStyle=Math.random()<.5?'#bfa98b':'#eadcc6';x.fillRect(0,R(0,h),w,R(1,4));}x.globalAlpha=1;speck(x,w,h,6000,['#a8937a'],.08,.2,.5,1.5);},1,1);
const boucle=ctex(256,256,(x,w,h)=>{x.fillStyle='#d9d0c3';x.fillRect(0,0,w,h);for(let i=0;i<5000;i++){x.globalAlpha=R(.12,.35);x.fillStyle=Math.random()<.5?'#bdb2a3':'#f1ebe2';x.beginPath();x.arc(R(0,w),R(0,h),R(.6,1.8),0,7);x.fill();}x.globalAlpha=1;},4,4);
const linen=ctex(256,256,(x,w,h)=>{x.fillStyle='#f4efe7';x.fillRect(0,0,w,h);for(let i=0;i<w;i+=2){x.globalAlpha=R(.03,.09);x.fillStyle='#bdb3a5';x.fillRect(i,0,1,h);x.fillRect(0,i,w,1);}x.globalAlpha=1;},6,6);
const rugT=ctex(1024,768,(x,w,h)=>{x.fillStyle='#e7dfd3';x.fillRect(0,0,w,h);for(let i=0;i<w;i+=3){x.globalAlpha=R(.04,.1);x.fillStyle='#a99c8a';x.fillRect(i,0,1.2,h);}x.globalAlpha=.55;x.strokeStyle='#b86a45';x.lineWidth=5;x.strokeRect(48,48,w-96,h-96);x.globalAlpha=.25;x.strokeStyle='#8d7f6c';x.lineWidth=2;x.strokeRect(70,70,w-140,h-140);x.globalAlpha=1;speck(x,w,h,20000,['#c9bdae','#f6f1ea'],.08,.2);},1,1);
const walnut=ctex(512,512,(x,w,h)=>{x.fillStyle='#5b3f2b';x.fillRect(0,0,w,h);for(let i=0;i<160;i++){x.globalAlpha=R(.06,.2);x.strokeStyle=Math.random()<.5?'#3c281b':'#7d5a40';x.lineWidth=R(.6,2.4);x.beginPath();let px=R(0,w);x.moveTo(px,0);for(let k=1;k<=8;k++)x.lineTo(px+Math.sin(k*.9+i)*R(2,7),h*k/8);x.stroke();}x.globalAlpha=1;},1,1);
const oak=ctex(512,512,(x,w,h)=>{x.fillStyle='#c4a079';x.fillRect(0,0,w,h);for(let i=0;i<140;i++){x.globalAlpha=R(.05,.16);x.strokeStyle=Math.random()<.5?'#9a7752':'#e0c49f';x.lineWidth=R(.6,2);x.beginPath();let py=R(0,h);x.moveTo(0,py);for(let k=1;k<=8;k++)x.lineTo(w*k/8,py+Math.sin(k+i)*R(1,5));x.stroke();}x.globalAlpha=1;},1,1);
/* divar tablosu — mücərrəd, brend terrakota */
const artT=ctex(600,800,(x,w,h)=>{x.fillStyle='#efe6da';x.fillRect(0,0,w,h);const c=['#b9532f','#d98a5f','#3f3a35','#e3c3a3','#8c6a52'];
 x.globalAlpha=.92;x.fillStyle=c[0];x.beginPath();x.arc(w*.38,h*.62,w*.34,Math.PI,0);x.fill();x.fillStyle=c[3];x.fillRect(w*.04,h*.62,w*.68,h*.06);
 x.fillStyle=c[2];x.beginPath();x.arc(w*.7,h*.32,w*.12,0,7);x.fill();x.fillStyle=c[1];x.beginPath();x.moveTo(w*.55,h*.95);x.quadraticCurveTo(w*.8,h*.55,w*.98,h*.95);x.fill();
 x.globalAlpha=1;speck(x,w,h,30000,['#000','#fff'],.02,.06,.5,1.6);});

/* ---------- materiallar ---------- */
function mat(c,o={}){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85,metalness:0,envMapIntensity:.45},o));}
const M={
 floor:  mat(0xffffff,{map:PQ.map,roughnessMap:PQ.rough,roughness:.62,envMapIntensity:.6}),
 wall:   mat(0xffffff,{map:plaster,roughness:.95,envMapIntensity:.35}),
 accent: mat(0xffffff,{map:micro,roughness:.9,envMapIntensity:.3}),
 ceil:   mat(0xf6f3ee,{roughness:1,envMapIntensity:.3}),
 skirt:  mat(0xf2eee8,{roughness:.5}),
 boucle: mat(0xffffff,{map:boucle,roughness:1,envMapIntensity:.25}),
 linen:  mat(0xffffff,{map:linen,roughness:1,envMapIntensity:.3}),
 rust:   mat(0xb4552f,{roughness:.95,envMapIntensity:.25}),
 olive:  mat(0x6f7254,{roughness:.95,envMapIntensity:.25}),
 rug:    mat(0xffffff,{map:rugT,roughness:1,envMapIntensity:.2}),
 walnut: mat(0xffffff,{map:walnut,roughness:.5,envMapIntensity:.55}),
 oak:    mat(0xffffff,{map:oak,roughness:.45,envMapIntensity:.55}),
 marble: mat(0xffffff,{map:marble,roughness:.18,envMapIntensity:.9}),
 trav:   mat(0xffffff,{map:travert,roughness:.55}),
 white:  mat(0xf3f1ec,{roughness:.35,envMapIntensity:.6}),
 black:  mat(0x1b1b1c,{roughness:.4,metalness:.6,envMapIntensity:.8}),
 brass:  mat(0xb08a52,{roughness:.28,metalness:1,envMapIntensity:1}),
 steel:  mat(0xb9bdc0,{roughness:.22,metalness:1,envMapIntensity:1}),
 tv:     mat(0x060708,{roughness:.12,metalness:.3,envMapIntensity:1.2}),
 hob:    mat(0x0b0b0c,{roughness:.08,metalness:.2,envMapIntensity:1.3}),
 ceramic:mat(0xe9e2d6,{roughness:.6}),
 terra:  mat(0xa4573a,{roughness:.8}),
 leaf:   mat(0x3f5a2f,{roughness:.7,side:THREE.DoubleSide,envMapIntensity:.4}),
 leaf2:  mat(0x54733b,{roughness:.7,side:THREE.DoubleSide,envMapIntensity:.4}),
 frame:  mat(0x1f1f20,{roughness:.45,metalness:.7,envMapIntensity:.8}),
 glass:  new THREE.MeshPhysicalMaterial({color:0xdfe9ee,roughness:.02,metalness:0,transparent:true,opacity:.1,envMapIntensity:1.6,depthWrite:false}),
 sheer:  new THREE.MeshStandardMaterial({color:0xf7f2ea,map:linen,roughness:1,transparent:true,opacity:.55,side:THREE.DoubleSide,depthWrite:false,envMapIntensity:.2}),
 art:    mat(0xffffff,{map:artT,roughness:.9}),
 led:    new THREE.MeshStandardMaterial({color:0xfff1da,emissive:0xffd9a8,emissiveIntensity:0,roughness:1}),
 bulb:   new THREE.MeshStandardMaterial({color:0xfff4e2,emissive:0xffe2b8,emissiveIntensity:.25,roughness:.3,transparent:true,opacity:.92}),
};
M.boucle.color.setHex(0xe2d8ca);M.boucleD=M.boucle.clone();M.boucleD.color.setHex(0xcfc4b5);

/* otaq ölçüləri */
const RW=10.5, RD=8.5, RH=2.95, HALF={x:RW/2,z:RD/2};

function box(w,h,d,m,x,y,z,ry=0,parent=scene,shadow=true){const g=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);g.position.set(x,y,z);if(ry)g.rotation.y=ry;g.castShadow=shadow;g.receiveShadow=true;parent.add(g);return g;}
function rbox(w,h,d,r,m,x,y,z,ry=0,parent=scene,shadow=true){const g=new THREE.Mesh(new RoundedBoxGeometry(w,h,d,3,r),m);g.position.set(x,y,z);if(ry)g.rotation.y=ry;g.castShadow=shadow;g.receiveShadow=true;parent.add(g);return g;}
function cyl(r1,r2,h,m,x,y,z,parent=scene,seg=32,shadow=true){const g=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg),m);g.position.set(x,y,z);g.castShadow=shadow;g.receiveShadow=true;parent.add(g);return g;}

const colliders=[];
function collider(o,pad=0){o.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(o);b.expandByScalar(pad);colliders.push(b);}

/* ---------- qabıq ---------- */
const floor=new THREE.Mesh(new THREE.PlaneGeometry(RW,RD),M.floor);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const ceil=new THREE.Mesh(new THREE.PlaneGeometry(RW,RD),M.ceil);ceil.rotation.x=Math.PI/2;ceil.position.y=RH;scene.add(ceil);
/* asma tavan kənarı + gizli LED zolağı (axşam yanır) */
[[RW,0.5,0,-HALF.z+0.25],[0.5,RD,-HALF.x+0.25,0],[0.5,RD,HALF.x-0.25,0]].forEach(([w,d,x,z])=>{box(w,0.12,d,M.ceil,x,RH-0.06,z,0,scene,false);});
box(RW-1.1,0.02,0.04,M.led,0,RH-0.13,-HALF.z+0.52,0,scene,false);box(0.04,0.02,RD-1.1,M.led,-HALF.x+0.52,RH-0.13,0,0,scene,false);box(0.04,0.02,RD-1.1,M.led,HALF.x-0.52,RH-0.13,0,0,scene,false);
const wBack=box(RW,RH,0.14,M.accent,0,RH/2,-HALF.z,0,scene);collider(wBack);
const wL=box(0.14,RH,RD,M.wall,-HALF.x,RH/2,0,0,scene);collider(wL);
const wR=box(0.14,RH,RD,M.wall,HALF.x,RH/2,0,0,scene);collider(wR);
/* plintus */
box(RW,0.08,0.02,M.skirt,0,0.04,-HALF.z+0.08,0,scene,false);box(0.02,0.08,RD,M.skirt,-HALF.x+0.08,0.04,0,0,scene,false);box(0.02,0.08,RD,M.skirt,HALF.x-0.08,0.04,0,0,scene,false);
/* panoram pəncərə: nazik qara profillər (kölgə salır) */
const win=new THREE.Group();scene.add(win);
box(RW,0.1,0.14,M.frame,0,RH-0.05,HALF.z,0,win);box(RW,0.06,0.14,M.frame,0,0.03,HALF.z,0,win);
for(let i=0;i<=5;i++){box(0.06,RH,0.14,M.frame,-HALF.x+i*RW/5,RH/2,HALF.z,0,win);}

function buildRooms(){const el=document.getElementById('rooms');el.innerHTML=VIEWS.map((v,i)=>'<button data-i="'+i+'">'+v.n+'</button>').join('');el.onclick=e=>{const b=e.target.closest('button');if(!b)return;goView(+b.dataset.i);};}
let flyT=0, flyFrom=null, flyTo=null, flyLook=null, flyLookFrom=null;
function goView(i){const v=VIEWS[i];flyFrom=cam.position.clone();flyTo=new THREE.Vector3(...v.pos);flyLookFrom=lookTarget.clone();flyLook=new THREE.Vector3(...v.look);flyT=0.0001;
 document.querySelectorAll('#rooms button').forEach((b,j)=>b.classList.toggle('on',j===i));showRoom(v.n);}
function showRoom(n){const el=document.getElementById('roomName');el.textContent=n;el.classList.add('show');clearTimeout(showRoom._t);showRoom._t=setTimeout(()=>el.classList.remove('show'),1400);}
window.__tour={goView,setMode};

/* ---------- gəzinti: yaw/pitch + hərəkət ---------- */
let yaw=Math.PI, pitch=-0.05, tyaw=yaw, tpitch=pitch;
const lookTarget=new THREE.Vector3();
const vel=new THREE.Vector3();
const keys={};
const SPEED=2.6, RADIUS=0.34;

function updateLook(){
 const dir=new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch), Math.sin(pitch), Math.cos(yaw)*Math.cos(pitch));
 lookTarget.copy(cam.position).add(dir);
 cam.lookAt(lookTarget);
}

/* kolliziya: yeni mövqe maneə ilə kəsişirsə, geri */
function tryMove(nx,nz){
 const p=new THREE.Vector3(nx,EYE,nz);
 const bb=new THREE.Box3(new THREE.Vector3(nx-RADIUS,0.1,nz-RADIUS),new THREE.Vector3(nx+RADIUS,RH,nz+RADIUS));
 for(const c of colliders){if(c.intersectsBox(bb))return false;}
 // otaq sərhədi
 if(nx<-HALF.x+RADIUS||nx>HALF.x-RADIUS||nz<-HALF.z+RADIUS||nz>HALF.z-RADIUS)return false;
 return true;
}

/* ---------- siçan/toxunuş idarəetmə ---------- */
let dragLook=null, dragJoy=null;
const joyVec={x:0,y:0};

function onLookMove(dx,dy){
 tyaw   -= dx*0.0026;
 tpitch -= dy*0.0026;
 tpitch = Math.max(-1.1, Math.min(1.1, tpitch));
}

// desktop: pointer lock yoxdur, sadə drag ilə bax + WASD
cv.addEventListener('pointerdown',e=>{
 if(MOB) return; // mobil ayrı
 dragLook={x:e.clientX,y:e.clientY}; cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{
 if(MOB||!dragLook)return;
 onLookMove(e.clientX-dragLook.x, e.clientY-dragLook.y);
 dragLook={x:e.clientX,y:e.clientY};
});
cv.addEventListener('pointerup',()=>{dragLook=null;});
addEventListener('keydown',e=>{keys[e.code]=true;});
addEventListener('keyup',e=>{keys[e.code]=false;});

// mobil: sağ yarı = bax, sol joystick = hərəkət
const joyEl=document.getElementById('joy'), joyNub=document.getElementById('joynub');
if(MOB){
 joyEl.style.display='block';
 document.getElementById('cross').style.display='none';
 cv.addEventListener('touchstart',e=>{
  for(const t of e.changedTouches){
   if(t.clientX<innerWidth*0.45 && t.clientY>innerHeight*0.45){continue;} // joystick zonası ayrı idarə
   dragLook={x:t.clientX,y:t.clientY,id:t.identifier};
  }
 },{passive:true});
 cv.addEventListener('touchmove',e=>{
  for(const t of e.changedTouches){
   if(dragLook&&t.identifier===dragLook.id){onLookMove(t.clientX-dragLook.x,t.clientY-dragLook.y);dragLook.x=t.clientX;dragLook.y=t.clientY;}
  }
 },{passive:true});
 cv.addEventListener('touchend',e=>{for(const t of e.changedTouches){if(dragLook&&t.identifier===dragLook.id)dragLook=null;}},{passive:true});
 // joystick
 function joyStart(t){dragJoy={id:t.identifier,cx:t.clientX,cy:t.clientY};}
 function joyMove(t){if(!dragJoy)return;let dx=t.clientX-dragJoy.cx,dy=t.clientY-dragJoy.cy;const d=Math.hypot(dx,dy),max=40;if(d>max){dx*=max/d;dy*=max/d;}joyNub.style.transform='translate('+dx+'px,'+dy+'px)';joyVec.x=dx/max;joyVec.y=dy/max;}
 function joyEnd(){dragJoy=null;joyNub.style.transform='';joyVec.x=0;joyVec.y=0;}
 joyEl.addEventListener('touchstart',e=>{joyStart(e.changedTouches[0]);e.stopPropagation();},{passive:false});
 joyEl.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(dragJoy&&t.identifier===dragJoy.id)joyMove(t);e.stopPropagation();},{passive:false});
 joyEl.addEventListener('touchend',e=>{joyEnd();},{passive:true});
}else{
 document.getElementById('cross').style.display='block';
 document.getElementById('hint').textContent='Baxmaq üçün sürüşdürün · hərəkət üçün W A S D';
}

/* ---------- döngü ---------- */
let last=performance.now();
function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min(0.05,(now-last)/1000); last=now;

 // view keçid animasiyası (otaq düyməsi)
 if(flyT>0){
  flyT=Math.min(1,flyT+dt*1.3);
  const e=flyT<.5?2*flyT*flyT:1-Math.pow(-2*flyT+2,2)/2; // easeInOut
  cam.position.lerpVectors(flyFrom,flyTo,e);
  const lt=new THREE.Vector3().lerpVectors(flyLookFrom,flyLook,e);
  cam.lookAt(lt);
  // yaw/pitch-i son baxışa uyğunlaşdır
  if(flyT>=1){const d=flyLook.clone().sub(cam.position).normalize();yaw=tyaw=Math.atan2(d.x,d.z);pitch=tpitch=Math.asin(d.y);flyT=0;}
 }else{
  // hərəkət
  let mf=0,ms=0;
  if(!MOB){
   if(keys['KeyW']||keys['ArrowUp'])mf+=1;
   if(keys['KeyS']||keys['ArrowDown'])mf-=1;
   if(keys['KeyA']||keys['ArrowLeft'])ms-=1;
   if(keys['KeyD']||keys['ArrowRight'])ms+=1;
  }else{mf=-joyVec.y;ms=joyVec.x;}
  if(mf||ms){
   const len=Math.hypot(mf,ms);mf/=len;ms/=len;
   const fwd=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
   const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
   const step=SPEED*dt;
   let nx=cam.position.x+(fwd.x*mf+right.x*ms)*step;
   let nz=cam.position.z+(fwd.z*mf+right.z*ms)*step;
   if(tryMove(nx,cam.position.z))cam.position.x=nx;
   if(tryMove(cam.position.x,nz))cam.position.z=nz;
  }
  const k=1-Math.exp(-dt*14);yaw+=(tyaw-yaw)*k;pitch+=(tpitch-pitch)*k;
  cam.position.y=EYE;
  updateLook();
 }
 if(composer)composer.render();else renderer.render(scene,cam);
}

/* ---------- başlat ---------- */
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(composer){composer.setSize(innerWidth,innerHeight);}});
buildRooms();
{const v=VIEWS[0];cam.position.set(...v.pos);const d=new THREE.Vector3(...v.look).sub(cam.position).normalize();yaw=tyaw=Math.atan2(d.x,d.z);pitch=tpitch=Math.asin(d.y);document.querySelector('#rooms button').classList.add('on');}
updateLook();
document.getElementById('modeBtn').onclick=()=>setMode(!NIGHT);
// yüklənmə animasiyası
let lp=0;const lb=document.getElementById('loadbar');
const li=setInterval(()=>{lp=Math.min(100,lp+8+Math.random()*12);lb.style.width=lp+'%';if(lp>=100){clearInterval(li);setTimeout(()=>{document.getElementById('load').classList.add('gone');},300);}},90);
// ipucu 5 saniyə sonra gizlə
setTimeout(()=>document.getElementById('hint').classList.add('gone'),5500);
requestAnimationFrame(loop);

// URL-dən mənzil məlumatı (varsa)
const q=new URLSearchParams(location.search);
if(q.get('u'))document.getElementById('unitLabel').textContent='Mənzil № '+q.get('u')+(q.get('r')?' · '+q.get('r')+' otaqlı':'');
if(q.get('back'))document.getElementById('backBtn').href=q.get('back');
</script>
