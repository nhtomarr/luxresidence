<style>
.sb-top{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:18px}
@media(max-width:860px){.sb-top{grid-template-columns:1fr}}
.sb-avail{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sb-avail span{background:var(--bg2);border:1px solid var(--rule);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600}
.sb-avail span b{color:var(--lime);font-size:15px}
.sb-bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--bg2);margin:12px 0 10px}
.sb-bar i{display:block;height:100%}
.sb-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2)}
.sb-leg span{display:inline-flex;align-items:center;gap:6px;cursor:pointer;opacity:.9}
.sb-leg span.off{opacity:.35}
.sb-leg i{width:10px;height:10px;border-radius:3px}
.sb-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0 14px}
.sb-ctl .nc-sel{width:auto;height:38px;border-radius:99px;font-size:13.5px;padding:0 14px}
.sb-ctl .grow{flex:1}
.board{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:16px 14px 18px;overflow-x:auto}
.fr{display:flex;align-items:stretch;gap:8px;margin-bottom:8px;min-width:min-content}
.fl{flex:none;width:44px;display:grid;place-items:center;font-size:13px;font-weight:650;color:var(--mut);border-right:1px solid var(--rule);padding-right:6px}
.us{display:flex;gap:8px;flex:1}
.u{flex:1 0 92px;min-width:92px;height:62px;border-radius:14px;border:1px solid transparent;display:flex;flex-direction:column;justify-content:center;padding:0 12px;position:relative;cursor:pointer;transition:transform .18s var(--spring),box-shadow .2s,opacity .2s;text-align:left;color:#fff}
.u:hover{transform:translateY(-2px);box-shadow:0 12px 24px -12px rgba(0,0,0,.6)}
.u b{font-size:15px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.u small{font-size:11.5px;opacity:.8;font-variant-numeric:tabular-nums}
.u .cd{position:absolute;top:7px;right:8px;font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:1px 5px;border-radius:5px;background:rgba(0,0,0,.25)}
.u.s-satisda{background:var(--s-satisda);color:var(--ink);border-color:color-mix(in srgb,var(--lime) 45%,transparent);box-shadow:0 8px 22px -14px rgba(63,77,44,.55)}
.u.s-satisda .cd{background:rgba(63,77,44,.14)}
.u.s-sakin{color:#2b2410}
.u.s-sakin .cd{background:rgba(0,0,0,.12)}
.u.dim{opacity:.18;pointer-events:none}
.gbar{flex:1;height:40px;border-radius:12px;display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--mut);background:repeating-linear-gradient(135deg,var(--bg2),var(--bg2) 8px,transparent 8px,transparent 16px);border:1px dashed var(--rule2)}
.ch-row{display:grid;grid-template-columns:110px 1fr 70px;gap:12px;align-items:center;margin:10px 0;font-size:13.5px}
.ch-row .sb-bar{margin:0;height:16px}
.ud{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.ud div{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:10px 14px}
.ud span{display:block;font-size:12px;color:var(--mut);font-weight:600}
.ud b{font-size:16px;font-weight:650}
.dn{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.dn svg{flex:none;margin:0 auto}.dn .c{position:relative;width:190px;height:190px;margin:0 auto}.dn .c div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.dn .c b{font:400 32px var(--fd)}.dn .c span{font-size:12px;color:var(--mut)}
.nc-welcome{position:fixed;left:50%;top:76px;transform:translate(-50%,-20px);opacity:0;z-index:250;background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--lime);border-radius:14px;padding:12px 18px;box-shadow:var(--sh);display:grid;gap:2px;transition:.45s var(--spring);cursor:pointer;max-width:92vw}.nc-welcome.on{opacity:1;transform:translate(-50%,0)}.nc-welcome b{font-size:15px}.nc-welcome span{font-size:12.5px;color:var(--mut)}
.upd{font-size:12px;color:var(--mut);margin-top:10px}
</style>

</head><body>
<main class="nc-wrap" id="app" hidden>
 <div class="nc-title"><div><h1>Satış <em>lövhəsi</em></h1><p id="sub">City Life MMC · bütün binalar</p></div>
  <div class="act"><button class="nc-b sm" onclick="openChart()">Bütün binalar · ətraflı</button><a class="nc-b sm" id="toCalc">Kalkulyator</a><a class="nc-b sm" id="toMuq">Müqavilələr</a><a class="nc-b sm pri" id="toAdm" style="display:none">Paneldə redaktə</a></div></div>
 <div class="sb-top">
  <div class="nc-card"><h3 id="bTitle">Bina</h3><div class="nc-kpis" id="bKpi"></div><div class="sb-avail" id="bAvail"></div></div>
  <div class="nc-card"><h3>Ümumi vəziyyət</h3><div class="nc-kpis" id="aKpi"></div><div class="sb-bar" id="aBar"></div><div class="sb-leg" id="leg"></div></div>
 </div>
 <div class="nc-seg" id="tabs"></div>
 <div class="sb-ctl"><select class="nc-sel" id="fRoom"><option value="">Bütün otaqlar</option></select><select class="nc-sel" id="fSt"><option value="">Bütün statuslar</option><option value="satisda">Satışda</option><option value="satilib">Satılıb</option><option value="investor">İnvestor</option><option value="bron">Bron</option><option value="sakin">Sakin</option><option value="fond">Fond</option><option value="satilmir">Satılmır</option></select><select class="nc-sel" id="fCond"><option value="">İstənilən vəziyyət</option><option>Təmirli</option><option>White Box</option><option>Kirayə</option></select><span class="grow"></span><span class="mut" id="upd" style="font-size:12.5px"></span></div>
 <div class="board" id="board"></div>
</main>
<script>
var S={},COMM={},GAR={},UPD='',cur='',fSt={};
var ORD=['satisda','satilib','investor','bron','sakin','fond','satilmir'];
function short(b){return b.replace('Bina ','').replace(' · Giriş ',' · ');}
function units(b){var o=[];var r=(S[b]&&S[b].rows)||{};Object.keys(r).forEach(function(f){(r[f]||[]).forEach(function(u,i){if(u.s!=='qeyri'&&u.s!=='zirzemi')o.push({b:b,f:f,i:i,u:u});});});return o;}
function cnt(list){var c={};list.forEach(function(x){c[x.u.s]=(c[x.u.s]||0)+1;});return c;}
function bar(c,tot){return ORD.filter(function(k){return c[k];}).map(function(k){return '<i style="width:'+(c[k]*100/tot)+'%;background:'+NC.ST[k][1]+'" title="'+NC.ST[k][0]+': '+c[k]+'"></i>';}).join('');}
function flab(b,f){var l=S[b].labels&&S[b].labels[f];return l?(l==='M'?'Mansard':l==='1·II'?'1-ci mərtəbə, II səviyyə':l):f+'-cı mərtəbə';}
function start(){var B=NC.base();NC.$('toCalc').href=B+'kalkulyator';NC.$('toMuq').href=B+'muqavile';NC.$('toCalc').style.display=NC.can(['nc_calc','nc_calc_admin'])?'':'none';NC.$('toMuq').style.display=NC.can('nc_contracts')?'':'none';if(NC.can('nc_sales_edit')){NC.$('toAdm').href=B+'admin?t=sales';NC.$('toAdm').style.display='';}greet();
 NC.kv('nc_commercial').then(function(r){COMM=(r&&r.value)||{};}).catch(function(){}).then(function(){return NC.kv('nc_garage');}).then(function(r){GAR=(r&&r.value)||{};if(Object.keys(COMM).length||Object.keys(GAR).length)render();}).catch(function(){});
 NC.kv('nc_sales').then(function(r){S=(r&&r.value)||{};UPD=r&&r.updated_at;var ks=Object.keys(S);if(!cur||!S[cur]){try{cur=sessionStorage.getItem('nc_sb')||'';}catch(e){}if(!S[cur])cur=ks[0];}
  NC.$('app').hidden=false;fillRooms();render();}).catch(function(e){NC.toast('Yüklənmədi: '+e.message);});}
function fillRooms(){var rs={};Object.keys(S).forEach(function(b){units(b).forEach(function(x){if(x.u.room)rs[x.u.room]=1;});});var s=NC.$('fRoom'),v=s.value;s.innerHTML='<option value="">Bütün otaqlar</option>'+Object.keys(rs).sort().map(function(r){return '<option value="'+r+'">'+r+' otaqlı</option>';}).join('');s.value=v;}
function render(){
 NC.$('tabs').innerHTML=Object.keys(S).map(function(b){var a=units(b).filter(function(x){return x.u.s==='satisda';}).length;return '<button class="'+(b===cur?'on':'')+'" data-b="'+NC.esc(b)+'">'+NC.esc(short(b))+'<small>'+a+'</small></button>';}).join('')+(Object.keys(COMM).length?'<button class="'+(cur==='__com'?'on':'')+'" data-b="__com" style="border-style:dashed">Qeyri-yaşayış</button>':'')+(Object.keys(GAR).length?'<button class="'+(cur==='__gar'?'on':'')+'" data-b="__gar" style="border-style:dashed">Qaraj</button>':'');
 NC.$('tabs').querySelectorAll('button').forEach(function(x){x.onclick=function(){cur=x.dataset.b;try{sessionStorage.setItem('nc_sb',cur);}catch(e){}render();};});
 if(cur==='__com'||cur==='__gar'){renderSub();return;}if(!S[cur])cur=Object.keys(S)[0];var L=units(cur),c=cnt(L);NC.$('bTitle').textContent=cur;
 NC.$('bKpi').innerHTML='<div class="nc-kpi"><b>'+L.length+'</b><span>mənzil</span></div><div class="nc-kpi"><b style="color:var(--lime)">'+(c.satisda||0)+'</b><span>satışda</span></div><div class="nc-kpi"><b>'+(c.satilib||0)+'</b><span>satılıb</span></div>';
 var br={};L.forEach(function(x){if(x.u.s==='satisda'){var k=x.u.room||'?';br[k]=(br[k]||0)+1;}});
 NC.$('bAvail').innerHTML=Object.keys(br).sort().map(function(k){return '<span>'+(k==='?'?'Otaq sayı yazılmayıb':k+' otaqlı')+' · <b>'+br[k]+'</b></span>';}).join('')||'<span class="mut">Satışda mənzil yoxdur</span>';
 var A=[];Object.keys(S).forEach(function(b){A=A.concat(units(b));});var ca=cnt(A);
 NC.$('aKpi').innerHTML='<div class="nc-kpi"><b>'+A.length+'</b><span>ümumi mənzil</span></div><div class="nc-kpi"><b>'+(ca.satilib||0)+'</b><span>satılıb · '+Math.round((ca.satilib||0)*100/(A.length||1))+'%</span></div><div class="nc-kpi"><b style="color:var(--lime)">'+(ca.satisda||0)+'</b><span>satışda</span></div>';
 NC.$('aBar').innerHTML=bar(ca,A.length);
 NC.$('leg').innerHTML=ORD.map(function(k){return '<span data-k="'+k+'" class="'+(fSt[k]?'off':'')+'"><i style="background:'+NC.ST[k][1]+'"></i>'+NC.ST[k][0]+' · '+(ca[k]||0)+'</span>';}).join('');
 NC.$('leg').querySelectorAll('span').forEach(function(x){x.onclick=function(){fSt[x.dataset.k]=!fSt[x.dataset.k];render();};});
 NC.$('upd').textContent=UPD?'Yeniləndi: '+new Date(UPD).toLocaleString('az-AZ',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
 board();}
function board(){if(cur==='__com'||cur==='__gar'){renderSub();return;}var b=S[cur];if(!b)return;var fr=NC.$('fRoom').value,fc=NC.$('fCond').value,fs=NC.$('fSt').value;var fls=Object.keys(b.rows).sort(function(x,y){return Number(y)-Number(x);});var h='';
 fls.forEach(function(f){var us=b.rows[f]||[];if(!us.length)return;var lab=b.labels&&b.labels[f]?b.labels[f]:(Number(f)<0?'Z':f);h+='<div class="fr"><div class="fl">'+NC.esc(lab)+'</div><div class="us">';
  if(us.every(function(u){return u.s==='zirzemi';})){h+='<div class="gbar">Zirzəmi</div></div></div>';return;}
  if(us.every(function(u){return u.s==='qeyri';})){h+='<div class="gbar">Qeyri-yaşayış sahəsi</div></div></div>';return;}
  us.forEach(function(u,i){var m=!fSt[u.s]&&(!fs||u.s===fs)&&(!fr||String(u.room)===fr)&&(!fc||(u.c||'').indexOf(fc)>=0);var st=NC.ST[u.s]||['?','#555'];var cd=(u.c||'').indexOf('Təmirli')>=0?'T':(u.c||'').indexOf('White')>=0?'WB':'';
   h+='<button class="u s-'+u.s+(m?'':' dim')+'" style="'+(u.s==='satisda'?'':'background:'+st[1])+'" data-f="'+f+'" data-i="'+i+'" title="'+NC.esc(st[0])+'"><b>'+(u.room?u.room+' otaq':'№ '+u.n)+'</b><small>'+(u.area&&u.s!=='sakin'?u.area+' m²':st[0])+'</small>'+(cd?'<span class="cd">'+cd+'</span>':'')+'</button>';});
  h+='</div></div>';});
 var bd=NC.$('board');bd.innerHTML=h;bd.querySelectorAll('.u').forEach(function(x){x.onclick=function(){openUnit(x.dataset.f,+x.dataset.i);};});}
NC.$('fRoom').onchange=board;NC.$('fSt').onchange=function(){if(cur==='__com'||cur==='__gar')renderSub();else board();};NC.$('fCond').onchange=board;
function openUnit(f,i){var u=S[cur].rows[f][i],st=NC.ST[u.s]||['?'];
 var h=NC.mh(NC.esc(short(cur))+' · '+flab(cur,f)+' · №'+NC.esc(u.n),'<span class="nc-pill" style="color:'+(u.s==='satisda'?'var(--lime)':st[1])+'"><i></i>'+st[0]+'</span>')+
 '<div class="ud"><div><span>Otaq</span><b>'+(u.room||'—')+'</b></div><div><span>Sahə</span><b>'+(u.area&&u.s!=='sakin'?u.area+' m²':'—')+'</b></div><div><span>Vəziyyət</span><b>'+NC.esc(u.c||'—')+'</b></div><div><span>Mərtəbə</span><b>'+NC.esc(flab(cur,f))+'</b></div></div>'+
 (u.note?'<p class="mut" style="margin:0 0 14px">'+NC.esc(u.note)+'</p>':'');
 if(u.by)h+='<div class="upd">Son dəyişiklik: '+NC.esc(u.by)+' · '+NC.esc(u.at||'')+'</div>';
 var B=NC.base();h+='<div class="mf">'+(NC.can('nc_sales_edit')?'<a class="nc-b" href="'+B+'admin?t=sales&b='+encodeURIComponent(cur)+'&f='+encodeURIComponent(f)+'&i='+i+'">Paneldə redaktə et</a>':'')+(u.s==='satisda'&&u.area&&NC.can(['nc_calc','nc_calc_admin'])?'<a class="nc-b pri" href="'+B+'kalkulyator?area='+encodeURIComponent(u.area)+'&u='+encodeURIComponent(short(cur)+', '+flab(cur,f)+', №'+u.n)+'">Kalkulyatorda hesabla</a>':'<button class="nc-b" onclick="NC.close()">Bağla</button>')+'</div>';
 NC.modal(h);}
function openChart(){var rows=Object.keys(S).map(function(b){var L=units(b),c=cnt(L);return '<div class="ch-row"><b>'+NC.esc(short(b))+'</b><div class="sb-bar">'+bar(c,L.length||1)+'</div><span class="mut num" style="text-align:right">'+(c.satisda||0)+' / '+L.length+'</span></div>';}).join('');
 var A=[];Object.keys(S).forEach(function(b){A=A.concat(units(b));});var ca=cnt(A);
 var R=15.9155,off=25,seg='';ORD.filter(function(k){return ca[k];}).forEach(function(k){var p=ca[k]*100/A.length;seg+='<circle cx="21" cy="21" r="'+R+'" fill="none" stroke="'+NC.ST[k][1]+'" stroke-width="6" stroke-dasharray="'+p+' '+(100-p)+'" stroke-dashoffset="'+off+'"><title>'+NC.ST[k][0]+': '+ca[k]+'</title></circle>';off-=p;});
 var dn='<div class="dn"><div class="c"><svg viewBox="0 0 42 42" width="190" height="190"><circle cx="21" cy="21" r="'+R+'" fill="none" stroke="var(--card2)" stroke-width="6"/>'+seg+'</svg><div><b>'+A.length+'</b><span>ümumi mənzil</span></div></div></div>';
 NC.modal(NC.mh('Bütün binalar üzrə statuslar','Qeyri-yaşayış və zirzəmi daxil deyil · sağda: satışda / ümumi')+dn+rows+'<div class="sb-leg" style="margin-top:16px">'+ORD.filter(function(k){return ca[k];}).map(function(k){return '<span><i style="background:'+NC.ST[k][1]+'"></i>'+NC.ST[k][0]+' · '+ca[k]+' ('+Math.round(ca[k]*100/A.length)+'%)</span>';}).join('')+'</div>',{wide:true});}
function cntG(G){var c={},t=0,m=0;Object.keys(G).forEach(function(bn){var rw=(G[bn]&&G[bn].rows)||{};Object.keys(rw).forEach(function(f){(rw[f]||[]).forEach(function(u){t++;c[u.s]=(c[u.s]||0)+1;m+=parseFloat(u.area)||0;});});});return {c:c,t:t,m:m};}
function renderSub(){var G=cur==='__com'?COMM:GAR,nm=cur==='__com'?'Qeyri-yaşayış sahələri':'Qaraj yerləri',k=cntG(G);NC.$('bTitle').textContent=nm;
 NC.$('bKpi').innerHTML='<div class="nc-kpi"><b>'+k.t+'</b><span>obyekt</span></div><div class="nc-kpi"><b style="color:var(--lime)">'+(k.c.satisda||0)+'</b><span>satışda</span></div><div class="nc-kpi"><b>'+(k.c.satilib||0)+'</b><span>satılıb</span></div>';
 NC.$('bAvail').innerHTML=k.m?'<span>Ümumi sahə · <b>'+NC.fmt(k.m)+' m²</b></span>':'';
 var fs=NC.$('fSt').value,h='';Object.keys(G).forEach(function(bn){var b=G[bn];if(!b||!b.rows)return;h+='<h3 style="margin:6px 0 10px;font:400 19px var(--fd)">'+NC.esc(bn)+'</h3>';
  Object.keys(b.rows).sort(function(x,y){return Number(y)-Number(x);}).forEach(function(f){var us=b.rows[f]||[];if(!us.length)return;var lab=b.labels&&b.labels[f]?b.labels[f]:(Number(f)<0?'Z':f);h+='<div class="fr"><div class="fl">'+NC.esc(lab)+'</div><div class="us">';
   us.forEach(function(u){var m=!fSt[u.s]&&(!fs||u.s===fs);var st=NC.ST[u.s]||['?','#888'];h+='<div class="u s-'+u.s+(m?'':' dim')+'" style="cursor:default;'+(u.s==='satisda'?'':'background:'+st[1])+'" title="'+NC.esc(st[0])+'"><b>'+(u.n?'№ '+NC.esc(u.n):'—')+'</b><small>'+(u.area?NC.esc(u.area)+' m²':NC.esc(st[0]))+'</small></div>';});
   h+='</div></div>';});});
 NC.$('board').innerHTML=h||'<p class="mut">Məlumat yoxdur</p>';}
function greet(){var n=String((NC.me&&NC.me.full_name)||'').trim();if(/admin/i.test(n))n='';var hr=+new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Baku',hour:'2-digit',hour12:false}).format(new Date());var g=hr>=5&&hr<12?'Sabahınız xeyir':hr<17?'Günortanız xeyir':'Axşamınız xeyir';
 if(n)NC.$('sub').innerHTML='City Life MMC · <b>'+NC.esc(n)+'</b>';var w=document.createElement('div');w.className='nc-welcome';w.innerHTML='<b>'+g+(n?', '+NC.esc(n):'')+'!</b><span>Satış lövhəsinə xoş gəlmisiniz</span>';document.body.appendChild(w);
 requestAnimationFrame(function(){w.classList.add('on');});setTimeout(function(){w.classList.remove('on');setTimeout(function(){w.remove();},500);},4200);w.onclick=function(){w.classList.remove('on');};}
NC.header('satis','Satış lövhəsi');
NC.auth({perms:['nc_sales','nc_sales_edit','nc_contracts'],title:'Satış lövhəsi',onReady:start});
</script>
</body></html>
