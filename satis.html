<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
:root{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
button{font-family:inherit;cursor:pointer}.muted{color:var(--muted)}
#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(130% 130% at 15% 0%,#3a1d0d,#25120a 60%,#1b0d06)}
.gcard{width:min(400px,100%);background:rgba(255,251,247,.94);border-radius:22px;padding:38px 32px;text-align:center;box-shadow:0 40px 80px -40px rgba(0,0,0,.6)}
.gcard .logo{font-family:var(--serif);font-weight:700;font-size:26px;color:var(--rust)}.gcard .sub{color:var(--muted);font-size:12px;margin:4px 0 24px;letter-spacing:.14em;text-transform:uppercase}
.gcard input{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:12px;font-size:16px;text-align:center;letter-spacing:.2em;box-sizing:border-box}
.gcard .err{color:#b23b3b;font-size:13px;min-height:18px;margin-top:10px}.gcard button{width:100%;margin-top:8px;padding:14px;border:none;border-radius:12px;background:var(--rust);color:#fff;font-weight:700;font-size:15px}
#app{max-width:1200px;margin:0 auto;padding:clamp(14px,2.5vw,26px)}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.top .logo{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--rust)}.top .sub{color:var(--muted);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.top .back{margin-left:auto;color:var(--rust);font-weight:600;font-size:14px;text-decoration:none;border:1px solid var(--line);padding:8px 14px;border-radius:10px;background:#fff}
.binatabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tsep{width:1px;align-self:stretch;background:var(--line);margin:0 6px}
.btab.com{border-style:dashed;color:#6b5a4a}
.btab.com.on{background:#6b5a4a;color:#fff;border:1px solid #6b5a4a}
.cblk{margin-bottom:26px}
.ggrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;max-width:720px}
.ggrid .ucell{min-width:0}
@media(max-width:640px){.ggrid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.cblk .ch{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.cblk .ch b{font-family:var(--serif);font-size:18px;color:var(--ink)}
.cblk .ch span{font-size:13px;color:var(--muted)}

.btab{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 16px;border-radius:11px;font-weight:700;font-size:14px}
.btab.on{background:var(--rust);color:#fff;border-color:var(--rust)}
.summary{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:12px;font-size:14px}
.summary b{font-family:var(--serif);font-size:20px}.summary .rooms{font-size:13px;color:var(--muted);margin-top:6px}
.summary{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.summary .all{text-align:right;border-left:1px solid var(--line);padding-left:18px;margin-left:auto}
.summary .all .lbl{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-bottom:4px}
.summary .all .nums{display:flex;gap:18px;justify-content:flex-end}
.summary .all .n b{display:block;line-height:1.1}
.summary .all .n span{font-size:12px;color:var(--muted)}
.summary .all .lbl{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.chbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;color:var(--rust);font:inherit;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:none;padding:3px 9px;border-radius:999px;cursor:pointer}
.chbtn:hover{background:var(--rust);color:#fff;border-color:var(--rust)}
.chbtn svg{width:12px;height:12px}
#chartModal{position:fixed;inset:0;background:rgba(40,25,15,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#chartModal.on{display:flex}
#chartModal .mc{background:#fff;border-radius:20px;padding:22px 24px;width:100%;max-width:560px;max-height:90vh;overflow:auto;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.2)}

#chartModal .donut .c b{font-family:var(--serif);font-size:30px;color:var(--ink);line-height:1}
#chartModal .donut .c span{font-size:12px;color:var(--muted);margin-top:4px}
#chartModal ul{list-style:none;margin:0;padding:0;flex:1;min-width:200px}
#chartModal li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
#chartModal li:last-child{border-bottom:none}
#chartModal li i{width:14px;height:14px;border-radius:50%;flex:0 0 auto}
#chartModal li .nm{flex:1;color:var(--ink)}
#chartModal li .ct{font-weight:700;color:var(--ink)}
#chartModal li .pc{width:44px;text-align:right;color:var(--muted);font-size:13px}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-bottom:14px;color:#5f4e40}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters .fg{display:flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.filters label{font-size:12px;color:var(--muted);font-weight:600}
.filters select{border:none;background:transparent;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);outline:none}
.filters .clr{color:var(--rust);font-size:13px;font-weight:600;cursor:pointer;background:none;border:none}
.ucell.dim{opacity:.12}
.board{overflow-x:auto;padding-bottom:8px}
.frow{display:flex;align-items:center;gap:5px;margin-bottom:5px;min-width:max-content}
.fnum{width:26px;text-align:right;font-size:12px;color:var(--muted);font-weight:700;flex:0 0 26px}
.board.wide .fnum{width:62px;flex-basis:62px;font-size:11px}
.funits{display:flex;gap:5px}

try{fetch(U+"/rest/v1/lux_kv?select=key,value",{headers:{apikey:K,Authorization:"Bearer "+K}}).then(function(r){return r.ok?r.json():null;}).then(function(rows){if(!rows)return;rows.forEach(function(row){if(row.key==='lux_sales'&&hasRows(row.value)&&Object.keys(row.value).length>=3){SALES=row.value;try{localStorage.setItem('lux_sales',JSON.stringify(row.value));}catch(e){}}if(row.key==='lux_cfg')CFG=row.value||{};if(row.key==='lux_garage'&&row.value&&typeof row.value==='object'){GAR=row.value;try{localStorage.setItem('lux_garage',JSON.stringify(row.value));}catch(e){}}if(row.key==='lux_commercial'&&row.value&&typeof row.value==='object'){COMM=row.value;try{localStorage.setItem('lux_commercial',JSON.stringify(row.value));}catch(e){}}});if(unlocked)renderTabs();}).catch(function(){});}catch(e){}
function gp(){return (CFG.gatePass!=null&&CFG.gatePass!=='')?String(CFG.gatePass):'1234';}
function enter(){unlocked=true;document.getElementById('gate').style.display='none';document.getElementById('app').hidden=false;var lg=document.getElementById('legend');lg.innerHTML='<span><i class="gl"></i>Satışda</span><span><i style="background:#2f8a54"></i>Satılıb</span><span><i style="background:#c0392b"></i>İnvestor</span><span><i style="background:#e0a800"></i>Sakin</span><span><i style="background:#2e6fb0"></i>Fond</span><span><i style="background:#3a3a3a"></i>Satılmır</span><span><i style="background:#8a8a8a"></i>Qeyri-yaşayış</span>';renderFilters();renderTabs();}
function renderFilters(){var rooms={};Object.keys(SALES).forEach(function(bn){Object.keys(SALES[bn].rows||{}).forEach(function(f){SALES[bn].rows[f].forEach(function(u){if(u.room)rooms[u.room]=1;});});});var rk=Object.keys(rooms).sort();
 var h='<div class="fg"><label>Otaq:</label><select onchange="fRoom=this.value;renderBoard();"><option value="">Hamısı</option>'+rk.map(function(r){return '<option'+(r===fRoom?' selected':'')+'>'+r+'</option>';}).join('')+'</select></div>';
 h+='<div class="fg"><label>Status:</label><select onchange="fStat=this.value;renderBoard();"><option value="">Hamısı</option>'+Object.keys(ST).map(function(k){return '<option value="'+k+'"'+(k===fStat?' selected':'')+'>'+ST[k][0]+'</option>';}).join('')+'</select></div>';
 h+='<button class="clr" onclick="fRoom=\'\';fStat=\'\';renderFilters();renderBoard();">Təmizlə</button>';
 var fe=document.getElementById('filters');if(fe){fe.innerHTML=h;}}
function tryGate(){if((document.getElementById('gpass').value||'').trim()===gp()){sessionStorage.setItem('lux_calc_ok','1');enter();}else{document.getElementById('gerr').textContent='Parol yanlışdır';document.getElementById('gpass').value='';}}
document.getElementById('gbtn').addEventListener('click',tryGate);
document.getElementById('gpass').addEventListener('keydown',function(e){if(e.key==='Enter')tryGate();});
if(sessionStorage.getItem('lux_calc_ok')==='1'){enter();}else{setTimeout(function(){try{document.getElementById('gpass').focus();}catch(e){}},60);}
function renderTabs(){var keys=Object.keys(SALES);var tb=document.getElementById('binatabs');if(!keys.length){tb.innerHTML='';return;}
 var ord=['Bina 1','Bina 2','Bina 3','Bina 4','Bina 5','Bina 6','Bina 9','Bina 10','Bina 11'];keys.sort(function(a,b){var i=ord.indexOf(a),j=ord.indexOf(b);return (i<0?99:i)-(j<0?99:j);});
 var hasC=Object.keys(COMM||{}).length>0,hasG=Object.keys(GAR||{}).length>0;if(!curB||(keys.indexOf(curB)<0&&!(curB==='__com'&&hasC)&&!(curB==='__gar'&&hasG)))curB=keys[0];
 tb.innerHTML=keys.map(function(k){return '<button class="btab'+(k===curB?' on':'')+'" onclick="selB(\''+k+'\')">'+k+'</button>';}).join('')+(hasC?'<span class="tsep"></span><button class="btab com'+(curB==='__com'?' on':'')+'" onclick="selB(\'__com\')">Qeyri-yaşayış</button>':'')+(hasG?(hasC?'':'<span class="tsep"></span>')+'<button class="btab com'+(curB==='__gar'?' on':'')+'" onclick="selB(\'__gar\')">Qaraj</button>':'');renderBoard();}
function selB(k){curB=k;renderTabs();}
function esc2(x){return String(x==null?'':x).replace(/[<>&"]/g,'');}
function renderGar(){var c={},t=0;var bks=Object.keys(GAR);
 bks.forEach(function(bn){var rw=(GAR[bn]&&GAR[bn].rows)||{};Object.keys(rw).forEach(function(f){(rw[f]||[]).forEach(function(u){t++;c[u.s]=(c[u.s]||0)+1;});});});
 var sm='<div class="cur"><b>'+t+'</b> qaraj yeri';['satisda','satilib','investor','sakin','fond','satilmir'].forEach(function(k){if(c[k])sm+=' · <span style="color:'+(k==='satisda'?'var(--ink)':ST[k][1])+';font-weight:700">'+c[k]+' '+ST[k][0].toLowerCase()+'</span>';});
 sm+='<div class="rooms">3, 4, 9, 13, 17, 18, 19 saylı binaların −1 mərtəbəsi</div></div>';
 var sd=c.satilib||0;sm+='<div class="all"><div class="lbl">Qaraj</div><div class="nums"><div class="n"><b>'+(c.satisda||0)+'</b><span>boş (satışda)</span></div><div class="n"><b style="color:'+ST.satilib[1]+'">'+sd+'</b><span>satılıb'+(t?' ('+Math.round(sd*100/t)+'%)':'')+'</span></div></div></div>';
 document.getElementById('summary').innerHTML=sm;var h='';
 bks.forEach(function(bn){var b=GAR[bn];if(!b||!b.rows)return;Object.keys(b.rows).map(Number).sort(function(a,b){return b-a;}).forEach(function(f){var units=b.rows[f]||[];if(!units.length)return;var lb=(b.labels&&b.labels[f])?b.labels[f]:f;
  h+='<div class="cblk"><div class="ch"><b>'+esc2(lb)+'</b><span>'+units.length+' yer</span></div><div class="ggrid">';
  units.forEach(function(u){var match=(!fStat||u.s===fStat);var glass=u.s==='satisda';h+='<div class="ucell'+(glass?' glass':'')+(match?'':' dim')+'" style="'+(glass?'':'background:'+(ST[u.s]?ST[u.s][1]:'#888'))+'" title="Qaraj №'+esc2(u.n)+' · '+(ST[u.s]?ST[u.s][0]:u.s)+'">'+esc2(u.n)+(u.area?'<span class="ar">'+esc2(u.area)+'</span>':'')+'</div>';});
  h+='</div></div>';});});
 var bd=document.getElementById('board');bd.innerHTML=h||'<p style="color:var(--muted)">Məlumat yoxdur.</p>';bd.classList.remove('wide');}
function renderCom(){var c={},t=0,m2=0,m2s=0,m2d=0;var bks=Object.keys(COMM);
 bks.forEach(function(bn){var rw=(COMM[bn]&&COMM[bn].rows)||{};Object.keys(rw).forEach(function(f){(rw[f]||[]).forEach(function(u){t++;c[u.s]=(c[u.s]||0)+1;var a=parseFloat(u.area)||0;m2+=a;if(u.s==='satisda')m2s+=a;if(u.s==='satilib')m2d+=a;});});});
 var f2=function(x){return x.toLocaleString('az-AZ',{maximumFractionDigits:0});};
 var sm='<div class="cur"><b>'+t+'</b> qeyri-yaşayış obyekti';['satisda','satilib','investor','sakin','fond','satilmir'].forEach(function(k){if(c[k])sm+=' · <span style="color:'+(k==='satisda'?'var(--ink)':ST[k][1])+';font-weight:700">'+c[k]+' '+ST[k][0].toLowerCase()+'</span>';});
 sm+='<div class="rooms">'+bks.length+' bina · ümumi sahə '+f2(m2)+' m²</div></div>';
 sm+='<div class="all"><div class="lbl">Qeyri-yaşayış sahəsi</div><div class="nums"><div class="n"><b>'+f2(m2s)+'</b><span>m² satışda</span></div><div class="n"><b style="color:'+ST.satilib[1]+'">'+f2(m2d)+'</b><span>m² satılıb</span></div></div></div>';
 document.getElementById('summary').innerHTML=sm;
 var h='',wide=false;
 bks.forEach(function(bn){var b=COMM[bn];if(!b||!b.rows)return;var n=0,sd=0;Object.keys(b.rows).forEach(function(f){(b.rows[f]||[]).forEach(function(u){n++;if(u.s==='satilib')sd++;});});
  h+='<div class="cblk"><div class="ch"><b>'+esc2(bn)+'</b><span>'+n+' obyekt · '+sd+' satılıb</span></div>';
  Object.keys(b.rows).map(Number).sort(function(a,b){return b-a;}).forEach(function(f){var units=b.rows[f]||[];if(!units.length)return;var lb=(b.labels&&b.labels[f])?b.labels[f]:(f<0?'Z':f);if(String(lb).length>3)wide=true;
   h+='<div class="frow"><div class="fnum">'+esc2(lb)+'</div><div class="funits">';
   units.forEach(function(u){var match=(!fStat||u.s===fStat);var glass=u.s==='satisda';h+='<div class="ucell'+(glass?' glass':'')+(match?'':' dim')+'" style="'+(glass?'':'background:'+(ST[u.s]?ST[u.s][1]:'#888'))+'" title="'+esc2(bn)+' · '+esc2(lb)+(u.n?' · №'+esc2(u.n):'')+(u.area?' · '+esc2(u.area)+' m²':'')+' · '+(ST[u.s]?ST[u.s][0]:u.s)+'">'+(u.n?'№'+esc2(u.n):'—')+(u.area?'<span class="ar">'+esc2(u.area)+'</span>':'')+'</div>';});
   h+='</div></div>';});
  h+='</div>';});
 var bd=document.getElementById('board');bd.innerHTML=h||'<p style="color:var(--muted)">Məlumat yoxdur.</p>';bd.classList.toggle('wide',wide);}

var CH_COL={satisda:'#e3b9a3'};
function openChart(){var c={},t=0;Object.keys(SALES).forEach(function(bn){var rw=(SALES[bn]&&SALES[bn].rows)||{};Object.keys(rw).forEach(function(f){(rw[f]||[]).forEach(function(u){if(u.s==='qeyri'||u.s==='zirzemi')return;t++;c[u.s]=(c[u.s]||0)+1;});});});
 var ks=['satisda','satilib','investor','sakin','fond','satilmir'].concat(Object.keys(c).filter(function(k){return ['satisda','satilib','investor','sakin','fond','satilmir'].indexOf(k)<0;})).filter(function(k){return c[k];});
 var R=15.9155,off=25,seg='';ks.forEach(function(k){var col=CH_COL[k]||(ST[k]?ST[k][1]:'#999');var pct=c[k]*100/t;seg+='<circle cx="21" cy="21" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="6" stroke-dasharray="'+pct+' '+(100-pct)+'" stroke-dashoffset="'+off+'"><title>'+(ST[k]?ST[k][0]:k)+': '+c[k]+'</title></circle>';off-=pct;});
 var h='<div class="donut"><svg viewBox="0 0 42 42" width="200" height="200"><circle cx="21" cy="21" r="'+R+'" fill="none" stroke="#f1e8e0" stroke-width="6"/>'+seg+'</svg><div class="c"><b>'+t+'</b><span>ümumi mənzil</span></div></div><ul>';
 ks.forEach(function(k){var col=CH_COL[k]||(ST[k]?ST[k][1]:'#999');h+='<li><i style="background:'+col+'"></i><span class="nm">'+(ST[k]?ST[k][0]:k)+'</span><span class="ct">'+c[k]+'</span><span class="pc">'+(Math.round(c[k]*1000/t)/10)+'%</span></li>';});
 h+='</ul>';document.getElementById('chartBody').innerHTML=h;document.getElementById('chartModal').classList.add('on');}
function closeChart(){document.getElementById('chartModal').classList.remove('on');}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeChart();});

function renderBoard(){if(curB==='__com'){renderCom();return;}if(curB==='__gar'){renderGar();return;}var b=SALES[curB];if(!b){return;}var c={},byRoom={},total=0;
 Object.keys(b.rows).forEach(function(f){b.rows[f].forEach(function(u){c[u.s]=(c[u.s]||0)+1;if(u.s==='qeyri'||u.s==='zirzemi')return;total++;if(u.s==='satisda'&&u.room)byRoom[u.room]=(byRoom[u.room]||0)+1;});});
 var sm='<div class="cur"><b>'+total+'</b> mənzil';['satisda','satilib','investor','sakin','fond','satilmir'].forEach(function(k){if(c[k])sm+=' · <span style="color:'+ST[k][1]+';font-weight:700">'+c[k]+' '+ST[k][0].toLowerCase()+'</span>';});
 sm+='<div class="rooms">Boş (satışda): '+(Object.keys(byRoom).length?Object.keys(byRoom).sort().map(function(r){return r+' otaqlı — '+byRoom[r];}).join('  ·  '):'—')+'</div>';
 sm+='</div>';var aT=0,aS=0;Object.keys(SALES).forEach(function(bn){var rw=(SALES[bn]&&SALES[bn].rows)||{};Object.keys(rw).forEach(function(f){(rw[f]||[]).forEach(function(u){if(u.s==='qeyri'||u.s==='zirzemi')return;aT++;if(u.s==='satilib')aS++;});});});sm+='<div class="all"><div class="lbl">Bütün binalar <button class="chbtn" onclick="openChart()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Ətraflı</button></div><div class="nums"><div class="n"><b>'+aT+'</b><span>ümumi mənzil</span></div><div class="n"><b style="color:'+ST.satilib[1]+'">'+aS+'</b><span>satılıb'+(aT?' ('+Math.round(aS*100/aT)+'%)':'')+'</span></div></div></div>';document.getElementById('summary').innerHTML=sm;
 var fls=Object.keys(b.rows).map(Number).sort(function(a,b){return b-a;});var h='';
 fls.forEach(function(f){var units=b.rows[f]||[];if(!units.length)return;var allQ=units.length&&units.every(function(u){return u.s==='qeyri';});var allZ=units.length&&units.every(function(u){return u.s==='zirzemi';});h+='<div class="frow"><div class="fnum">'+(b.labels&&b.labels[f]?String(b.labels[f]).replace(/[<>&"]/g,''):(f<0?'Z':f))+'</div><div class="funits">';if(allZ){h+='<div class="gbar">Zirzəmi</div></div></div>';return;}if(allQ){h+='<div class="gbar">Qeyri-yaşayış sahəsi</div></div></div>';return;}units.forEach(function(u){var showA=u.area&&u.s!=='sakin';var match=(!fRoom||String(u.room)===String(fRoom))&&(!fStat||u.s===fStat);var glass=u.s==='satisda';h+='<div class="ucell'+(glass?' glass':'')+(match?'':' dim')+'" style="'+(glass?'':'background:'+(ST[u.s]?ST[u.s][1]:'#888')+(u.s==="sakin"?";color:#3a2410":""))+'" title="'+f+'-ci mərtəbə'+(u.room?' · '+u.room+' otaqlı':'')+(u.area&&u.s!=='sakin'?' · '+u.area+' m²':'')+' · '+(ST[u.s]?ST[u.s][0]:u.s)+'">'+(u.room?u.room:'')+(showA?'<span class="ar">'+u.area+'</span>':'')+'</div>';});h+='</div></div>';});
 var bd=document.getElementById('board');bd.innerHTML=h;bd.classList.toggle('wide',!!(b.labels&&Object.keys(b.labels).some(function(k){return String(b.labels[k]).length>3&&(b.rows[k]||[]).length;})));}
</script></body></html>
