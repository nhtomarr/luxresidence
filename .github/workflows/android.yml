name: Android tətbiqi
on:
  push:
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Asılılıqlar
        run: npm install --no-audit --no-fund
      - name: Android layihəsi
        run: npx cap add android
      - name: İkon və açılış ekranı
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0f172a' --splashBackgroundColor '#0f172a'
      - name: İcazələr (kamera, yer, bildiriş)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' $M
          grep -c CAMERA $M
      - name: Firebase (varsa)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then echo "$GSJ" > android/app/google-services.json; echo "FCM aktiv"; else echo "google-services.json yoxdur — bildirişlərsiz yığılır"; fi
      - name: Sinxronizasiya
        run: npx cap sync android
      - name: APK yığ
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bas-ofis-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
