name: Android tətbiqi
on:
  push:
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Asılılıqlar
        run: npm install --no-audit --no-fund
      - name: Android layihəsi
        run: npx cap add android
      - name: İkon və açılış ekranı
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0f172a' --splashBackgroundColor '#0f172a'
      - name: İcazələr (kamera, yer, bildiriş)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' $M
          grep -c CAMERA $M
      - name: Firebase (varsa)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then echo "$GSJ" > android/app/google-services.json; echo "FCM aktiv"; else echo "google-services.json yoxdur — bildirişlərsiz yığılır"; fi
      - name: İmza açarı (varsa)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > $RUNNER_TEMP/upload.jks; echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV; echo "imza: var"; else echo "imza: yox"; fi
      - name: Sinxronizasiya
        run: npx cap sync android
      - name: APK + AAB yığ
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then ./gradlew assembleRelease bundleRelease --no-daemon; else ./gradlew assembleDebug --no-daemon; fi
          mkdir -p ../out
          cp app/build/outputs/apk/*/*.apk ../out/ 2>/dev/null || true
          cp app/build/outputs/bundle/release/*.aab ../out/ 2>/dev/null || true
          ls -la ../out
      - uses: actions/upload-artifact@v4
        with:
          name: bas-ofis-apk
          path: mobile/out/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bas-ofis-play-aab
          path: mobile/out/*.aab
          if-no-files-found: ignore
